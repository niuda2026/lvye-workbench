<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>履约安全工作台</title>
<script>
/* ===== 访问控制：未登录自动跳转登录页（2026-09-05 安全加固） ===== */
/* 安全说明：不再信任 URL 里的 ?user= 参数——此前任何人拿到带 ?user= 的链接
   都能免登录直接进看板。登录态现统一存放在 localStorage['xd_auth_v2']
   （由登录页校验通过后写入，12 小时有效），跨标签页/同域名共享，
   file:// 本地打开同样有效。URL 参数不再具备任何放行能力。 */
function xdAuthGetUser(){
  try{
    var raw = localStorage.getItem('xd_auth_v2');
    if (raw){
      var s = JSON.parse(raw);
      if (s && s.user && s.exp && Date.now() < s.exp) return s.user;
      try { localStorage.removeItem('xd_auth_v2'); } catch(e){}
    }
  }catch(e){}
  try{ return sessionStorage.getItem('xd_login_user') || null; }catch(e){ return null; }
}
(function(){
  if (xdAuthGetUser()) return;
  location.replace('履约工作台登录页.html');
})();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI','Microsoft YaHei','PingFang SC',Arial,sans-serif;font-size:13px;color:#1a2e45;background:#F0F6FC}

/* ===== Layout ===== */
.workspace{display:flex;height:100vh;width:100vw}

/* ===== Sidebar ===== */
.sidebar{width:190px;min-width:190px;background:linear-gradient(180deg,#0A3D6B,#0B4F8A);border-right:1px solid #0A3D6B;display:flex;flex-direction:column;overflow:hidden;transition:width .2s}
.sidebar-header{background:linear-gradient(135deg,#0B4F8A,#1E88E5);padding:15px 8px;flex-shrink:0;display:flex;align-items:center;gap:6px}
.sidebar-brand-col{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0}
.sidebar-logo{height:30px;width:auto;flex-shrink:0}
.sidebar-text{display:flex;flex-direction:column;gap:4px}
.sidebar-brand{font-size:14px;font-weight:700;color:#fff;line-height:1;letter-spacing:2px}
.sidebar-title{font-size:19px;font-weight:700;color:#fff;line-height:1.2;letter-spacing:0;white-space:nowrap}
.sidebar-subtitle{font-size:10px;color:#C9DBEC;line-height:1.2;letter-spacing:1px}
.sidebar-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 0}
.sidebar-nav::-webkit-scrollbar{width:4px}
        .sidebar-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.3);border-radius:2px}
        /* 个人中心 */
        .profile-box{border-top:1px solid rgba(255,255,255,.12);padding:10px 8px;flex-shrink:0;cursor:pointer;transition:background .2s}
        .profile-box:hover{background:rgba(255,255,255,.06)}
        .profile-row{display:flex;align-items:center;gap:8px}
        .profile-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#FFC107,#FF9800);color:#3a2c00;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .profile-info{min-width:0;flex:1}
        .profile-name{color:#fff;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .profile-role{color:rgba(255,255,255,.55);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .profile-more{color:rgba(255,255,255,.4);font-size:12px}
        .profile-pop{display:none;position:fixed;left:210px;bottom:70px;width:280px;background:rgba(10,28,52,.97);border:1px solid rgba(90,170,255,.35);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:999;overflow:hidden}
        .profile-pop.show{display:block}
        .profile-pop-head{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
        .profile-pop-head .avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#FFC107,#FF9800);color:#3a2c00;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:16px}
        .profile-pop-head .nm{color:#fff;font-size:15px;font-weight:700}
        .profile-pop-head .rl{color:rgba(255,255,255,.55);font-size:12px;margin-top:2px}
        .profile-pop-body{padding:12px 16px}
        .profile-pop-body .item{display:flex;gap:10px;padding:6px 0;font-size:12px}
        .profile-pop-body .item .k{color:rgba(255,255,255,.45);flex-shrink:0;width:56px}
        .profile-pop-body .item .v{color:#dcecff;word-break:break-all;line-height:1.5}
        .sidebar.compact .profile-box{justify-content:center;padding:10px 4px}
        .sidebar.compact .profile-info,.sidebar.compact .profile-more{display:none}

/* ===== Group ===== */
.nav-group{border-bottom:1px solid rgba(255,255,255,.12)}
.nav-group-header{display:flex;align-items:center;padding:11px 14px;cursor:pointer;user-select:none;transition:background .15s;margin-top:2px}
.nav-group-header:hover{background:rgba(255,255,255,.12)}
.nav-group-arrow{display:inline-block;width:16px;height:16px;font-size:10px;line-height:16px;text-align:center;color:#C9DBEC;transition:transform .2s;flex-shrink:0}
.nav-group-arrow.collapsed{transform:rotate(-90deg)}
.nav-group-title{font-size:14px;font-weight:700;color:#fff;margin-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.5px}

/* ===== Items ===== */
.nav-items{overflow:hidden;transition:max-height .25s ease}
.nav-items.collapsed{max-height:0!important}
.nav-item{display:block;padding:8px 14px 8px 34px;cursor:pointer;color:#C9DBEC;font-size:12px;text-decoration:none;transition:all .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid transparent}
.nav-item:hover{background:rgba(255,255,255,.15);color:#fff}
.nav-item.active{background:linear-gradient(90deg,rgba(79,195,247,.30),rgba(79,195,247,.06));color:#fff;font-weight:600;border-left-color:#4FC3F7}
.nav-item.placeholder{color:rgba(255,255,255,.45);font-style:italic}

/* ===== Main Content ===== */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#F0F6FC}

/* Iframe area */
.iframe-wrap{flex:1;position:relative;background:#fff}
.iframe-wrap iframe{width:100%;height:100%;border:none;display:block}
#placeholder{display:none;position:absolute;top:0;left:0;right:0;bottom:0;align-items:center;justify-content:center}
#placeholder.show{display:flex}
#placeholder .placeholder-content{text-align:center;color:#90a4ae}
#placeholder .placeholder-icon{font-size:48px;margin-bottom:12px;opacity:.4}
#placeholder .placeholder-text{font-size:14px}

/* ===== Resize Handle ===== */
.resize-handle{width:4px;background:transparent;cursor:col-resize;flex-shrink:0;position:relative;z-index:10}
.resize-handle:hover,.resize-handle.dragging{background:#0B4F8A}

/* ===== Sidebar Toggle Button ===== */
.sidebar{position:relative}
.sidebar-toggle{position:absolute;right:-2px;top:50%;transform:translateY(-50%);width:16px;height:44px;background:#0B4F8A;color:#fff;border:none;border-radius:4px 0 0 4px;cursor:pointer;z-index:20;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;opacity:.9;transition:opacity .15s;padding:0}
.sidebar-toggle:hover{opacity:1}

/* ===== Nav Flyout (悬浮分组菜单) ===== */
.nav-flyout{display:none;position:fixed;min-width:230px;max-width:300px;background:linear-gradient(180deg,#0E2C50,#0A1F3B);border:1px solid rgba(79,195,247,.4);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.5);padding:6px;z-index:999}
.nav-flyout::before{content:'';position:absolute;left:-7px;top:16px;border:7px solid transparent;border-right-color:rgba(79,195,247,.4)}
.nav-flyout::after{content:'';position:absolute;left:-5px;top:17px;border:6px solid transparent;border-right-color:#0E2C50}
.nav-flyout-title{font-size:11px;color:rgba(255,255,255,.5);padding:5px 10px 7px;border-bottom:1px solid rgba(255,255,255,.09);margin-bottom:4px;letter-spacing:.5px}
.nav-flyout-item{display:block;padding:9px 12px;border-radius:6px;color:#C9DBEC;font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .12s;border-left:3px solid transparent;user-select:none}
.nav-flyout-item:hover{background:rgba(79,195,247,.16);color:#fff;border-left-color:#4FC3F7}
.nav-flyout-item.active{background:linear-gradient(90deg,rgba(79,195,247,.32),rgba(79,195,247,.06));color:#fff;font-weight:600;border-left-color:#4FC3F7}
.nav-flyout-item.placeholder{position:static;display:block;color:rgba(255,255,255,.45);font-style:italic}
.nav-group-header{position:relative}
.nav-group-header.active{background:linear-gradient(90deg,rgba(79,195,247,.28),rgba(79,195,247,.05));border-left:3px solid #4FC3F7;padding-left:11px}
.nav-group-header .flyout-hint{display:none;margin-left:auto;color:rgba(255,255,255,.4);font-size:11px;padding-left:8px;flex-shrink:0}
.nav-group-header:hover .flyout-hint{display:inline-block}
.sidebar.compact .nav-group-header .flyout-hint{display:none!important}

/* ===== Compact Sidebar ===== */
.sidebar.compact{width:64px!important;min-width:64px!important}
.sidebar.compact .sidebar-header{justify-content:center;padding:12px 2px;height:76px}
.sidebar.compact .sidebar-brand-col{display:flex}
.sidebar.compact .sidebar-brand{display:none}
.sidebar.compact .sidebar-text{display:none}
.sidebar.compact .nav-group-header{justify-content:center;padding:10px 2px}
.sidebar.compact .nav-group-arrow{display:none}
.sidebar.compact .nav-items{display:none!important}
.nav-group-title .short{display:none}
.sidebar.compact .nav-group-title{font-size:13px;font-weight:600;color:#fff;margin-left:0;text-align:center;width:100%}
.sidebar.compact .nav-group-title .full{display:none}
.sidebar.compact .nav-group-title .short{display:inline}
</style>
</head>

<script>
// ===== 个人中心 =====
var CURRENT_USER = null;
var AUTH_API = 'auth_users.json';
var BOARDS_API = 'boards.json';
// 从服务端同步看板清单（boards.json），失败时保留本地兜底 navGroups
function loadBoardConfig(){
  buildNav();
  fetch(BOARDS_API).then(function(r){ return r.json(); }).then(function(cfg){
    if (cfg && cfg.groups && cfg.groups.length){
      navGroups = cfg.groups;
      buildNav();
    }
  }).catch(function(){ /* 服务不可用，保持本地兜底导航 */ });
}
function initProfile(){
  var q = new URLSearchParams(location.search);
  var name = xdAuthGetUser();
  if (name){
    CURRENT_USER = { name: name };
    fetch(AUTH_API).then(function(r){ return r.json(); }).then(function(cfg){
      var u = null;
      (cfg.users || []).forEach(function(x){ if (x.name === name) u = x; });
      if (u) CURRENT_USER = u;
      renderProfile();
      loadBoardConfig(); // 拉取用户权限 + 服务端看板清单后重建导航
    }).catch(function(){ renderProfile(); loadBoardConfig(); });
    return;
  }
  renderProfile();
}
function renderProfile(){
  var u = CURRENT_USER;
  var el = function(id){ return document.getElementById(id); };
  if (!u){
    el('profileName').textContent = '未登录';
    el('profileRole').textContent = '请通过登录页进入';
    el('profileAvatar').textContent = '?';
    return;
  }
  var ch = (u.name || '?').charAt(0);
  el('profileName').textContent = u.name;
  el('profileRole').textContent = u.role || '—';
  el('profileAvatar').textContent = ch;
  el('popName').textContent = u.name;
  el('popRole').textContent = u.role || '—';
  el('popAvatar').textContent = ch;
  el('popMobile').textContent = u.mobile || '—';
  el('popRole2').textContent = u.role || '—';
  el('popArea').textContent = u.area || '—';
  el('popPerm').textContent = permSummary(u);
  el('popAdminBtn').style.display = 'none'; // 公网版隐藏管理后台入口
}
function openAdmin(){
  window.open('名单管理后台.html', '_blank');
}
function toggleProfile(e){
  document.getElementById('profilePop').classList.toggle('show');
  if (e) e.stopPropagation();
}
document.addEventListener('click', function(e){

    document.getElementById('profilePop').classList.remove('show');

    hideFlyout();

});

// ===== Navigation Config =====
var navGroups = [

// ===== 权限控制 =====
// 语义：boards/areas 未配置或为空数组 = 不限制（全部可见）；配置后仅允许勾选项
function allowedItems(group){
  var u = CURRENT_USER;
  var items = group.items;
  if (!u || u.admin || !u.boards || !u.boards.length) return items;
  return items.filter(function(it){ return !it.file || u.boards.indexOf(it.key) >= 0; });
}
function withArea(file){
  var u = CURRENT_USER;
  if (!u || u.admin || !u.areas || !u.areas.length) return file;
  var hash = '';
  var base = file;
  var hi = file.indexOf('#');
  if (hi >= 0){ hash = file.substring(hi); base = file.substring(0, hi); }
  return base + (base.indexOf('?') >= 0 ? '&' : '?') + 'area=' + encodeURIComponent(u.areas.join(',')) + hash;
}
function permSummary(u){
  if (!u) return '—';
  if (u.admin) return '管理员：全部看板 / 全部区域';
  var b = (u.boards && u.boards.length) ? u.boards.length + ' 个看板' : '全部看板';
  var a = (u.areas && u.areas.length) ? u.areas.join('、') : '全部区域';
  return b + ' / ' + a;
}

// ===== State =====
var activeItem = null;     // { groupIdx, itemIdx }
var firstFileItem = null;  // first item with a file

// ===== Build Navigation =====
function buildNav() {
  var nav = document.getElementById('sidebarNav');
  var html = '';
  firstFileItem = null;

  navGroups.forEach(function(group, gi) {
    var items = allowedItems(group);
    if (!items.length) return; // 当前用户无任何可见看板，整组隐藏

    items.forEach(function(item, ii) {
      if (!firstFileItem && item.file) {
        firstFileItem = { groupIdx: gi, itemIdx: ii };
      }
    });

    html += '<div class="nav-group">';
    html += '<div class="nav-group-header" data-gi="' + gi + '" onmouseenter="showFlyout(' + gi + ', this)" onmouseleave="scheduleHideFlyout()" onclick="showFlyout(' + gi + ', this)">';
    html += '<span class="nav-group-title"><span class="full">' + escHtml(group.title) + '</span><span class="short">' + escHtml(group.short || group.title) + '</span></span>';
    html += '<span class="flyout-hint">›</span>';
    html += '</div>';
    html += '</div>';
  });

  nav.innerHTML = html;

  // Default: select first file item
  if (firstFileItem) {
    selectItem(firstFileItem.groupIdx, firstFileItem.itemIdx);
  }
}

// ===== Toggle Compact Sidebar =====
function toggleCompact() {
  var sidebar = document.getElementById('sidebar');
  var btn = document.getElementById('sidebarToggle');
  if (!sidebar || !btn) return;
  if (sidebar.classList.contains('compact')) {
    sidebar.classList.remove('compact');
    sidebar.style.width = '';
    btn.textContent = '«';
    btn.title = '收起导航';
  } else {
    sidebar.classList.add('compact');
    sidebar.style.width = '64px';
    btn.textContent = '»';
    btn.title = '展开导航';
  }
}

// ===== Select Item =====
function selectItem(gi, ii, el) {
  // Remove all active
  document.querySelectorAll('.nav-item.active, .nav-flyout-item.active').forEach(function(item) { item.classList.remove('active'); });

  // Set active
  var targetEl = el || document.querySelector('.nav-flyout-item[data-key="' + gi + '-' + ii + '"]');
  if (targetEl) targetEl.classList.add('active');

  activeItem = { groupIdx: gi, itemIdx: ii };
  highlightGroup(gi);

  var group = navGroups[gi];
  var item = group.items[ii];
  var hasFile = !!item.file;

  var iframe = document.getElementById('contentFrame');
  var placeholder = document.getElementById('placeholder');

  if (hasFile) {
    // 附加时间戳强制重新加载，避免浏览器缓存旧数据（数据更新后点开即刷新）；带区域权限时附加 area 参数
    var file = withArea(item.file);
    var sep = file.indexOf('?') >= 0 ? '&' : '?';
    iframe.src = file + sep + 't=' + Date.now();
    iframe.style.display = 'block';
    placeholder.classList.remove('show');
  } else {
    iframe.src = '';
    iframe.style.display = 'none';
    placeholder.classList.add('show');
    document.getElementById('placeholderText').textContent = '暂无数据，请后续补充';
  }
}

// ===== Nav Flyout (悬浮分组菜单) =====
var flyoutTimer = null;
var currentFlyoutGroup = -1;

function showFlyout(gi, headerEl) {
  cancelHideFlyout();
  var flyout = document.getElementById('navFlyout');
  var group = navGroups[gi];
  if (!group || !flyout) return;
  var items = allowedItems(group);
  if (!items.length) return;

  var html = '<div class="nav-flyout-title">' + escHtml(group.title) + '</div>';
  items.forEach(function(item, ii) {
    var hasFile = !!item.file;
    var cls = 'nav-flyout-item' + (!hasFile ? ' placeholder' : '');
    if (activeItem && activeItem.groupIdx === gi && activeItem.itemIdx === ii) cls += ' active';
    html += '<div class="' + cls + '" data-key="' + gi + '-' + ii + '" onclick="selectFromFlyout(' + gi + ',' + ii + ')">' + escHtml(item.label) + '</div>';
  });
  flyout.innerHTML = html;

  // 定位到分组右侧
  var r = headerEl.getBoundingClientRect();
  flyout.style.left = Math.min(r.right + 8, window.innerWidth - 320) + 'px';
  flyout.style.top = Math.max(8, r.top - 4) + 'px';
  flyout.style.display = 'block';
  currentFlyoutGroup = gi;
}

function scheduleHideFlyout() {
  cancelHideFlyout();
  flyoutTimer = setTimeout(function() {
    hideFlyout();
  }, 400);
}

function cancelHideFlyout() {
  if (flyoutTimer) { clearTimeout(flyoutTimer); flyoutTimer = null; }
}

function hideFlyout() {
  cancelHideFlyout();
  var flyout = document.getElementById('navFlyout');
  if (flyout) flyout.style.display = 'none';
  currentFlyoutGroup = -1;
}

function selectFromFlyout(gi, ii) {
  selectItem(gi, ii, null);
  hideFlyout();
}

function highlightGroup(gi) {
  document.querySelectorAll('.nav-group-header.active').forEach(function(el) { el.classList.remove('active'); });
  var h = document.querySelector('.nav-group-header[data-gi="' + gi + '"]');
  if (h) h.classList.add('active');
}

// ===== Resize =====
(function() {
  var handle = document.getElementById('resizeHandle');
  var sidebar = document.getElementById('sidebar');
  var startX, startWidth;

  handle.addEventListener('mousedown', function(e) {
    // Exit compact mode before resizing
    if (sidebar.classList.contains('compact')) {
      toggleCompact();
    }
    startX = e.clientX;
    startWidth = sidebar.offsetWidth;
    handle.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';

    function onMove(e) {
      var newWidth = startWidth + (e.clientX - startX);
      newWidth = Math.max(200, Math.min(400, newWidth));
      sidebar.style.width = newWidth + 'px';
    }

    function onUp() {
      handle.classList.remove('dragging');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
})();

// ===== Helpers =====
function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function escAttr(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ===== Init =====
loadBoardConfig();
// 默认进入紧凑导航形态：侧边栏只显示分组两字简称（悬浮菜单等交互保持不变）
toggleCompact();

// ===== 全页截图：接收壳页拼合结果（表头+看板内容），贴回整页后下载 =====
function xdToast(msg){
  var t=document.getElementById('xdToast');
  if(!t){
    t=document.createElement('div'); t.id='xdToast';
    t.style.cssText='position:fixed;right:24px;bottom:24px;background:rgba(10,31,59,.92);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:9999;box-shadow:0 6px 20px rgba(0,0,0,.35);transition:opacity .3s;opacity:0';
    document.body.appendChild(t);
  }
  t.textContent=msg; t.style.opacity='1';
}
function xdToastHide(){
  var t=document.getElementById('xdToast');
  if(t){ t.style.opacity='0'; }
}
window.addEventListener('message',function(ev){
  var d=ev.data||{};
  if(d.type!=='xd-shell-shot') return;
  if(typeof html2canvas!=='function'){ alert('截图库未加载，请检查网络后刷新重试'); return; }
  xdToast('正在生成全页截图…');
  var frame=document.getElementById('contentFrame');
  var r=frame?frame.getBoundingClientRect():null;
  // 拿不到看板区域位置时，退化为直接下载壳页拼图，保证一定能出图
  if(!r || !r.width || !d.w){
    var a0=document.createElement('a');
    a0.download='全页截图_'+Date.now()+'.png'; a0.href=d.dataUrl; document.body.appendChild(a0); a0.click(); a0.remove();
    xdToast('✅ 截图已生成（未含左侧导航）');
    setTimeout(xdToastHide,6000);
    return;
  }
  html2canvas(document.body,{scale:2,useCORS:true,backgroundColor:'#F0F6FC',
    width:window.innerWidth,height:window.innerHeight,
    windowWidth:window.innerWidth,windowHeight:window.innerHeight
  }).then(function(topCv){
    var img=new Image();
    img.onload=function(){
      // 壳页拼图等比拉伸铺满看板区域
      var dw=r.width, dh=d.h*(r.width/d.w);
      var s=2;
      var out=document.createElement('canvas');
      out.width=topCv.width;
      out.height=Math.max(topCv.height,Math.round((r.top+dh)*s));
      var ctx=out.getContext('2d');
      // 画布超出整屏高度时，下方补底色（左侧补侧栏蓝、右侧补页面底色）
      ctx.fillStyle='#F0F6FC'; ctx.fillRect(0,0,out.width,out.height);
      if(out.height>topCv.height){
        var sw=(r.left>0?r.left:0);
        ctx.fillStyle='#0B4F8A'; ctx.fillRect(0,topCv.height,Math.round(sw*s),out.height-topCv.height);
        ctx.fillStyle='#F0F6FC'; ctx.fillRect(Math.round(sw*s),topCv.height,out.width-Math.round(sw*s),out.height-topCv.height);
      }
      ctx.drawImage(topCv,0,0);
      ctx.drawImage(img,Math.round(r.left*s),Math.round(r.top*s),Math.round(dw*s),Math.round(dh*s));
      var dt=new Date();
      function p(n){ return (n<10?'0':'')+n; }
      var name='履约工作台_全页截图_'+dt.getFullYear()+p(dt.getMonth()+1)+p(dt.getDate())+'_'+p(dt.getHours())+p(dt.getMinutes())+p(dt.getSeconds())+'.png';
      // Blob 方式下载（大图更稳，避免被浏览器静默拦截）
      if(out.toBlob){
        out.toBlob(function(b){
          var url=URL.createObjectURL(b), a=document.createElement('a');
          a.href=url; a.download=name; document.body.appendChild(a); a.click();
          setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },30000);
          xdToast('✅ 全页截图已生成：'+name);
          setTimeout(xdToastHide,6000);
        },'image/png');
      }else{
        var a=document.createElement('a');
        a.download=name; a.href=out.toDataURL('image/png'); document.body.appendChild(a); a.click(); a.remove();
        xdToast('✅ 全页截图已生成：'+name);
        setTimeout(xdToastHide,6000);
      }
    };
    img.onerror=function(){ xdToastHide(); alert('全页截图拼合失败，请重试'); };
    img.src=d.dataUrl;
  }).catch(function(e){ xdToastHide(); alert('全页截图失败：'+(e&&e.message||e)); });
});
