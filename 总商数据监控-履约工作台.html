<script>
/* ===== 访问控制：未登录自动跳转登录页（2026-09-05 安全加固） ===== */
function xdAuthGetUser(){
  try{
    var raw = localStorage.getItem('xd_auth_v2');
    if (raw){
      var s = JSON.parse(raw);
      if (s && s.user && s.exp && Date.now() < s.exp) return s.user;
      try { localStorage.removeItem('xd_auth_v2'); } catch(e){}
    }
  }catch(e){}
  try{ return sessionStorage.getItem('xd_login_user') || null; }catch(e){ return null; }
}
(function(){
  if (xdAuthGetUser()) return;
  location.replace('履约工作台登录页.html');
})();
</script>
<style>
:root{
  --header-h:50px;
  --notify-h:38px;
  --sidebar-open:200px;
  --sidebar-closed:60px;
  --sidebar:#1a2634;
  --sidebar-hover:#243447;
  --sidebar-active:#151f2b;
  --accent:#00bcd4;
  --accent-dark:#00acc1;
  --text:#eceff1;
  --text-muted:#90a4ae;
  --main-bg:#f0f2f5;
  --notify-bg:#fff8e1;
  --notify-text:#f57f17;
  --notify-border:#ffe082;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}

/* Header */
.top-header{height:var(--header-h);background:linear-gradient(90deg,#00acc1 0%,#26c6da 100%);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.15),inset 0 -3px 0 #FFD100;position:relative;z-index:30}
.header-left{display:flex;align-items:center;gap:12px}
.hamburger{width:36px;height:36px;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s}
.hamburger:hover{background:rgba(255,255,255,.15)}
.hamburger svg{width:22px;height:22px;fill:#fff}
.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600;letter-spacing:.3px}
.brand-dot{width:28px;height:28px;border-radius:50%;background:#FFD100;color:#3a2c00;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.header-right{display:flex;align-items:center;gap:18px;font-size:14px}
.header-right a,.header-right span{color:#fff;text-decoration:none;opacity:.95}
.header-right a:hover{opacity:1;text-decoration:underline}
.user-pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);padding:4px 10px;border:1px solid rgba(255,209,0,.55);border-radius:20px;cursor:pointer;transition:.2s;position:relative}
.user-pill:hover{background:rgba(255,255,255,.22);border-color:#FFD100}
.user-pill::after{content:"\25BE";font-size:10px;opacity:.85;margin-left:2px}
.user-avatar{width:24px;height:24px;border-radius:50%;background:#FFD100;color:#3a2c00;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.2)}

/* Notify */
.notify-bar{height:var(--notify-h);background:var(--notify-bg);border-bottom:1px solid var(--notify-border);color:var(--notify-text);display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:13px;flex-shrink:0;position:relative;z-index:29}
.notify-left{display:flex;align-items:center;gap:10px;overflow:hidden}
.notify-left svg{width:18px;height:18px;fill:var(--notify-text);flex-shrink:0}
.notify-items{display:flex;gap:18px;align-items:center;overflow:hidden;white-space:nowrap}
.notify-items span{cursor:pointer}
.notify-items span:hover{text-decoration:underline}
.notify-right{display:flex;align-items:center;gap:12px;flex-shrink:0}
.notify-right a{color:var(--notify-text);text-decoration:none}
.notify-close{width:22px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s}
.notify-close:hover{background:rgba(245,127,23,.12)}
.notify-close svg{width:14px;height:14px;fill:var(--notify-text)}

/* Body */
.body-wrap{flex:1;display:flex;overflow:hidden;position:relative}

/* Sidebar */
.sidebar{width:var(--sidebar-open);background:var(--sidebar);color:var(--text);display:flex;flex-direction:column;transition:width .25s ease;flex-shrink:0;overflow:hidden;position:relative;z-index:20}
.sidebar.collapsed{width:var(--sidebar-closed);overflow:visible}
.sidebar-inner{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 0}
.sidebar.collapsed .sidebar-inner{overflow:visible}
.sidebar-inner::-webkit-scrollbar{width:4px}
.sidebar-inner::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px}

.menu-group{margin-bottom:4px}
.group-header{display:flex;align-items:center;height:42px;padding:0 16px;cursor:pointer;transition:.15s;white-space:nowrap;user-select:none;position:relative}
.group-header:hover{background:var(--sidebar-hover)}
.group-header.active{background:linear-gradient(90deg,rgba(0,188,212,.25),rgba(0,188,212,.06))}
.group-header.active::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;background:var(--accent);border-radius:0 2px 2px 0}
.group-icon{width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:12px;fill:currentColor;opacity:.9}
.sidebar.collapsed .group-icon{margin-right:0}
.sidebar.collapsed .group-text{display:none}
.group-text{flex:1;display:flex;align-items:center;justify-content:space-between;overflow:hidden}
.group-title{font-size:14px;opacity:1;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar.collapsed .group-title{opacity:0;width:0}
.group-arrow{font-size:11px;opacity:.7;transition:transform .2s;flex-shrink:0;margin-left:6px}
.group-arrow.collapsed{transform:rotate(-90deg)}
.sidebar.collapsed .group-arrow{display:none}

.group-items{overflow:hidden;transition:max-height .25s ease}
.group-items.collapsed{max-height:0!important}

.menu-item{display:flex;align-items:center;height:38px;padding:0 16px 0 50px;cursor:pointer;transition:.15s;position:relative;white-space:nowrap;color:var(--text-muted)}
.menu-item:hover{background:var(--sidebar-hover);color:#fff}
.menu-item.active{background:var(--sidebar-active);color:#fff}
.menu-item.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--accent);border-radius:0 2px 2px 0}
.menu-text{font-size:13px;opacity:1;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar.collapsed .menu-text{opacity:0;width:0}
.sidebar.collapsed .menu-item{padding-left:19px}

/* collapsed flyout submenu */
.sidebar.collapsed .group-header{position:relative;justify-content:center;padding:0;height:48px}
.sidebar.collapsed .menu-group{margin-bottom:6px}
.sidebar.collapsed .group-items{display:none}
.sidebar.collapsed .group-header:hover::after,
.sidebar.collapsed .menu-item:hover::after{
  display:none
}
.group-flyout{display:none;position:absolute;left:100%;top:0;min-width:200px;background:#1e2a35;border-radius:0 8px 8px 0;box-shadow:4px 0 16px rgba(0,0,0,.35);z-index:200;overflow:hidden}
.group-flyout .flyout-title{padding:12px 14px 8px;font-size:12px;color:#90a4ae;font-weight:600;letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,.06)}
.group-flyout .flyout-item{display:flex;align-items:center;height:40px;padding:0 14px;font-size:13px;color:#cfd8dc;cursor:pointer;transition:background .15s;white-space:nowrap}
.group-flyout .flyout-item:hover{background:rgba(0,188,212,.15);color:#fff}
.group-flyout .flyout-item.active{background:rgba(0,188,212,.22);color:#fff}
.group-flyout .flyout-item.active::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;background:var(--accent);border-radius:0 2px 2px 0}
.sidebar.collapsed .group-header:hover > .group-flyout{display:block}

.sidebar-footer{padding:10px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:var(--text-muted);white-space:nowrap;opacity:1;transition:opacity .2s}
.sidebar.collapsed .sidebar-footer{opacity:0}

/* Main */
.main{flex:1;display:flex;flex-direction:column;background:var(--main-bg);overflow:hidden;position:relative}
.breadcrumb{display:none;height:40px;background:#fff;border-bottom:1px solid #e0e0e0;align-items:center;padding:0 16px;font-size:13px;color:#555;flex-shrink:0}
.breadcrumb a{color:#2196f3;text-decoration:none;cursor:pointer}
.breadcrumb a:hover{text-decoration:underline}
.breadcrumb .sep{margin:0 6px;color:#bdbdbd}
.content-wrap{flex:1;position:relative;overflow:hidden;background:#fff}
.content-wrap iframe{width:100%;height:100%;border:none;display:block;background:#fff}

/* Welcome */
.welcome{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#555;text-align:center;background:var(--main-bg)}
.welcome.show{display:flex}
.welcome h1{font-size:32px;font-weight:400;color:#37474f;margin-bottom:12px}
.welcome p{font-size:16px;color:#78909c;margin:0}
.welcome .tiles{display:flex;gap:16px;margin-top:32px;flex-wrap:wrap;justify-content:center}
.tile{width:160px;height:100px;background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.2s;border:1px solid #e0e0e0}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.1);border-color:var(--accent)}
.tile svg{width:28px;height:28px;fill:var(--accent);margin-bottom:8px}
.tile span{font-size:14px;color:#455a64}

/* Profile popover */
.profile-pop{display:none;position:fixed;right:16px;top:56px;width:280px;background:rgba(26,38,52,.97);border:1px solid rgba(0,188,212,.35);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:999;overflow:hidden;color:#eceff1}
.profile-pop.show{display:block}
.profile-pop-head{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
.profile-pop-head .avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#FFC107,#FF9800);color:#3a2c00;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:16px}
.profile-pop-head .nm{color:#fff;font-size:15px;font-weight:700}
.profile-pop-head .rl{color:rgba(255,255,255,.55);font-size:12px;margin-top:2px}
.profile-pop-body{padding:12px 16px}
.profile-pop-body .item{display:flex;gap:10px;padding:6px 0;font-size:12px}
.profile-pop-body .item .k{color:rgba(255,255,255,.45);flex-shrink:0;width:56px}
.profile-pop-body .item .v{color:#dcecff;word-break:break-all;line-height:1.5}
.profile-pop-body button{width:100%;padding:9px 0;cursor:pointer;border:1px solid rgba(255,193,7,.5);background:rgba(120,90,0,.25);color:#ffd966;border-radius:8px;font-size:12px;font-weight:600;margin-top:10px}

/* Mobile */
@media(max-width:768px){
  .sidebar{position:absolute;left:0;top:calc(var(--header-h) + var(--notify-h));bottom:0;z-index:25;box-shadow:4px 0 12px rgba(0,0,0,.2)}
  .sidebar.collapsed{left:calc(-1 * var(--sidebar-closed))}
  .overlay{display:none;position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:24}
  .overlay.show{display:block}
}
</style>
</head>

<script>
// ===== 个人中心 / 登录态 =====
var CURRENT_USER = null;
var AUTH_API = 'auth_users.json';
var BOARDS_API = 'boards.json';

function initProfile(){
  var name = xdAuthGetUser();
  if (name){
    CURRENT_USER = { name: name };
    fetch(AUTH_API).then(function(r){ return r.json(); }).then(function(cfg){
      var u = null;
      (cfg.users || []).forEach(function(x){ if (x.name === name) u = x; });
      if (u) CURRENT_USER = u;
      renderProfile();
      loadBoardConfig();
    }).catch(function(){ renderProfile(); loadBoardConfig(); });
    return;
  }
  renderProfile();
}

function renderProfile(){
  var u = CURRENT_USER;
  var el = function(id){ return document.getElementById(id); };
  if (!u){
    el('profileName').textContent = '未登录';
    el('profileAvatar').textContent = '?';
    return;
  }
  var ch = (u.name || '?').charAt(0);
  el('profileName').textContent = u.name;
  el('profileAvatar').textContent = ch;
  el('popName').textContent = u.name;
  el('popRole').textContent = u.role || '—';
  el('popAvatar').textContent = ch;
  el('popMobile').textContent = u.mobile || '—';
  el('popRole2').textContent = u.role || '—';
  el('popArea').textContent = u.area || '—';
  el('popPerm').textContent = permSummary(u);
  el('popAdminBtn').style.display = 'none'; // 公网版隐藏管理后台入口
}

function openAdmin(){ window.open('名单管理后台.html', '_blank'); }

var profileBox = document.getElementById('profileBox');
profileBox.addEventListener('click', function(e){
  var pop = document.getElementById('profilePop');
  var rect = profileBox.getBoundingClientRect();
  pop.style.right = (document.documentElement.clientWidth - rect.right) + 'px';
  pop.style.top = (rect.bottom + 6) + 'px';
  pop.classList.toggle('show');
  e.stopPropagation();
});
document.addEventListener('click', function(e){
  if (!e.target.closest('#profileBox') && !e.target.closest('#profilePop')){
    document.getElementById('profilePop').classList.remove('show');
  }
});
initProfile();

// ===== Navigation Config =====
var navGroups = [
  {
    title: '交通安全', short: '交通',
    icon: '<path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>',
    items: [

      { key: 'safe_station', label: '站长安全评级', file: '交通安全行为看板/站长安全评级看板.html' },
      { key: 'safe_rider', label: '交通安全四项', file: '交通安全行为看板/骑手交通行为明细看板.html' },
      { key: 'safe_highway', label: '高速监控看板', file: '交通安全行为看板/高速监控看板.html' }
    ]
  },
  {
    title: '履约项目', short: '履约',
    icon: '<path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>',
    items: [
      { key: 'project', label: '履约项目看板', file: '履约项目/兴达履约项目看板.html' }
    ]
  },

// 权限控制
function allowedItems(group){
  var u = CURRENT_USER;
  var items = group.items;
  if (!u || u.admin || !u.boards || !u.boards.length) return items;
  return items.filter(function(it){ return !it.file || u.boards.indexOf(it.key) >= 0; });
}
function withArea(file){
  var u = CURRENT_USER;
  if (!u || u.admin || !u.areas || !u.areas.length) return file;
  var hash = '', base = file;
  var hi = file.indexOf('#');
  if (hi >= 0){ hash = file.substring(hi); base = file.substring(0, hi); }
  return base + (base.indexOf('?') >= 0 ? '&' : '?') + 'area=' + encodeURIComponent(u.areas.join(',')) + hash;
}
function permSummary(u){
  if (!u) return '—';
  if (u.admin) return '管理员：全部看板 / 全部区域';
  var b = (u.boards && u.boards.length) ? u.boards.length + ' 个看板' : '全部看板';
  var a = (u.areas && u.areas.length) ? u.areas.join('、') : '全部区域';
  return b + ' / ' + a;
}

// 路径处理：把绝对 ... 转为相对 /...，兼容 iframe 同源加载
function relativePath(file){
  if (!file) return file;
  return file.replace(/^D:\/兴达数据库\//i, './').replace(/\\/g, '/');
}

// ===== State =====
var activeItem = null;
var expandedGroups = {}; // gi -> bool

// ===== Build Navigation =====
function loadBoardConfig(){
  buildNav();
  fetch(BOARDS_API).then(function(r){ return r.json(); }).then(function(cfg){
    if (cfg && cfg.groups && cfg.groups.length){
      navGroups = cfg.groups.map(function(g){
        // 服务端清单可能不含 icon，用本地兜底映射
        var local = navGroups.find(function(x){ return x.title === g.title; });
        // 合并：服务端条目优先，本地独有的看板（如本地新增）追加在后，避免被整体覆盖
        var items = (g.items || []).slice();
        if (local && local.items){
          var keys = {};
          items.forEach(function(it){ if(it && it.key) keys[it.key] = 1; });
          local.items.forEach(function(it){ if(it && it.key && !keys[it.key]) items.push(it); });
        }
        return { title: g.title, short: g.short || (local && local.short) || g.title.slice(0,2), icon: (local && local.icon) || '', items: items };
      });
      buildNav();
    }
  }).catch(function(){ /* 服务不可用，保持本地兜底导航 */ });
}

function buildNav(){
  var container = document.getElementById('menuContainer');
  var html = '';
  var firstFileItem = null;

  navGroups.forEach(function(group, gi){
    var items = allowedItems(group);
    if (!items.length) return;

    items.forEach(function(item, ii){
      if (!firstFileItem && item.file) firstFileItem = { groupIdx: gi, itemIdx: ii };
    });

    var expanded = expandedGroups[gi] !== false; // 默认展开
    html += '<div class="menu-group">';
    html += '<div class="group-header' + (activeItem && activeItem.groupIdx === gi ? ' active' : '') + '" data-gi="' + gi + '" data-title="' + escAttr(group.title) + '" onclick="toggleGroup(' + gi + ')">';
    html += '<div class="group-icon"><svg viewBox="0 0 24 24">' + (group.icon || '') + '</svg></div>';
    html += '<div class="group-text">';
    html += '<div class="group-title">' + escHtml(group.title) + '</div>';
    html += '</div>';
    html += '<div class="group-arrow' + (expanded ? '' : ' collapsed') + '">▼</div>';
    /* flyout: shown on hover when sidebar collapsed */
    html += '<div class="group-flyout">';
    html += '<div class="flyout-title">' + escHtml(group.title) + '</div>';
    items.forEach(function(item, ii){
      var isActive = activeItem && activeItem.groupIdx === gi && activeItem.itemIdx === ii;
      html += '<div class="flyout-item' + (isActive ? ' active' : '') + '" onclick="event.stopPropagation();selectItem(' + gi + ',' + ii + ')">' + escHtml(item.label) + '</div>';
    });
    html += '</div>';
    html += '</div>';
    html += '<div class="group-items' + (expanded ? '' : ' collapsed') + '" id="groupItems_' + gi + '" style="max-height:' + (items.length * 38) + 'px">';
    items.forEach(function(item, ii){
      var isActive = activeItem && activeItem.groupIdx === gi && activeItem.itemIdx === ii;
      html += '<div class="menu-item' + (isActive ? ' active' : '') + '" data-key="' + item.key + '" data-title="' + escAttr(item.label) + '" onclick="selectItem(' + gi + ',' + ii + ')">';
      html += '<div class="menu-text">' + escHtml(item.label) + '</div>';
      html += '</div>';
    });
    html += '</div>';
    html += '</div>';
  });

  container.innerHTML = html;

  // 默认停留欢迎页，不自动打开任何看板（用户可在左侧菜单或欢迎页 tile 选择）
}

function toggleGroup(gi){
  expandedGroups[gi] = !expandedGroups[gi];
  buildNav();
}

// ===== Select Item =====
function selectItem(gi, ii){
  document.querySelectorAll('.menu-item.active').forEach(function(el){ el.classList.remove('active'); });
  document.querySelectorAll('.group-header.active').forEach(function(el){ el.classList.remove('active'); });

  var target = document.querySelector('.menu-item[data-key="' + navGroups[gi].items[ii].key + '"]');
  if (target) target.classList.add('active');
  var header = document.querySelector('.group-header[data-gi="' + gi + '"]');
  if (header) header.classList.add('active');

  activeItem = { groupIdx: gi, itemIdx: ii };

  var group = navGroups[gi];
  var item = group.items[ii];

  document.getElementById('welcome').classList.remove('show');
  document.getElementById('mainFrame').style.display = 'block';

  var file = relativePath(item.file);
  file = withArea(file);
  var sep = file.indexOf('?') >= 0 ? '&' : '?';
  document.getElementById('mainFrame').src = file + sep + 't=' + Date.now();

  document.getElementById('bcGroup').innerHTML = '<a onclick="showWelcome();return false;">首页</a> <span class="sep">/</span> ' + escHtml(group.title) + ' <span class="sep">/</span> ' + escHtml(item.label);
}

// 外部快捷入口（如顶部"今日履约"、欢迎页 tile）
function loadBoard(key){
  for (var gi = 0; gi < navGroups.length; gi++){
    for (var ii = 0; ii < navGroups[gi].items.length; ii++){
      if (navGroups[gi].items[ii].key === key){
        selectItem(gi, ii);
        return;
      }
    }
  }
}

function showWelcome(){
  document.getElementById('welcome').classList.add('show');
  document.getElementById('mainFrame').style.display = 'none';
  document.getElementById('mainFrame').src = '';
  document.getElementById('bcGroup').innerHTML = '欢迎使用';
  document.querySelectorAll('.menu-item.active, .group-header.active').forEach(function(el){ el.classList.remove('active'); });
  activeItem = null;
}

// ===== Sidebar Toggle =====
var sidebar = document.getElementById('sidebar');
var overlay = document.getElementById('overlay');
var collapsed = true;
sidebar.classList.toggle('collapsed', collapsed); // 默认收起，仅显示图标列
document.getElementById('toggleSidebar').addEventListener('click', function(){
  collapsed = !collapsed;
  sidebar.classList.toggle('collapsed', collapsed);
  if (window.innerWidth <= 768){
    overlay.classList.toggle('show', !collapsed);
  }
});
overlay.addEventListener('click', function(){
  collapsed = true;
  sidebar.classList.add('collapsed');
  overlay.classList.remove('show');
});

// ===== Notify =====
document.getElementById('closeNotify').addEventListener('click', function(){
  document.getElementById('notifyBar').style.display = 'none';
  document.documentElement.style.setProperty('--notify-h','0px');
});

// ===== Date =====
function setDate(){
  var d = new Date();
  var w = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  document.getElementById('todayDate').textContent = (d.getMonth()+1) + '月' + d.getDate() + '日 ' + w;
}
setDate();

// ===== Helpers =====
function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s){
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// 初始化
loadBoardConfig();
</script>
