<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>履约安全工作台 · 登录</title>
<style>
/* ============ 基础 ============ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-0:#040B18; --bg-1:#071A33; --bg-2:#0B2A4A;
  --accent:#3EC6FF; --accent-2:#1E88E5; --accent-3:#64D8FF;
  --line:rgba(80,190,255,.28);
  --text:#D6E9FF; --text-dim:#8FB4D9;
  --panel:rgba(8,22,46,.72);
}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI','Microsoft YaHei','PingFang SC',Arial,sans-serif;color:var(--text);background:var(--bg-0)}
body{
  background:
    radial-gradient(1200px 700px at 50% -10%, rgba(30,110,200,.35), transparent 60%),
    radial-gradient(900px 600px at 85% 110%, rgba(16,80,160,.30), transparent 55%),
    radial-gradient(700px 500px at 8% 100%, rgba(20,90,170,.25), transparent 55%),
    linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 55%, var(--bg-2) 100%);
}
/* 科技网格背景 */
.grid-bg{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(70,170,255,.055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(70,170,255,.055) 1px, transparent 1px);
  background-size:44px 44px;
  animation:gridDrift 60s linear infinite;
}
@keyframes gridDrift{from{background-position:0 0,0 0}to{background-position:44px 440px,440px 44px}}
/* 城市天际线 */
.city{
  position:fixed;left:0;right:0;bottom:0;height:150px;z-index:0;opacity:.55;pointer-events:none;
}
.city svg{width:100%;height:100%;display:block}
/* 粒子层 */
#particles{position:fixed;inset:0;z-index:1;pointer-events:none}
/* 连线层 */
#links{position:fixed;inset:0;z-index:2;pointer-events:none;width:100%;height:100%}
#links line{stroke:rgba(64,200,255,.30);stroke-width:1;stroke-dasharray:6 8;animation:flow 3.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}

/* ============ 顶部标题 ============ */
.brand{
  position:fixed;top:34px;left:0;right:0;z-index:5;text-align:center;pointer-events:none;
}
.brand-logo{
  display:inline-flex;align-items:center;gap:14px;justify-content:center;
}
.brand-badge{
  width:46px;height:46px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,rgba(30,140,230,.95),rgba(10,60,120,.9));
  border:1px solid rgba(120,215,255,.55);
  box-shadow:0 0 22px rgba(40,150,255,.45), inset 0 0 14px rgba(160,230,255,.35);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:800;color:#EAF6FF;letter-spacing:1px;
}
.brand-logo-img{width:36px;height:36px;object-fit:contain;display:block;border-radius:8px}
.brand-text{text-align:left}
.brand-title{font-size:26px;font-weight:700;letter-spacing:6px;color:#EAF6FF;line-height:1.2;text-shadow:0 0 18px rgba(80,190,255,.55)}
.brand-sub{font-size:11px;letter-spacing:4px;color:var(--text-dim);margin-top:4px}
.brand-line{width:340px;height:1px;margin:14px auto 0;background:linear-gradient(90deg,transparent,rgba(100,200,255,.6),transparent)}

/* ============ 登录面板 ============ */
.login-wrap{
  position:fixed;z-index:6;top:50%;left:50%;transform:translate(-50%,-50%);
  width:400px;perspective:900px;
}
.login-panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:34px 36px 28px;
  position:relative;
  backdrop-filter:blur(10px);
  box-shadow:0 0 44px rgba(40,140,255,.28), inset 0 0 60px rgba(16,60,130,.18);
  animation:panelBreath 5s ease-in-out infinite;
}
@keyframes panelBreath{
  0%,100%{box-shadow:0 0 34px rgba(40,140,255,.25), inset 0 0 60px rgba(16,60,130,.16)}
  50%{box-shadow:0 0 60px rgba(64,180,255,.42), inset 0 0 70px rgba(20,80,160,.24)}
}
/* 扫描线 */
.login-panel::before{
  content:'';position:absolute;left:8px;right:8px;top:-1px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,rgba(120,220,255,.9),transparent);
  box-shadow:0 0 12px rgba(120,220,255,.7);
  animation:scan 3.6s ease-in-out infinite;
}
@keyframes scan{0%,100%{top:6px;opacity:.5}50%{top:calc(100% - 8px);opacity:1}}
/* 四角装饰 */
.login-panel .corner{position:absolute;width:14px;height:14px;border:2px solid var(--accent);opacity:.8}
.login-panel .corner.tl{top:-2px;left:-2px;border-right:none;border-bottom:none}
.login-panel .corner.tr{top:-2px;right:-2px;border-left:none;border-bottom:none}
.login-panel .corner.bl{bottom:-2px;left:-2px;border-right:none;border-top:none}
.login-panel .corner.br{bottom:-2px;right:-2px;border-left:none;border-top:none}

.login-head{text-align:center;margin-bottom:24px}
.login-head .en{font-size:11px;letter-spacing:5px;color:var(--text-dim)}
.login-head h2{font-size:21px;letter-spacing:3px;font-weight:700;margin-top:6px;color:#EAF6FF}
.login-head .tip{font-size:11px;color:var(--text-dim);margin-top:8px;letter-spacing:1px}

.field{position:relative;margin-bottom:16px}
.field svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.7;pointer-events:none}
.field input{
  width:100%;height:46px;padding:0 14px 0 42px;
  background:rgba(4,14,32,.62);border:1px solid rgba(90,180,255,.28);border-radius:9px;
  color:#E4F2FF;font-size:14px;letter-spacing:1px;outline:none;transition:all .2s;
}
.field input::placeholder{color:#6E93B8}
.field input:focus{border-color:var(--accent);box-shadow:0 0 16px rgba(62,198,255,.35), inset 0 0 8px rgba(62,198,255,.10)}
.field input.error{border-color:#FF6B6B;box-shadow:0 0 14px rgba(255,90,90,.35)}

.btn-login{
  width:100%;height:48px;margin-top:6px;border:none;border-radius:9px;cursor:pointer;
  font-size:15px;font-weight:700;letter-spacing:8px;color:#EAF6FF;
  background:linear-gradient(135deg,#0E5EA8,#1E88E5 55%,#2AA3F0);
  box-shadow:0 0 20px rgba(40,150,255,.4), inset 0 1px 0 rgba(200,235,255,.35);
  transition:all .18s;position:relative;overflow:hidden;
}
.btn-login:hover{box-shadow:0 0 32px rgba(62,198,255,.65);transform:translateY(-1px)}
.btn-login:active{transform:translateY(1px);box-shadow:0 0 12px rgba(62,198,255,.4)}
.btn-login::after{
  content:'';position:absolute;top:0;left:-80%;width:50%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
  transform:skewX(-20deg);transition:left .5s;
}
.btn-login:hover::after{left:130%}
.btn-login:disabled{opacity:.55;cursor:not-allowed}

.login-msg{min-height:18px;font-size:12px;text-align:center;margin-top:12px;letter-spacing:1px;color:var(--text-dim);transition:color .2s}
.login-msg.ok{color:#6BE0A8}
.login-msg.fail{color:#FF8A8A}

.login-foot{text-align:center;margin-top:14px;font-size:11px;color:var(--text-dim);letter-spacing:1px}
.login-foot b{color:var(--accent);font-weight:600}

/* ============ 漂浮分组卡片 ============ */
.card{
  position:fixed;z-index:4;width:196px;padding:14px 16px 12px;border-radius:12px;cursor:pointer;
  background:linear-gradient(150deg,rgba(10,32,64,.82),rgba(6,18,40,.72));
  border:1px solid rgba(80,180,255,.30);
  box-shadow:0 8px 26px rgba(0,0,0,.35), 0 0 18px rgba(40,140,255,.12);
  backdrop-filter:blur(6px);
  transition:transform .22s, box-shadow .22s, border-color .22s;
  animation:floatY var(--dur,6s) ease-in-out var(--delay,0s) infinite;
  user-select:none;
}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.card:hover{
  transform:translateY(-4px) scale(1.03);
  border-color:rgba(120,215,255,.75);
  box-shadow:0 12px 34px rgba(0,0,0,.45), 0 0 34px rgba(62,198,255,.35);
  animation-play-state:paused;
}
.card-top{display:flex;align-items:center;gap:10px}
.card-icon{
  width:38px;height:38px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,rgba(30,140,230,.35),rgba(10,60,130,.25));
  border:1px solid rgba(120,215,255,.35);
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 10px rgba(100,200,255,.18);
}
.card-icon svg{width:20px;height:20px;stroke:var(--accent)}
.card-name{font-size:15px;font-weight:700;letter-spacing:1.5px;color:#EAF6FF}
.card-en{font-size:9px;letter-spacing:2px;color:var(--text-dim);margin-top:2px}
.card-items{margin-top:10px;display:flex;flex-wrap:wrap;gap:5px}
.card-item{
  font-size:10.5px;color:#A9C9E8;padding:2px 8px;border-radius:20px;
  border:1px solid rgba(100,190,255,.22);background:rgba(20,60,110,.25);
  white-space:nowrap;transition:all .15s;
}
.card-item:hover{color:#fff;border-color:var(--accent);background:rgba(30,110,190,.35)}
.card-item.more{color:var(--text-dim);border-style:dashed;border-color:rgba(100,190,255,.18)}
.card-count{
  margin-top:9px;font-size:9.5px;letter-spacing:1px;color:var(--text-dim);
  display:flex;align-items:center;gap:6px;
}
.card-count::before{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(100,200,255,.3),transparent)}

/* 卡片定位 */
.card-0{left:4.5%;top:26%}
.card-1{left:17%;top:12%}
.card-2{right:17%;top:12%}
.card-3{right:4.5%;top:26%}
.card-4{left:12%;bottom:13%}
.card-5{right:12%;bottom:13%}

/* 加载遮罩 */
#loader{
  position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;
  background:rgba(3,10,24,.82);backdrop-filter:blur(4px);flex-direction:column;gap:18px;
}
#loader.show{display:flex}
#loader .ring{width:52px;height:52px;border-radius:50%;border:3px solid rgba(62,198,255,.15);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loader p{font-size:14px;letter-spacing:3px;color:var(--text)}

/* ============ 响应式 ============ */
@media (max-width:1500px){
  .card{width:178px}
  .card-0{left:2.5%;top:30%}.card-1{left:12%;top:13%}.card-2{right:12%;top:13%}.card-3{right:2.5%;top:30%}
}
@media (max-width:1180px){
  .card{display:none}
  .login-wrap{width:360px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>

/* =====================================================================

 * ===================================================================== */
var AUTH_API = 'auth_users.json';
function syncRemoteAuth(){
  fetch(AUTH_API).then(function(r){ return r.json(); }).then(function(cfg){
    if (cfg && Array.isArray(cfg.users) && cfg.users.length > 0){
      AUTH_CONFIG.verifyField = cfg.verifyField || AUTH_CONFIG.verifyField;
      AUTH_CONFIG.users = cfg.users;
    }
  }).catch(function(){ /* 名单服务未启动，使用内置名单 */ });
}

/* =====================================================================

var linksSvg = document.getElementById('links');
function updateLinks(){
  linksSvg.innerHTML = '';
  var pw = document.querySelector('.login-panel');
  if (!pw) return;
  var pc = pw.getBoundingClientRect();
  var cx = pc.left + pc.width / 2, cy = pc.top + pc.height / 2;
  var cards = document.querySelectorAll('.card');
  cards.forEach(function(c){
    var r = c.getBoundingClientRect();
    var tx = r.left + r.width / 2, ty = r.top + r.height / 2;
    var line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', cx); line.setAttribute('y1', cy);
    line.setAttribute('x2', tx); line.setAttribute('y2', ty);
    linksSvg.appendChild(line);
  });
}
window.addEventListener('resize', updateLinks);

/* =====================================================================
 * 七、粒子网络
 * ===================================================================== */
(function(){
  var canvas = document.getElementById('particles');
  var ctx = canvas.getContext('2d');
  var W, H, dots = [];
  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    var n = Math.min(130, Math.max(55, Math.floor(Math.min(W, H) / 12)));
    dots = [];
    for (var i = 0; i < n; i++){
      dots.push({ x: Math.random()*W, y: Math.random()*H,
        vx: (Math.random()-.5)*.28, vy: (Math.random()-.5)*.28,
        r: Math.random()*1.6+.6, a: Math.random()*.5+.25 });
    }
  }
  function tick(){
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < dots.length; i++){
      var d = dots[i];
      d.x += d.vx; d.y += d.vy;
      if (d.x < 0 || d.x > W) d.vx *= -1;
      if (d.y < 0 || d.y > H) d.vy *= -1;
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 6.283);
      ctx.fillStyle = 'rgba(110,205,255,' + d.a + ')'; ctx.fill();
      for (var j = i+1; j < dots.length; j++){
        var e = dots[j], dx = d.x-e.x, dy = d.y-e.y, dist = dx*dx+dy*dy;
        if (dist < 110*110){
          ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(e.x, e.y);
          ctx.strokeStyle = 'rgba(90,190,255,' + (0.16 * (1 - dist/(110*110))) + ')';
          ctx.lineWidth = .6; ctx.stroke();
        }
      }
    }
    requestAnimationFrame(tick);
  }
  window.addEventListener('resize', resize);
  resize(); tick();
})();

/* =====================================================================
 * 八、实名认证登录逻辑
 * ===================================================================== */
var btn = document.getElementById('btnLogin');
var iptName = document.getElementById('iptName');
var iptCode = document.getElementById('iptCode');
var msg = document.getElementById('loginMsg');
var loader = document.getElementById('loader');

function hint(t, type){
  msg.textContent = t;
  msg.className = 'login-msg' + (type ? ' ' + type : '');
}
function shake(){
  var p = document.querySelector('.login-panel');
  p.style.animation = 'none';
  void p.offsetWidth;
  p.style.animation = 'panelBreath 5s ease-in-out infinite, shake .4s ease';
}
function clearErr(){ iptName.classList.remove('error'); iptCode.classList.remove('error'); }

btn.addEventListener('click', doLogin);
iptName.addEventListener('input', clearErr);
iptCode.addEventListener('input', clearErr);
iptName.addEventListener('keydown', function(e){ if (e.key === 'Enter') iptCode.focus(); });
iptCode.addEventListener('keydown', function(e){ if (e.key === 'Enter') doLogin(); });

function doLogin(){
  var name = iptName.value.trim();
  var code = iptCode.value.trim();
  if (!name || !code){ hint('请输入姓名与验证码', 'fail'); return; }

  if (!AUTH_CONFIG.users || AUTH_CONFIG.users.length === 0){
    hint('实名制名单尚未配置，请联系管理员', 'fail');
    shake();
    return;
  }

  var key = AUTH_CONFIG.verifyField === 'code' ? 'code' : 'mobile';
  var hit = null;
  AUTH_CONFIG.users.forEach(function(u){
    var val = String(u[key] || '');
    if (key === 'mobile' && val.length > 4) val = val.slice(-4); // 手机号完整存储，取后4位比对
    if (u.name === name && val === code) hit = u;
  });

  if (!hit){
    iptName.classList.add('error'); iptCode.classList.add('error');
    hint('身份验证失败，您不在本次授权名单内', 'fail');
    shake();
    return;
  }

  btn.disabled = true;
  hint('验证通过，欢迎 ' + hit.name, 'ok');
  try { sessionStorage.setItem('xd_login_user', hit.name); } catch(e){}
  // 2026-09-05 加固：登录态写入 localStorage（12 小时有效），
  // 跳转不再携带 ?user= 参数，避免链接被转发后成为免登录凭证。
  try {
    localStorage.setItem('xd_auth_v2', JSON.stringify({
      user: hit.name,
      role: hit.role || '',
      area: hit.area || '',
      exp: Date.now() + 12 * 3600 * 1000
    }));
  } catch(e){}
  loader.classList.add('show');
  setTimeout(function(){ window.location.href = WORKBENCH_URL; }, 1500);
}

/* =====================================================================
 * 九、辅助
 * ===================================================================== */
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
