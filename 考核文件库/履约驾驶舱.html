<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>履约驾驶舱 · 兴达履约工作台</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#04060f; --panel:rgba(9,14,28,.72); --line:rgba(108,158,255,.16);
    --line2:rgba(108,158,255,.30); --txt:#dbe7fa; --dim:#8296b8; --dim2:#5b6d8e;
    --gold:#ffc861; --blue:#6ea8ff;
    --safety:#ff6b81; --equip:#ffc861; --site:#3ad6ff; --insure:#25d0a0;
    --assess:#a78bfa; --sop:#ff9ecb;
  }
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:var(--txt);
    -webkit-font-smoothing:antialiased}
  canvas#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
  .nebula{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .nebula i{position:absolute;border-radius:50%;filter:blur(100px);mix-blend-mode:screen}
  .n1{width:52vw;height:44vh;left:-12vw;top:-14vh;background:radial-gradient(circle,#4a1f9e,transparent 66%);opacity:.55}
  .n2{width:56vw;height:46vh;right:-16vw;top:2vh;background:radial-gradient(circle,#0d3ba8,transparent 66%);opacity:.45}
  .n3{width:46vw;height:38vh;left:16vw;bottom:-20vh;background:radial-gradient(circle,#7b1d63,transparent 66%);opacity:.4}
  .n4{width:34vw;height:28vh;right:6vw;bottom:-10vh;background:radial-gradient(circle,#075a72,transparent 66%);opacity:.42}

  /* ================= 顶栏 ================= */
  #top{position:fixed;left:0;right:0;top:0;height:60px;z-index:60;display:flex;align-items:center;
    gap:22px;padding:0 22px;background:linear-gradient(180deg,rgba(4,6,15,.92),rgba(4,6,15,0));
    border-bottom:1px solid rgba(108,158,255,.10)}
  #top .brand{display:flex;align-items:baseline;gap:12px}
  #top h1{font-size:17px;font-weight:700;letter-spacing:5px;
    background:linear-gradient(92deg,#a8d2ff,#fff 46%,#c9a8ff);-webkit-background-clip:text;
    background-clip:text;color:transparent}
  #top .en{font-size:9px;letter-spacing:2.6px;color:var(--dim2)}
  #top .stats{display:flex;gap:20px;margin-left:6px}
  #top .stat{display:flex;align-items:baseline;gap:6px}
  #top .stat b{font-family:Consolas,monospace;font-size:15px;color:#fff;font-weight:600}
  #top .stat span{font-size:10.5px;color:var(--dim2);letter-spacing:.6px}
  #top .live{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--dim)}
  #top .dot{width:6px;height:6px;border-radius:50%;background:#25d0a0;box-shadow:0 0 7px #25d0a0;
    animation:blink 2.4s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.28}}

  /* ================= 左栏 ================= */
  #left{position:fixed;left:18px;top:76px;width:236px;z-index:50;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    backdrop-filter:blur(12px);padding:14px 13px;font-size:12px;
    box-shadow:0 10px 44px rgba(0,0,0,.5)}
  .sec{margin-bottom:16px}
  .sec:last-child{margin-bottom:0}
  .sec h3{font-size:10px;letter-spacing:2px;color:#8fb4ee;font-weight:600;margin-bottom:9px;
    display:flex;justify-content:space-between;align-items:center}
  .sec h3 em{font-style:normal;font-size:9.5px;color:var(--dim2);letter-spacing:.5px}
  .chip{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;cursor:pointer;
    transition:.16s;border:1px solid transparent}
  .chip:hover{background:rgba(110,160,255,.10)}
  .chip.on{background:rgba(110,160,255,.18);border-color:rgba(110,160,255,.35)}
  .chip .d{width:7px;height:7px;border-radius:50%;flex:none}
  .chip .n{flex:1;color:#c4d4ee}
  .chip .c{font-family:Consolas,monospace;font-size:11px;color:var(--dim2)}
  .chip.off{opacity:.35}
  .chip.off .n{color:var(--dim2)}

  /* 覆盖仪表 */
  .meter{display:flex;align-items:center;gap:12px;margin-top:2px}
  .ring{width:60px;height:60px;border-radius:50%;flex:none;position:relative;
    background:conic-gradient(#25d0a0 var(--p,0%),rgba(255,255,255,.07) 0)}
  .ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:#080d1c}
  .ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:Consolas,monospace;font-size:14px;color:#25d0a0;z-index:1}
  .meter .mt{font-size:10.5px;color:var(--dim);line-height:1.65}
  .meter .mt b{color:#fff;font-family:Consolas,monospace}

  /* ================= 舞台 ================= */
  #stage{position:fixed;left:270px;right:346px;top:60px;bottom:118px;z-index:10;overflow:hidden}
  #disc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(1020px,96%);height:min(470px,82%);border-radius:50%;pointer-events:none;z-index:1;
    background:radial-gradient(ellipse at center,
      rgba(255,220,170,.11) 0%,rgba(255,190,140,.07) 16%,
      rgba(150,120,255,.055) 34%,rgba(80,110,220,.035) 52%,transparent 72%);
    filter:blur(10px)}
  #stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  #orbits{z-index:2} #rays{z-index:3}
  #core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:96px;height:96px;
    z-index:6;pointer-events:none}
  #core .sun{position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle,#fff 0%,#fff6e0 18%,#ffd9a0 38%,rgba(255,190,120,.30) 62%,transparent 76%);
    animation:breathe 5.6s ease-in-out infinite}
  #core .halo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:250px;height:250px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,220,170,.10),transparent 64%)}
  #core .ct{position:absolute;left:50%;top:calc(50% + 90px);transform:translateX(-50%);
    white-space:nowrap;text-align:center;font-size:11px;color:#b9c9e4;letter-spacing:1px}
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.09);opacity:1}}

  .pl{position:absolute;border-radius:50%;cursor:pointer;z-index:5;
    transition:opacity .3s,filter .25s;will-change:transform}
  .pl .ball{width:100%;height:100%;border-radius:50%;position:relative;
    box-shadow:inset -2px -2px 5px rgba(0,0,8,.7),inset 1px 1px 3px rgba(255,255,255,.35)}
  .pl .halobox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    border-radius:50%;pointer-events:none;opacity:.5}
  .pl:hover{filter:brightness(1.5)}
  .pl .lb{position:absolute;left:50%;top:calc(100% + 5px);transform:translateX(-50%);
    white-space:nowrap;font-size:9.5px;color:#a8bad8;opacity:0;transition:.2s;pointer-events:none;
    text-shadow:0 1px 4px #000;max-width:180px;overflow:hidden;text-overflow:ellipsis}
  .pl:hover .lb{opacity:1}
  .pl.dim{opacity:.10;filter:grayscale(.7)}
  .pl.hit{z-index:30}
  .pl.hit .ball{box-shadow:0 0 12px 3px rgba(255,215,130,.7),inset -2px -2px 5px rgba(0,0,8,.7)}
  .pl.hit.top .lb{opacity:1;color:#ffe2a6}
  .pl.sel{z-index:31}
  .pl.sel .ball{box-shadow:0 0 20px 6px rgba(120,200,255,.8),inset -2px -2px 5px rgba(0,0,8,.6)}

  .orbit-tag{position:absolute;font-size:9.5px;letter-spacing:1.2px;color:var(--dim2);
    pointer-events:none;white-space:nowrap;z-index:4;padding:2px 7px;border-radius:9px;
    background:rgba(4,6,15,.82);border:1px solid rgba(108,158,255,.16);transform:translate(-50%,-50%)}

  /* 中心查询回显 */
  #qecho{position:fixed;left:50%;transform:translateX(-50%);bottom:126px;z-index:55;
    font-size:11.5px;color:var(--dim);text-align:center;max-width:min(700px,70vw);line-height:1.5}
  #qecho b{color:var(--gold)}

  /* ================= 右栏 ================= */
  #right{position:fixed;right:18px;top:76px;bottom:118px;width:312px;z-index:50;
    display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;backdrop-filter:blur(12px);box-shadow:0 10px 44px rgba(0,0,0,.5);overflow:hidden}
  #right .rh{padding:12px 14px 10px;border-bottom:1px solid rgba(108,158,255,.12);
    display:flex;align-items:center;justify-content:space-between;flex:none}
  #right .rh h3{font-size:10px;letter-spacing:2px;color:#8fb4ee;font-weight:600;
    white-space:nowrap;flex:none}
  #right .rh span{font-family:Consolas,monospace;font-size:10.5px;color:var(--dim2)}
  #rbody{flex:1;overflow-y:auto;padding:10px 12px 14px}
  #rbody::-webkit-scrollbar{width:5px}
  #rbody::-webkit-scrollbar-thumb{background:rgba(110,160,255,.25);border-radius:3px}

  .res{border:1px solid rgba(108,158,255,.14);border-radius:9px;padding:9px 10px;margin-bottom:8px;
    cursor:pointer;transition:.16s;background:rgba(12,18,36,.6)}
  .res:hover{border-color:rgba(110,160,255,.42);background:rgba(18,26,50,.8)}
  .res.sel{border-color:rgba(255,200,97,.5);background:rgba(24,20,10,.5)}
  .res .t{font-size:12px;line-height:1.45;color:#e2ecfb;margin-bottom:6px;word-break:break-all}
  .res .t mark{background:rgba(255,200,97,.32);color:#ffe6b0;padding:0 2px;border-radius:2px}
  .res .m{display:flex;flex-wrap:wrap;gap:6px;font-size:10px;color:var(--dim2);margin-bottom:6px}
  .res .m i{font-style:normal;padding:1px 6px;border-radius:4px;background:rgba(255,255,255,.05)}
  .res .sn{font-size:10.5px;line-height:1.6;color:#9db0cf;border-left:2px solid rgba(255,200,97,.35);
    padding:3px 0 3px 7px;margin-top:4px}
  .res .sn mark{background:rgba(255,200,97,.30);color:#ffe6b0;padding:0 1px;border-radius:2px}
  .res .sn em{font-style:normal;color:#5b6d8e;font-size:9.5px;margin-right:4px}

  .rec{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px dashed rgba(108,158,255,.1);
    font-size:11px;cursor:pointer}
  .rec:hover{color:#fff}
  .rec .d{width:5px;height:5px;border-radius:50%;flex:none}
  .rec .n{flex:1;color:#b3c4e0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rec .dt{font-family:Consolas,monospace;font-size:9.5px;color:var(--dim2);flex:none}
  .empty{text-align:center;color:var(--dim2);font-size:11px;padding:40px 10px;line-height:1.9}

  #right .rh .back{display:none;color:#ffc861;cursor:pointer;font-size:13px;margin-right:8px}
  #right.detail-mode .rh .back{display:inline}
  #right .rh .ttl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-size:11px;color:#e6eefb;letter-spacing:0;margin-left:9px;padding-left:9px;
    border-left:1px solid rgba(108,158,255,.22)}

  /* 详情正文（在右栏内切换） */
  .dmeta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px;font-size:10px;color:var(--dim2)}
  .dmeta i{font-style:normal;padding:1px 6px;border-radius:4px;background:rgba(255,255,255,.06)}
  .snip{font-size:11.5px;line-height:1.75;color:#c4d4ee;border-left:2px solid rgba(255,200,97,.4);
    padding:6px 0 6px 9px;margin-bottom:10px}
  .snip mark{background:rgba(255,200,97,.35);color:#ffe6b0;padding:0 2px;border-radius:2px}
  .snip .pg{display:block;font-size:9.5px;color:#5b6d8e;margin-bottom:3px;letter-spacing:.5px}
  .openbtn{display:block;text-align:center;background:linear-gradient(135deg,#2f7dff,#6d3ff2);
    color:#fff;text-decoration:none;font-size:12px;font-weight:600;padding:10px;border-radius:8px;
    margin-top:8px}

  /* ================= 底部 ================= */
  #dock{position:fixed;left:270px;right:346px;bottom:20px;z-index:70}
  #chips{text-align:center;margin-bottom:9px}
  #chips span{display:inline-block;background:rgba(10,16,32,.85);border:1px solid rgba(108,158,255,.22);
    border-radius:14px;padding:4px 12px;margin:0 3px 5px;font-size:11px;color:#9fb0d0;cursor:pointer;
    transition:.16s}
  #chips span:hover{border-color:rgba(255,200,97,.6);color:#ffe2a6}
  .srow{display:flex;gap:9px;background:rgba(7,11,24,.9);border:1px solid rgba(108,158,255,.28);
    border-radius:24px;padding:6px 7px 6px 18px;backdrop-filter:blur(12px);
    box-shadow:0 8px 36px rgba(0,0,0,.6)}
  .srow .ic{align-self:center;color:#4d5f80;font-size:13px}
  .srow input{flex:1;background:0;border:0;outline:0;color:#eaf2ff;font-size:13.5px}
  .srow input::placeholder{color:#4d5f80}
  .srow button{background:linear-gradient(135deg,#2f7dff,#6d3ff2);border:0;color:#fff;
    padding:9px 22px;border-radius:18px;font-size:12.5px;font-weight:700;cursor:pointer;letter-spacing:1px}
  .srow button:active{transform:scale(.96)}

  /* 左侧快捷入口 */
  #views{position:fixed;left:18px;bottom:20px;z-index:70;display:flex;gap:6px;width:236px}
  #views a{flex:1;text-align:center;background:rgba(9,14,28,.85);border:1px solid var(--line);
    color:#9fb0d0;font-size:10.5px;padding:7px 0;border-radius:8px;text-decoration:none;letter-spacing:1px}
  #views a.on{background:rgba(47,125,255,.22);color:#fff;border-color:rgba(47,125,255,.6)}

  #toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:200;
    background:rgba(8,12,26,.95);border:1px solid rgba(255,200,97,.4);color:#ffd98a;
    font-size:11.5px;padding:8px 18px;border-radius:18px;display:none}

  @media (max-width:1240px){
    #left{display:none} #stage,#dock{left:16px} #views{display:none}
  }
  @media (max-width:900px){
    #top{height:52px;padding:0 14px;gap:10px}
    #top h1{font-size:13px;letter-spacing:2px;white-space:nowrap}
    #top .en{display:none}
    #top .stats{gap:12px;overflow:hidden}
    #top .stat b{font-size:12px}
    #top .stat span{font-size:9px;white-space:nowrap}
    #top .stat:nth-child(3){display:none}
    #top .live{font-size:9px;white-space:nowrap}
    #stage{left:12px;right:12px;top:52px;bottom:calc(40vh + 122px)}
    #disc{width:100%;height:100%}
    #right{width:calc(100vw - 24px);right:12px;top:auto;bottom:116px;height:40vh}
    #dock{left:12px;right:12px;bottom:10px}
    #qecho{display:none}
    #chips span:nth-child(n+5){display:none}
    .pl .lb{max-width:104px;font-size:8.5px}
    .srow input{font-size:12px}
    .srow button{padding:8px 14px;font-size:12px}
  }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="nebula"><i class="n1"></i><i class="n2"></i><i class="n3"></i><i class="n4"></i></div>

<header id="top">
  <div class="brand">
    <h1>履约驾驶舱</h1>
    <div class="en">KNOWLEDGE COCKPIT</div>
  </div>
  <div class="stats">
    <div class="stat"><b id="s-files">-</b><span>考核文件</span></div>
    <div class="stat"><b id="s-groups">-</b><span>体系</span></div>
    <div class="stat"><b id="s-depts">-</b><span>部门</span></div>
    <div class="stat"><b id="s-idx">-</b><span>可全文检索</span></div>
  </div>
  <div class="live"><i class="dot"></i><span id="s-upd">数据加载中</span></div>
</header>

<aside id="left">
  <div class="sec">
    <h3>部门 DIMENSION <em id="dept-note">全部</em></h3>
    <div id="dept-list"></div>
  </div>
  <div class="sec">
    <h3>考核体系 SYSTEM <em id="g-note">全部</em></h3>
    <div id="group-list"></div>
  </div>
  <div class="sec">
    <h3>索引覆盖 COVERAGE</h3>
    <div class="meter">
      <div class="ring" id="ring"><b id="ring-n">0%</b></div>
      <div class="mt" id="ring-t">正文可检索占比<br>—</div>
    </div>
  </div>
</aside>

<main id="stage">
  <div id="disc"></div>
  <svg id="orbits"></svg>
  <svg id="rays"></svg>
  <div id="core"><div class="halo"></div><div class="sun"></div></div>
  <div id="planets"></div>
</main>

<div id="qecho"></div>

<aside id="right">
  <div class="rh">
    <span class="back" onclick="backToList()">←</span>
    <h3 id="rh-t">最近更新 RECENT</h3>
    <span class="ttl" id="rh-ttl"></span>
    <span id="rh-n"></span>
  </div>
  <div id="rbody"></div>
</aside>

<footer id="dock">
  <div id="chips"></div>
  <div class="srow">
    <span class="ic">⌕</span>
    <input id="q" placeholder="直接问：头盔扣多少分 / 站点星级怎么评 / 补贴怎么考核 / 站长绩效怎么算">
    <button onclick="ask()">检索星域</button>
  </div>
</footer>

<div id="views">
  <a class="on" href="javascript:void(0)">◉ 星图</a>
  <a href="考核文件库.html">☰ 文件列表</a>
</div>

<div id="toast"></div>

<script src="checkup_files_data.js"></script>
<script src="checkup_search_index.js"></script>
<script src="change_log.js"></script>
<script>
/* ============================================================
   履约驾驶舱 · 知识星图
   数据：checkup_files_data.js (CHECKUP_FILES) + checkup_search_index.js (CHECKUP_INDEX)
   ============================================================ */

var FILES = window.CHECKUP_FILES || [];
var IDX   = {};
(window.CHECKUP_INDEX || []).forEach(function(e){ IDX[e.id] = e; });

var GROUPS = [
  {key:'safety', title:'安全合规', color:'#ff6b81'},
  {key:'equip',  title:'装备载具', color:'#ffc861'},
  {key:'site',   title:'站点标准', color:'#3ad6ff'},
  {key:'insure', title:'保障财税', color:'#25d0a0'},
  {key:'assess', title:'考核风控', color:'#a78bfa'},
  {key:'sop',    title:'培训赋能', color:'#ff9ecb'},
  {key:'uncls',  title:'待归类',   color:'#9aa0a6'}
];
var GCOL = {}; GROUPS.forEach(function(g){ GCOL[g.key] = g; });

var DEPT_COL = {
  '安全履约':'#ff6b81', '财务结算':'#25d0a0', '人力行政':'#a78bfa',
  '组织管理':'#ff9ecb', '资产装备':'#ffc861', '其他':'#8296b8'
};

/* ---------- 状态 ---------- */
var ST = {
  dept: null,        // 选中的部门，null=全部
  group: null,       // 选中的体系
  q: '',             // 当前查询
  results: [],       // 命中结果
  sel: null          // 选中的文件 id
};

/* ---------- 同义词（保留原版并扩充） ---------- */
var SYN = {
  '头盔':['头盔','智能头盔','戴盔','系带','装备合规'],
  '装备':['装备','合规装备','穿戴','款式','盗版'],
  '载具':['载具','车辆','换电','车电','租货'],
  '站点':['站点','门店','标准化','星级','建设'],
  '补贴':['补贴','保障补贴','权益','畅休','福利'],
  '薪资':['薪资','薪酬','工资','提成','绩效','结算'],
  '扣款':['扣款','扣罚','处罚','罚款','违规','扣分'],
  '考核':['考核','评级','评分','达标','指标'],
  '宿舍':['宿舍','住宿','租房','房屋'],
  '培训':['培训','课件','宣导','教程','SOP','学习'],
  '保险':['保险','理赔','事故','出险','保障'],
  '申诉':['申诉','复议','异常剔除','非公'],
  '安全':['安全','安全管理','风险','隐患','事故'],
  '站长':['站长','队长','管理人员','负责人'],
  '骑手':['骑手','配送员','专送'],
  '车辆':['车辆','电动','电池','换电','车电']
};

/* 疑问/口语停用词：不参与检索 */
var STOP = ['多少','怎么','如何','什么','请问','一下','可以','需要','是否','哪些','哪个',
            '告诉','帮我','查一下','的是','有没有','要看'];
/* 泛词：几乎每份文件都有，必须降权，否则「考核」会压过「头盔」 */
var GENERIC = ['考核','管理','标准','要求','方案','规范','办法','制度','政策','指标',
               '规定','流程','工作','内容','相关','进行','以及'];

function expand(q){
  var terms = [], seen = {};
  function add(t){
    t = String(t||'').trim();
    if(t.length >= 2 && !seen[t]){ seen[t] = 1; terms.push(t); }
  }
  // 整句只在短且不含口语疑问词时才作为短语检索
  var hasStop = STOP.some(function(s){ return q.indexOf(s) >= 0; });
  if(q && q.length >= 2 && q.length <= 14 && !hasStop) add(q);
  Object.keys(SYN).forEach(function(k){
    if(q.indexOf(k) >= 0) SYN[k].forEach(add);
  });
  q.split(/[\s，。、；;？?！!：:,]+/).forEach(function(t){
    if(!STOP.some(function(s){ return t.indexOf(s) >= 0; })) add(t);
  });
  return terms;
}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}
function highlight(text, terms){
  var out = esc(text);
  terms.forEach(function(t){
    if(!t || t.length < 2) return;
    try{
      var re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')','g');
      out = out.replace(re, '<mark>$1</mark>');
    }catch(e){}
  });
  return out;
}

/* ---------- 检索 ---------- */
function search(q){
  var terms = expand(q);
  if(!terms.length) return [];
  var pool = FILES.filter(function(f){
    if(ST.dept && f.dept !== ST.dept) return false;
    if(ST.group && f.group !== ST.group) return false;
    return true;
  });

  // ① 文档频率 df：某个词在多少份文件里出现过（标题或正文）
  var df = {};
  terms.forEach(function(t){
    var n = 0;
    pool.forEach(function(f){
      if(f.name.indexOf(t) >= 0 || (f.topic||'').indexOf(t) >= 0){ n++; return; }
      var e = IDX[f.id];
      if(e && e.chunks && e.chunks.some(function(c){ return c.t.indexOf(t) >= 0; })) n++;
    });
    df[t] = n;
  });

  // ② 逆文档频率权重：越少见的词越重要；泛词再乘 0.45；
  //    用户原话里出现的词（主词）比同义词扩展出来的词更可信，×1.35
  var W = {};
  terms.forEach(function(t){
    var w = 1 + Math.log((pool.length + 2) / (df[t] + 1.5));
    if(GENERIC.indexOf(t) >= 0) w *= 0.45;
    if(q.indexOf(t) >= 0) w *= 1.35;
    W[t] = Math.max(0.35, w);
  });

  var res = [];
  var WTOT = 0;
  terms.forEach(function(t){ WTOT += W[t]; });

  pool.forEach(function(f){
    var score = 0, nameHits = [], hitTerms = {};
    terms.forEach(function(t){
      var w = W[t];
      if(f.name.indexOf(t) >= 0){ score += 8 * w; nameHits.push(t); hitTerms[t] = 1; }
      else if((f.topic||'').indexOf(t) >= 0){ score += 5 * w; nameHits.push(t); hitTerms[t] = 1; }
      if((f.srcdir||'').indexOf(t) >= 0) score += 1 * w;
    });
    if(f.name.indexOf(q) >= 0) score += 6;

    // 正文：只按「命中了多少个不同词 + 命中的密度」加分，并对长文档封顶；
    //       命中泛词（考核/管理/指标）几乎不给分，否则长报表会刷榜
    var snips = [], hitChunkN = 0, strongHit = 0;
    var entry = IDX[f.id];
    if(entry && entry.chunks){
      entry.chunks.forEach(function(c){
        var hit = terms.filter(function(t){ return c.t.indexOf(t) >= 0; });
        if(hit.length){
          hitChunkN++;
          if(hit.some(function(t){ return GENERIC.indexOf(t) < 0; })) strongHit++;
          hit.forEach(function(t){ hitTerms[t] = 1; });
          if(snips.length < 30) snips.push({p:c.p, t:c.t, hit:hit});
        }
      });
    }
    if(strongHit) score += Math.min(9, Math.sqrt(strongHit) * 2.4);
    else if(hitChunkN) score += Math.min(2, Math.sqrt(hitChunkN) * 0.8);

    // 加权覆盖率：命中稀有词（头盔/补贴）远比命中泛词（考核/指标）有价值
    var wsum = 0;
    terms.forEach(function(t){ if(hitTerms[t]) wsum += W[t]; });
    var cov = WTOT ? wsum / WTOT : 0;
    score += cov * 26;

    if(score > 0) res.push({f:f, score:score, snips:snips, nameHits:nameHits, cov:cov});
  });

  res.sort(function(a,b){
    if(Math.abs(b.score - a.score) > 0.001) return b.score - a.score;
    return (b.f.date||'').localeCompare(a.f.date||'');
  });
  return res;
}

/* ---------- 星图布局 ---------- */
var planets = [];   // {el, f, angle, rx, ry}
var orbitEls = {};  // groupKey -> <ellipse>
var CX = 0, CY = 0, RMAX = 460;

function layout(){
  var stage = document.getElementById('stage');
  var W = stage.clientWidth, H = stage.clientHeight;
  CX = W / 2; CY = H / 2;

  // 半径按可用空间
  var maxA = Math.min(W * 0.46, 520);
  var maxB = Math.min(H * 0.42, 300);
  RMAX = maxA;

  var byGroup = {};
  FILES.forEach(function(f){ (byGroup[f.group] = byGroup[f.group] || []).push(f); });

  var order = GROUPS.filter(function(g){ return byGroup[g.key] && byGroup[g.key].length; });

  var svgO = document.getElementById('orbits');
  var svgR = document.getElementById('rays');
  svgO.innerHTML = ''; svgR.innerHTML = '';
  orbitEls = {};

  planets.forEach(function(p){ p.el.remove(); });
  planets = [];
  var box = document.getElementById('planets');
  box.innerHTML = '';

  order.forEach(function(g, gi){
    var t = order.length > 1 ? gi / (order.length - 1) : 0;
    var rx = 168 + (maxA - 168) * t;
    var ry = 74 + (maxB - 74) * t;

    // 轨道
    var el = document.createElementNS('http://www.w3.org/2000/svg','ellipse');
    el.setAttribute('cx', CX); el.setAttribute('cy', CY);
    el.setAttribute('rx', rx); el.setAttribute('ry', ry);
    el.setAttribute('fill','none');
    el.setAttribute('stroke', g.color);
    el.setAttribute('stroke-opacity','0.20');
    el.setAttribute('stroke-width','1');
    el.setAttribute('stroke-dasharray','1 5');
    svgO.appendChild(el);

    var list = byGroup[g.key];
    var step = Math.PI * 2 / list.length;
    var start = gi * 0.5;

    list.forEach(function(f, i){
      var ang = start + i * step;
      var jitter = ((i % 3) - 1) * 0.012;
      var x = CX + Math.cos(ang + jitter) * rx;
      var y = CY + Math.sin(ang + jitter) * ry;

      var pages = f.pages || 1;
      var sz = Math.max(6, Math.min(15, 5.5 + Math.sqrt(pages) * 1.5));

      var d = document.createElement('div');
      d.className = 'pl';
      d.style.width = sz + 'px'; d.style.height = sz + 'px';
      d.style.left = (x - sz/2) + 'px';
      d.style.top = (y - sz/2) + 'px';
      d.dataset.id = f.id;
      d.innerHTML = '<div class="halobox" style="width:' + (sz*2.6) + 'px;height:' + (sz*2.6) + 'px;background:radial-gradient(circle,' + g.color + '55,transparent 68%)"></div>' +
                    '<div class="ball" style="background:radial-gradient(circle at 33% 28%,#fff,' + g.color + ' 42%,' + shade(g.color,-0.62) + ')"></div>' +
                    '<div class="lb">' + esc(f.name) + '</div>';
      d.onclick = function(){ selectFile(f.id); };
      box.appendChild(d);

      planets.push({el:d, f:f, x:x, y:y, g:g, sz:sz});
    });

    // 轨道标签不再常驻（左栏图例已表达），改为悬停左栏体系时联动高亮
    orbitEls[g.key] = el;
  });

  document.getElementById('rh-n').textContent = FILES.length + ' 份';
  renderRecent();
}

function shade(hex, p){
  var n = parseInt(hex.slice(1), 16);
  var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if(p > 0){ r += (255-r)*p; g += (255-g)*p; b += (255-b)*p; }
  else { r *= (1+p); g *= (1+p); b *= (1+p); }
  return 'rgb(' + (r|0) + ',' + (g|0) + ',' + (b|0) + ')';
}

/* 悬停左栏体系 → 高亮该轨道；离开时恢复当前搜索/筛选状态 */
function hoverGroup(k){
  if(!k){
    Object.keys(orbitEls).forEach(function(key){
      orbitEls[key].setAttribute('stroke-opacity','0.20');
      orbitEls[key].setAttribute('stroke-width','1');
    });
    applyFocus();
    return;
  }
  planets.forEach(function(p){
    p.el.classList.remove('dim','top','hit');
    if(p.f.group === k) p.el.classList.add('top');
    else p.el.classList.add('dim');
  });
  Object.keys(orbitEls).forEach(function(key){
    orbitEls[key].setAttribute('stroke-opacity', key === k ? '0.85' : '0.05');
    orbitEls[key].setAttribute('stroke-width', key === k ? '1.8' : '1');
  });
}

/* ---------- 高亮与聚焦 ---------- */
function applyFocus(){
  var hitIds = {}, topIds = {};
  ST.results.forEach(function(r){ hitIds[r.f.id] = 1; });
  ST.results.slice(0, 5).forEach(function(r){ topIds[r.f.id] = 1; });
  var filtering = !!(ST.dept || ST.group);
  var searching = !!ST.q && ST.results.length > 0;

  planets.forEach(function(p){
    p.el.classList.remove('dim','hit','sel','top');
    if(searching){
      if(hitIds[p.f.id]){
        p.el.classList.add('hit');
        if(topIds[p.f.id]) p.el.classList.add('top');
      }else{
        p.el.classList.add('dim');
      }
    }else if(filtering){
      if((ST.dept && p.f.dept !== ST.dept) || (ST.group && p.f.group !== ST.group))
        p.el.classList.add('dim');
    }
    if(ST.sel === p.f.id) p.el.classList.add('sel');
  });

  // 中心射线：只连最相关 8 条，由近及远渐隐
  var svgR = document.getElementById('rays');
  svgR.innerHTML = '';
  if(searching){
    ST.results.slice(0, 8).forEach(function(r, i){
      var p = planets.filter(function(pp){ return pp.f.id === r.f.id; })[0];
      if(!p) return;
      var ln = document.createElementNS('http://www.w3.org/2000/svg','line');
      ln.setAttribute('x1', CX); ln.setAttribute('y1', CY);
      ln.setAttribute('x2', p.x); ln.setAttribute('y2', p.y);
      ln.setAttribute('stroke', '#ffc861');
      ln.setAttribute('stroke-opacity', (0.34 - i * 0.032).toFixed(3));
      ln.setAttribute('stroke-width', i === 0 ? '1.4' : '1');
      svgR.appendChild(ln);
    });
  }
}

  right.classList.add('detail-mode');

             '<i>' + esc(f.dept||'') + '</i>' +

             '<i>' + esc((f.ext||'').replace('.','').toUpperCase()) + '</i>';
  if(f.size_mb) meta += '<i>' + f.size_mb + ' MB</i>';

  if(f.srcdir) h += '<div style="font-size:9.5px;color:#4d5f80;margin-bottom:10px">D:/MT/' +
                    esc(f.srcdir.replace(/\\/g,'/')) + '</div>';

  var entry = IDX[f.id];
  if(entry && entry.chunks && entry.chunks.length){
    var chunks = entry.chunks;
    if(terms.length){
      var hit = chunks.filter(function(c){
        return terms.some(function(t){ return c.t.indexOf(t) >= 0; });
      });

    }
    chunks.slice(0, 16).forEach(function(c){
      h += '<div class="snip"><span class="pg">第 ' + c.p + ' 页</span>' +
           highlight(c.t.slice(0, 300), hterms) + '</div>';

    if(entry.chunks.length > 16){
      h += '<div style="font-size:10px;color:#4d5f80;text-align:center;margin:2px 0 8px">' +
           '共 ' + entry.chunks.length + ' 段，已显示前 16 段</div>';

  }

  document.getElementById('rbody').scrollTop = 0;

    var best = ST.results[0];
    el.innerHTML = '「<b>' + esc(ST.q) + '</b>」命中 <b>' + ST.results.length +
      '</b> 份 · 最相关：' + esc(best.f.name.slice(0, 34));
  }else{
    el.innerHTML = '「<b>' + esc(ST.q) + '</b>」未命中，试试更短的关键词';
  }
}

/* ---------- 提问 ---------- */
function ask(){
  var q = document.getElementById('q').value.trim();
  if(!q){ toast('请输入要查的内容'); return; }
  ST.q = q;
  ST.sel = null;
  ST.results = search(q);
  renderResults();
  applyFocus();
  updateEcho();
  if(!ST.results.length) toast('没有命中，换个关键词试试');
}
function quick(q){
  document.getElementById('q').value = q;
  ask();
}

function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.style.display = 'none'; }, 1900);
}

/* ---------- 星空背景 ---------- */
(function(){
  var cv = document.getElementById('stars'), ctx = cv.getContext('2d'), STARS = [];
  function init(){
    cv.width = innerWidth; cv.height = innerHeight;
    STARS = [];
    for(var i=0;i<240;i++){
      STARS.push({
        x: Math.random()*cv.width, y: Math.random()*cv.height,
        r: Math.random()*1.25 + .25,
        a: Math.random()*0.6 + 0.15,
        sp: 0.4 + Math.random()*1.4,
        ph: Math.random()*6.28
      });
    }
  }
  function tick(ts){
    ctx.clearRect(0,0,cv.width,cv.height);
    for(var i=0;i<STARS.length;i++){
      var s = STARS[i];
      var al = s.a * (0.55 + 0.45*Math.sin(ts/1000*s.sp + s.ph));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, 6.2832);
      ctx.fillStyle = 'rgba(220,235,255,' + al.toFixed(3) + ')';
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  init();
  requestAnimationFrame(tick);
  addEventListener('resize', function(){ init(); });
})();

/* ---------- 启动 ---------- */
buildStatic();
layout();
addEventListener('resize', function(){
  var old = document.getElementById('orbit-tags');
  if(old) old.remove();
  layout();
  applyFocus();
});
document.getElementById('q').addEventListener('keydown', function(e){
  if(e.key === 'Enter') ask();
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){ closeDetail(); }
});
</script>
