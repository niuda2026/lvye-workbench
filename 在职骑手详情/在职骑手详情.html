<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>在职骑手详情 · 健康证到期监控</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei',Arial,sans-serif;background:#e8f4fd;color:#1a2e45;min-height:100vh}
.header{background:linear-gradient(135deg,#1565c0,#1976d2,#1e88e5);padding:12px 24px;border-bottom:3px solid #0d47a1;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;box-shadow:0 2px 8px rgba(21,101,192,.4);position:sticky;top:0;z-index:100}
.header h1{font-size:18px;font-weight:700;color:#fff;letter-spacing:1px;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.header p{font-size:12px;color:#bbdefb;margin-top:3px;line-height:1.6}
.hbtn{padding:6px 14px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:4px;font-size:12px;cursor:pointer;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.7)}
.hbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.stats{display:flex;gap:10px;padding:12px 16px;flex-wrap:wrap;background:#f0f7ff}
.sc{background:linear-gradient(135deg,#fff,#e3f2fd);border:1px solid #90caf9;border-radius:10px;padding:12px 16px;min-width:140px;flex:1 1 170px;max-width:250px;box-shadow:0 3px 12px rgba(21,101,192,.1);text-align:center;transition:transform .15s}
.sc:hover{transform:translateY(-2px)}
.sc .ic{font-size:22px;line-height:1;margin-bottom:4px}
.sc .n{font-size:26px;font-weight:800;color:#1565c0;line-height:1.2}
.sc .l{font-size:11px;color:#5c7a9e;margin-bottom:2px}
.sc .sub{font-size:11px;color:#7890a8;margin-top:3px;line-height:1.4}
.sc.danger{background:linear-gradient(135deg,#fff,#ffebee);border-color:#ef9a9a}
.sc.danger .n,.sc.danger .ic{color:#c62828}
.sc.warning{background:linear-gradient(135deg,#fff,#fff3e0);border-color:#ffb74d}
.sc.warning .n,.sc.warning .ic{color:#e65100}
.sc.ok{background:linear-gradient(135deg,#fff,#e8f5e9);border-color:#a5d6a7}
.sc.ok .n,.sc.ok .ic{color:#2e7d32}

.todo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#fff8e1;border-bottom:1px solid #ffe0b2;font-size:13px}
.todo .tt{font-weight:700;color:#5d4037}
.tchip{padding:4px 12px;border-radius:14px;font-size:12px;cursor:pointer;border:1px solid transparent;font-weight:600}
.tchip.red{background:#c62828;color:#fff}
.tchip.orange{background:#ef6c00;color:#fff}
.tchip.amber{background:#fff;color:#e65100;border-color:#ffb74d}
.tchip:hover{opacity:.85}
.todo .hint{font-size:11px;color:#8d6e63;margin-left:auto}

.filter-bar{display:flex;gap:8px;padding:10px 16px;flex-wrap:wrap;align-items:center;background:#f5f9ff;border-bottom:1px solid #90caf9}
.filter-bar select,.filter-bar input{padding:6px 9px;border:1px solid #90caf9;border-radius:4px;font-size:13px;background:#fff;color:#1a2e45;outline:none}
.filter-bar select:focus,.filter-bar input:focus{border-color:#1565c0}
#fQ{flex:1;min-width:170px}
.chk input,.ms-item input{flex:0 0 auto;min-width:0;width:15px;height:15px;accent-color:#1565c0;cursor:pointer;margin:0}
/* 多选级联下拉（2026-09-29） */
.msel{position:relative;user-select:none}
.ms-btn{padding:6px 9px;border:1px solid #90caf9;border-radius:4px;font-size:13px;background:#fff;color:#1a2e45;cursor:pointer;min-width:110px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:6px}
.ms-btn:hover,.msel.open .ms-btn{border-color:#1565c0}
.ms-btn.on{background:#e3f2fd;border-color:#1565c0;font-weight:600}
.ms-btn .ms-caret{font-size:10px;color:#5c7a9e}
.ms-panel{display:none;position:absolute;top:calc(100% + 3px);left:0;z-index:60;background:#fff;border:1px solid #90caf9;border-radius:8px;box-shadow:0 8px 24px rgba(13,71,161,.18);min-width:220px;max-width:340px;overflow:hidden}
.msel.open .ms-panel{display:block}
.ms-ops{display:flex;gap:14px;align-items:center;padding:7px 12px;border-bottom:1px solid #e3f2fd;font-size:12px;background:#f5f9ff}
.ms-ops a{color:#1565c0;cursor:pointer;text-decoration:none;font-weight:600}
.ms-ops a:hover{text-decoration:underline}
.ms-list{max-height:300px;overflow-y:auto;padding:4px 0}
.ms-item{display:flex;align-items:center;gap:8px;padding:5px 12px;font-size:13px;color:#1a2e45;cursor:pointer;white-space:nowrap;line-height:1.4}
.ms-item:hover{background:#e3f2fd}
.ms-item .ms-lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ms-count{color:#7890a8;font-size:11px;margin-left:auto;padding-left:14px;font-variant-numeric:tabular-nums}
.row-count{font-size:12px;color:#5c7a9e;font-weight:600}
.chk{display:flex;align-items:center;gap:4px;font-size:12px;color:#5c7a9e;cursor:pointer;white-space:nowrap}
.btn-exp{padding:6px 12px;background:#1565c0;color:#fff;border:none;border-radius:4px;font-size:12px;cursor:pointer}
.btn-exp:hover{background:#0d47a1}

.rank{margin:12px 16px 0;background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(21,101,192,.1);padding:12px 14px}
.rank h3{font-size:14px;font-weight:600;color:#1565c0;margin-bottom:10px}
.rrow{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:12px}
.rname{width:180px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;color:#1a2e45}
.rname:hover{color:#1565c0;text-decoration:underline}
.rtrack{flex:1;height:13px;background:#e3f2fd;border-radius:3px;overflow:hidden}
.rfill{height:100%;border-radius:3px}
.rval{width:44px;text-align:right;font-weight:600;color:#1a2e45}

#tc{margin:12px 16px 0;background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(21,101,192,.1);overflow:auto;max-height:calc(100vh - 200px)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:#1565c0;color:#fff;padding:8px 9px;text-align:left;font-weight:600;white-space:nowrap;cursor:pointer;user-select:none;border:1px solid #1976d2;z-index:2}
th:hover{background:#1976d2}
td{padding:6px 9px;border:1px solid #cce0f5;white-space:nowrap;background:#fff}
tr:hover td{background:#f0f7ff}
.sort::after{font-size:10px;margin-left:2px;color:#90caf9}
.sort.asc::after{content:"▲"}.sort.desc::after{content:"▼"}
.num{text-align:right}
.d-neg{color:#c62828 !important;font-weight:700}
.d-warn{color:#e65100 !important;font-weight:600}
.d-mid{color:#f9a825 !important}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.b-none{background:#c62828;color:#fff}
.b-expired{background:#ef5350;color:#fff}
.b-d7{background:#ef6c00;color:#fff}
.b-d30{background:#ffb74d;color:#5d4037}
.b-d90{background:#fff59d;color:#5d4037}
.b-ok{background:#e8f5e9;color:#2e7d32}
.b-rd7{background:#8e24aa;color:#fff}
.b-rnew{background:#e3f2fd;color:#1565c0}
.b-pre{background:#eceff1;color:#607d8b}
.cert-none{color:#90a4ae;font-style:italic}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;padding:12px 16px 26px;flex-wrap:wrap;font-size:13px;color:#5c7a9e}
.pager button{padding:5px 13px;border:1px solid #90caf9;background:#fff;color:#1565c0;border-radius:4px;cursor:pointer;font-size:13px}
.pager button:disabled{opacity:.4;cursor:default}
.pager select{padding:5px 8px;border:1px solid #90caf9;border-radius:4px;background:#fff;color:#1a2e45}
.pager .info{font-weight:600;color:#1a2e45}
.empty{text-align:center;padding:40px;color:#90a4ae;font-size:14px}
.note{padding:8px 16px;font-size:11px;color:#7890a8;background:#f0f7ff}
.review-link{padding:3px 8px;border:1px solid #90caf9;background:#e3f2fd;color:#1565c0;border-radius:4px;cursor:pointer;font-size:11px}
.review-link:hover{background:#bbdefb}.review-badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:600}.rv-none{background:#eceff1;color:#607d8b}.rv-pending{background:#fff3e0;color:#e65100}.rv-risk{background:#ffebee;color:#c62828}.rv-ok{background:#e8f5e9;color:#2e7d32}.rv-fail{background:#fce4ec;color:#ad1457}.rv-lowq{background:#eef2f7;color:#5b6b7c;border:1px dashed #b6c6d8}.rv-dom{background:#ede7f6;color:#5e35b1;border:1px dashed #b39ddb}
.drawer-mask{display:none;position:fixed;inset:0;background:rgba(13,43,72,.35);z-index:200}.drawer-mask.on{display:block}.drawer{position:absolute;right:0;top:0;height:100%;width:min(520px,94vw);background:#fff;box-shadow:-6px 0 24px rgba(13,71,161,.25);overflow:auto;padding:20px}.drawer h2{font-size:17px;color:#1565c0;margin-bottom:12px}.drawer-close{float:right;border:0;background:none;font-size:22px;color:#7890a8;cursor:pointer}.rv-grid{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:13px;margin:12px 0}.rv-grid dt{color:#7890a8}.rv-grid dd{margin:0;word-break:break-all}.rv-box{background:#f5f9ff;border:1px solid #cce0f5;border-radius:6px;padding:10px;margin-top:12px;font-size:12px;line-height:1.7}.hc-thumb{height:42px;max-width:64px;object-fit:cover;border-radius:3px;border:1px solid #cce0f5;cursor:zoom-in;display:block}
.photo-cell{white-space:nowrap}
.rv-note{color:#7890a8;font-size:11px;margin-top:14px}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>在职骑手详情 · 健康证到期监控</h1>
    <p id="metaLine">加载中...</p>
  </div>
  <div class="hbtns">
    <button class="hbtn" id="btnShot" title="将当前看板整版截图保存为 PNG">📷 截图</button>
    <button class="hbtn" id="btnHelp" title="数据来自 M:\下载 最新排班表 + 最新健康证监控表">更新数据</button>
  </div>
</div>

<div class="todo" id="todoBar"></div>

<div class="stats" id="stats"></div>

<div class="filter-bar">
  <div class="msel" id="msBig"></div>
  <div class="msel" id="msReg"></div>
  <div class="msel" id="msCity"></div>
  <div class="msel" id="msSite"></div>
  <select id="fSt">
    <option value="">全部处置状态</option>
    <option value="missing">源数据缺失·待核实</option>
    <option value="none">双无（立即停用）</option>
    <option value="expired">健康证已过期</option>
    <option value="d7">健康证 7 天内</option>
    <option value="d30">健康证 30 天内</option>
    <option value="d90">健康证 90 天内</option>
    <option value="rd7">回执单 7 天内</option>
    <option value="rexpired">回执单已过期</option>
    <option value="rnew">新人待取证</option>
    <option value="ok">正常</option>
  </select>
  <select id="fHire">
    <option value="">全部入职时长</option>
    <option value="30">入职 ≤30 天</option>
    <option value="90">入职 31-90 天</option>
    <option value="365">入职 91-365 天</option>
    <option value="9999">入职 &gt;1 年</option>
  </select>
  <select id="fReview" aria-label="核查状态"><option value="">全部核查状态</option><option value="uncollected">未采集</option><option value="pending">待核查</option><option value="lowq">需人工看图</option><option value="domain_check">域名待核实</option><option value="manual">待人工复核</option><option value="risk">发现风险线索</option><option value="verified">已核验</option><option value="failed">采集失败</option></select>
  <input id="fQ" placeholder="搜索姓名 / 骑手ID / 站点">
  <label class="chk"><input type="checkbox" id="fPre" checked> 含预离职已通过</label>
  <button class="btn-exp" id="btnExp">导出督办名单</button>
  <span class="row-count" id="rowCount"></span>
</div>

<div class="rank" id="rankBox"></div>

<div id="tc">
  <table>
    <thead><tr>
      <th data-sort="b">大区</th>
      <th data-sort="g">区域</th>
      <th data-sort="c">城市</th>
      <th data-sort="s">站点</th>
      <th data-sort="r">骑手ID</th>
      <th data-sort="n">姓名</th>
      <th data-sort="ctp">类型</th>
      <th data-sort="cd">发证日期</th>
      <th data-sort="h">入职日期</th>
      <th data-sort="hd" class="num">入职天数</th>
      <th data-sort="e">健康证到期</th>
      <th data-sort="hd2" class="num">剩余</th>
      <th data-sort="x">回执单到期</th>
      <th data-sort="rd" class="num">回执单剩余</th>
      <th data-sort="st">处置</th>
      <th data-sort="reviewStatus" class="review-col">核查状态</th>
      <th class="review-col">照片</th>
      <th class="review-col">证件详情</th>
    </tr></thead>
    <tbody id="tb"></tbody>
  </table>
</div>
<div class="pager" id="pager"></div>
<div class="note" id="noteLine"></div>
<div class="drawer-mask" id="reviewMask" data-html2canvas-ignore="true"><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="reviewTitle" tabindex="-1"><button class="drawer-close" id="reviewClose" aria-label="关闭证件详情">×</button><h2 id="reviewTitle">健康证核查详情</h2><div id="reviewContent"></div></section></div>

<script src="../_libs/html2canvas-1.4.1.min.js"></script>
<script src="health_cert_data.js"></script>
<script src="hc_review_data.js"></script>
<script src="hc_supplement_data.js"></script>
<script src="hc_profile_data.js"></script>
<script src="hc_derived_data.js"></script>
<script>
(function(){
var META = window.HC_META || {};
var DATA = window.HC_DATA || [];
var REVIEW = window.HC_REVIEW_DATA || {};
var SUPPLEMENT = window.HC_SUPPLEMENT_DATA || {};
var PROFILE = window.HC_PROFILE_DATA || {};
var DERIVED = window.HC_DERIVED_DATA || {};
var DERIVED_AT = (window.HC_DERIVED_META||{}).generatedAt || '';
var PROFILE_AT = (window.HC_PROFILE_META||{}).sourceAt || '';
function prof(o){return PROFILE[String(o.r)]||{};}
function dv(o){return DERIVED[String(o.r)]||{};}
function certTypeOf(o){
  var ct=prof(o).ct||dv(o).ct;
  if(ct===1) return '健康证';
  if(ct===2) return '回执单';
  if(o.e) return '健康证';
  if(o.x) return '回执单';
  return '';
}
function certDateOf(o){return prof(o).cd||dv(o).cd||'';}
function supp(o){return SUPPLEMENT[String(o.r)]||{};}
function hireValue(o){return o.h||dv(o).hire||supp(o).hireHistorical||'';}
function fmtHire(o){
  if(o.h) return fmtD(o.h);
  if(dv(o).hire) return fmtD(dv(o).hire)+' <small title="入职日期取自 '+esc(DERIVED_AT)+' 过夜采集的烽火台最新档案（源表该行为空）" style="color:#2f7fd4">采集</small>';
  if(supp(o).hireHistorical) return fmtD(supp(o).hireHistorical)+' <small title="历史入职（'+esc(supp(o).sourceAt||'')+'缓存），可能存在重新入职，请复核" style="color:#b26a00">历史</small>';
  return '<span class="cert-none">待补充</span>';
}
function fmtCert(o,key){
  if(o[key]) return fmtD(o[key]);
  var d=dv(o);
  if(key==='e'){
    if(d.e) return fmtD(d.e)+' <small title="按“发证日期+1年”由 '+esc(DERIVED_AT)+' 采集的发证日期推算，源表该行为空" style="color:#b26a00">推定</small>';
    if((prof(o).ct||d.ct)===2) return '<span class="cert-none" title="该骑手当前证件类型为回执单，不适用健康证到期">不适用</span>';
  }
  if(key==='x'){
    if(d.x) return fmtD(d.x)+' <small title="按“入职+20天”由 '+esc(DERIVED_AT)+' 采集的入职日期推算，源表该行为空" style="color:#b26a00">推定</small>';
    if((prof(o).ct||d.ct)===1) return '<span class="cert-none" title="该骑手已持有健康证，无需回执单">不适用</span>';
  }
  return (!o.h&&!o.e&&!o.x&&!o.g)?'<span class="cert-none" title="健康证源字段缺失，不能据此认定无证">数据缺失</span>':'<span class="cert-none">未提供</span>';
}

var RV_LABEL={uncollected:'未采集',pending:'待核查',lowq:'需人工看图',domain_check:'域名待核实',risk:'发现风险线索',manual:'待人工复核',verified:'已核验',failed:'采集失败'};
var RV_CLASS={uncollected:'rv-none',pending:'rv-pending',lowq:'rv-lowq',domain_check:'rv-dom',risk:'rv-risk',manual:'rv-pending',verified:'rv-ok',failed:'rv-fail'};
function reviewOf(o){return Object.prototype.hasOwnProperty.call(REVIEW,String(o.r)) ? REVIEW[String(o.r)] || {} : {};}
function reviewStatus(o){var v=reviewOf(o).status;return Object.prototype.hasOwnProperty.call(RV_LABEL,v)?v:'uncollected';}
var reviewReturnFocus=null;
function closeReview(){document.getElementById('reviewMask').classList.remove('on');if(reviewReturnFocus) reviewReturnFocus.focus();}
function openReview(o){
  var v=reviewOf(o), k=reviewStatus(o);
  reviewReturnFocus=document.activeElement;
  function field(label,value){return '<dt>'+esc(label)+'</dt><dd>'+esc(value||'—')+'</dd>';}
  var reasons=Array.isArray(v.reasons)?v.reasons:[];
  document.getElementById('reviewContent').innerHTML='<b>'+esc(o.n)+' · '+esc(o.r)+'</b><p style="font-size:12px;color:#7890a8;margin:6px 0">'+esc(o.c)+' / '+esc(o.s)+'</p>'
    +'<span class="review-badge '+RV_CLASS[k]+'">'+RV_LABEL[k]+'</span>'
    +'<div class="rv-box">'+(v.hasImage
      ?'<img src="http://127.0.0.1:8789/photo/'+encodeURIComponent(String(o.r))+'" alt="健康证原图" style="max-width:100%;border-radius:4px;border:1px solid #cce0f5" onerror="this.outerHTML=\'<span class=cert-none>图片加载失败，请确认核查服务已启动</span>\'">'
      :'尚未采集照片，本轮批量采集完成后自动出现。')+'</div>'
    +'<dl class="rv-grid">'+field('体检机构',v.institution)+field('证件编号',v.certificateMasked)+field('识别有效期',v.expiry)+field('二维码摘要',v.qrSummary)+field('采集时间',v.collectedAt)+field('图片是否更新',v.imageChanged===true?'有更新':v.imageChanged===false?'无更新':'未知')+'</dl>'
    +'<div class="rv-box"><b>'+(k==='domain_check'?'待核实说明':k==='risk'?'风险依据':'核查说明')+'</b><br>'+(reasons.length?reasons.map(esc).join('<br>'):'暂无核查结果；不代表已证实有效。')+'</div>'
    +'<dl class="rv-grid">'+field('人工结论',v.conclusion)+field('复核人',v.reviewer)+field('复核时间',v.checkedAt)+field('核验依据',v.evidenceSummary)+'</dl>'
    +'<p class="rv-note">到期状态与真伪核查独立。跨省、二维码协议、域名外观或相似图片均不能单独认定造假。当前不推送核查结果。</p>';
  document.getElementById('reviewMask').classList.add('on');document.getElementById('reviewClose').focus();
}
document.getElementById('reviewClose').onclick=closeReview;
document.getElementById('reviewMask').onclick=function(e){if(e.target===this) closeReview();};
document.addEventListener('keydown',function(e){if(!document.getElementById('reviewMask').classList.contains('on')) return;if(e.key==='Escape') closeReview();if(e.key==='Tab'){e.preventDefault();document.getElementById('reviewClose').focus();}});
document.getElementById('tb').addEventListener('click',function(e){var b=e.target.closest('[data-review-id]');if(!b)return;var id=b.getAttribute('data-review-id');var o=DATA.find(function(x){return String(x.r)===id;});if(o)openReview(o);});
var TODAY = (function(){ var d=new Date(); function p(n){return n<10?'0'+n:''+n;} return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); })();

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function days(a,b){ if(!a||!b) return null; var x=new Date(a+'T00:00:00'),y=new Date(b+'T00:00:00'); return Math.round((x-y)/86400000); }
function fmtD(a){ if(!a) return '<span class="cert-none">—</span>'; return esc(a); }
function fmtN(n){ if(n===null) return '<span class="cert-none">—</span>';
  var c = n<0?' class="d-neg"':(n<=7?' class="d-warn"':(n<=30?' class="d-mid"':''));

/* 预计算：剩余天数与状态（一次性） */
DATA.forEach(function(o){
  var d = dv(o);
  o.dE = o.e || d.e || '';        // 健康证到期（源→推定）
  o.dX = o.x || d.x || '';        // 回执单到期（源→推定）
  o.dH = hireValue(o);            // 入职日期（源→采集→历史）
  o.eD = !o.e && !!d.e;           // 该到期日是否为推定
  o.xD = !o.x && !!d.x;
  o.hd2 = o.dE ? days(o.dE, TODAY) : null;   // 健康证剩余
  o.rd  = o.dX ? days(o.dX, TODAY) : null;   // 回执单剩余
  o.hd  = o.dH ? days(TODAY, o.dH) : null;   // 入职天数
  o.st  = statusOf(o);
  o.reviewStatus = reviewStatus(o);
  o.hasImg = !!(REVIEW[String(o.r)]||{}).hasImage;
  o.ctp = certTypeOf(o); o.cd = certDateOf(o);
});
function statusOf(o){
  var ct = prof(o).ct || dv(o).ct || 0;
  /* 三个日期全都没有 = 既没采集到档案、源表也没这行，属于「未知」。
     （不能因为区域被回填了就当成已知；更不能直接判双无·停用——这是最伤人的误判） */
  if(!o.dH && !o.dE && !o.dX) return 'missing';
  if(o.p===1) return 'pre';
  var h=o.hd2, r=o.rd;
  if(!o.dE && !o.dX) return (ct===1||ct===2)?'rnew':'none';
  if(o.dE){
    if(h<0) return 'expired';
    if(h<=7) return 'd7';
    if(h<=30) return 'd30';
    if(h<=90) return 'd90';
    return 'ok';
  }
  if(r!==null && r<0) return 'rexpired';
  if(r!==null && r<=7) return 'rd7';
  return 'rnew';
}

/* 筛选下拉：多选 + 级联联动（2026-09-29） */
var REGION_ORDER=['华北一区','华北二区','华北三区','华东大区','中南大区'];
var SELS={
  big :{el:'msBig', label:'全部大区', field:'b', order:REGION_ORDER,       parents:[]},
  reg :{el:'msReg',  label:'全部区域', field:'g', order:null,              parents:['big']},
  city:{el:'msCity', label:'全部城市', field:'c', order:null,              parents:['big','reg']},
  site:{el:'msSite', label:'全部站点', field:'s', order:null,              parents:['big','reg','city']}
};
var SEL_KEYS=['big','reg','city','site'];
var sel={big:[],reg:[],city:[],site:[]};   /* 各级已选值 */
var OPTS={big:[],reg:[],city:[],site:[]};  /* 各级当前可选值（级联收窄后） */

/* 按祖先级选中收窄数据池 */
function poolFor(key){
  var arr=DATA;
  for(var i=0;i<SELS[key].parents.length;i++){
    var p=SELS[key].parents[i];
    if(sel[p].length){
      var m={}; sel[p].forEach(function(v){m[v]=1;});
      var f=SELS[p].field, out=[];
      for(var j=0;j<arr.length;j++){ if(m[arr[j][f]]) out.push(arr[j]); }
      arr=out;
    }
  }
  return arr;
}
function rebuildOpts(key){
  var f=SELS[key].field, arr=poolFor(key), seen={}, vals=[];
  for(var i=0;i<arr.length;i++){ var v=arr[i][f]; if(v&&!seen[v]){seen[v]=1;vals.push(v);} }
  var order=SELS[key].order;
  vals.sort(function(a,b){
    if(order){ var ia=order.indexOf(a),ib=order.indexOf(b);
      if(ia!==-1&&ib!==-1) return ia-ib;
      if(ia!==-1) return -1; if(ib!==-1) return 1; }
    return a.localeCompare(b,'zh-Hans-CN');
  });
  OPTS[key]=vals;
  /* 祖先变化后，本级已选值若不在可选池内则剔除 */
  sel[key]=sel[key].filter(function(v){return vals.indexOf(v)>=0;});
}
/* 各级选项计数（供勾选时参考） */
function cntFor(key){
  var f=SELS[key].field, arr=poolFor(key), m={};
  for(var i=0;i<arr.length;i++){ var v=arr[i][f]; if(v){ m[v]=(m[v]||0)+1; } }
  return m;
}
function renderMsel(key){
  var cfg=SELS[key], box=document.getElementById(cfg.el), chosen=sel[key];
  var cnt=cntFor(key);
  var txt = chosen.length===0 ? cfg.label
          : chosen.length===1 ? chosen[0]
          : cfg.label.replace('全部','')+'（'+chosen.length+'）';
  box.innerHTML =
    '<button type="button" class="ms-btn'+(chosen.length?' on':'')+'"><span>'+esc(txt)+'</span><span class="ms-caret">▼</span></button>'
    +'<div class="ms-panel">'
    +  '<div class="ms-ops"><a data-act="all">全选</a><a data-act="none">清空</a><span style="margin-left:auto;color:#5c7a9e">可多选</span></div>'
    +  '<div class="ms-list">'+OPTS[key].map(function(v){
        return '<label class="ms-item"><input type="checkbox" value="'+esc(v)+'"'+(chosen.indexOf(v)>=0?' checked':'')+'>'
          +'<span class="ms-lb">'+esc(v)+'</span><span class="ms-count">'+(cnt[v]||0)+'</span></label>';
      }).join('')+'</div></div>';
  box.querySelector('.ms-btn').onclick=function(ev){
    ev.stopPropagation();
    var willOpen=!box.classList.contains('open');
    closeAllMsel();
    if(willOpen) box.classList.add('open');
  };
  box.querySelector('.ms-panel').onclick=function(ev){ ev.stopPropagation(); };
  Array.prototype.forEach.call(box.querySelectorAll('.ms-ops a'),function(a){
    a.onclick=function(){
      var act=a.getAttribute('data-act');
      sel[key]= act==='all' ? OPTS[key].slice() : [];
      applyCascade(key);
    };
  });
  Array.prototype.forEach.call(box.querySelectorAll('.ms-list input'),function(cb){
    cb.onchange=function(){
      var set={}; sel[key].forEach(function(v){set[v]=1;});
      if(cb.checked) set[cb.value]=1; else delete set[cb.value];
      sel[key]=OPTS[key].filter(function(v){return set[v];});
      applyCascade(key);
    };
  });
}
/* 某级选择变化后：重建后代选项（剔除越界选中）并重渲染 + 刷新数据 */
function applyCascade(key){
  var i=SEL_KEYS.indexOf(key);
  for(var j=i;j<SEL_KEYS.length;j++) rebuildOpts(SEL_KEYS[j]);
  for(var k=i;k<SEL_KEYS.length;k++) renderMsel(SEL_KEYS[k]);
  filter();
}
function closeAllMsel(){
  Array.prototype.forEach.call(document.querySelectorAll('.msel.open'),function(b){b.classList.remove('open');});
}
document.addEventListener('click',closeAllMsel);

SEL_KEYS.forEach(rebuildOpts);
SEL_KEYS.forEach(renderMsel);

function filter(){
  var q=st.q;
  /* 多选级联：命中任意选中值即通过（级为空=不限） */
  function hit(key,field){
    var a=sel[key]; if(!a.length) return true;
    return a.indexOf(field)>=0;
  }
  view=DATA.filter(function(o){
    if(!st.pre && o.p===1) return false;
    if(!hit('big',o.b)) return false;
    if(!hit('reg',o.g)) return false;
    if(!hit('city',o.c)) return false;
    if(!hit('site',o.s)) return false;
    if(st.stt && o.st!==st.stt) return false;
    if(document.getElementById('fReview').value && o.reviewStatus!==document.getElementById('fReview').value) return false;
    if(st.hire){
      var hd=o.hd; if(hd===null) return false;
      var lim=parseInt(st.hire,10);
      if(lim===30){ if(!(hd<=30)) return false; }
      else if(lim===90){ if(!(hd>30&&hd<=90)) return false; }
      else if(lim===365){ if(!(hd>90&&hd<=365)) return false; }
      else { if(!(hd>365)) return false; }
    }
    if(q){ var s=(o.s+' '+o.r+' '+o.n+' '+o.c).toLowerCase(); if(s.indexOf(q)===-1) return false; }
    return true;
  });
  sort(); st.page=1; render(); renderStats(); renderRank();
}

function sort(){
  var k=st.key,d=st.dir;
  view.sort(function(a,b){
    /* 大区按业务顺序：华北一区→二区→三区→华东→中南（非拼音序） */
    if(k==='b'){
      var ia=REGION_ORDER.indexOf(a.b), ib=REGION_ORDER.indexOf(b.b);
      if(ia<0) ia=REGION_ORDER.length; if(ib<0) ib=REGION_ORDER.length;
      if(ia!==ib) return (ia-ib)*d;
      /* 同大区内按 区域→城市→站点→姓名 */
      var t=(a.g||'').localeCompare(b.g||'','zh-Hans-CN');
      if(t) return t*d;
      t=(a.c||'').localeCompare(b.c||'','zh-Hans-CN'); if(t) return t*d;
      t=(a.s||'').localeCompare(b.s||'','zh-Hans-CN'); if(t) return t*d;
      return (a.n||'').localeCompare(b.n||'','zh-Hans-CN')*d;
    }
    /* e/x/h 列已包含推定值，排序必须用生效值，否则推定行会被当成空值排在末尾 */
    var va, vb;
    if(k==='e'){ va=a.dE; vb=b.dE; }
    else if(k==='x'){ va=a.dX; vb=b.dX; }
    else if(k==='h'){ va=a.dH; vb=b.dH; }
    else { va=a[k]; vb=b[k]; }
    if(k==='e'||k==='x'||k==='h'){
      /* 没有该证件的（不适用）不参与日期排序，永远沉到最后 */
      var ea=!va, eb=!vb;
      if(ea!==eb) return ea?1:-1;
      return String(va).localeCompare(String(vb))*d;
    }
    if(k==='hd2'||k==='rd'||k==='hd'||k==='r'){
      var na=(va===null||va==='')?-999999:Number(va), nb=(vb===null||vb==='')?-999999:Number(vb);
      return (na-nb)*d;
    }
    va=String(va==null?'':va); vb=String(vb==null?'':vb);
    return va.localeCompare(vb,'zh-Hans-CN')*d;
  });
}

/* 缩略图加载失败兜底（2026-11-05）
   背景：照片列的 <img src="http://127.0.0.1:8789/thumb/xxx"> 依赖本机核查服务。
   8789 一旦挂掉，整列会静默变成「未生成」，看不出是服务没起还是照片真没有。
   这里改成显式「加载失败·重试」+ 悬浮说明，点击可原地重建 img（带 t= 破缓存），
   服务恢复后不用整页刷新。 */
function hcThumbFail(el){
  var src=el.getAttribute('src')||'';
  var rid=el.getAttribute('data-review-id')||'';
  var d=document.createElement('span');
  d.className='cert-none';
  d.style.cursor='pointer';
  d.title='照片服务 127.0.0.1:8789 未响应或图片缺失，点击重试';
  d.textContent='加载失败·重试';
  d.onclick=function(){
    var im=document.createElement('img');
    im.className='hc-thumb'; im.loading='lazy';
    im.setAttribute('data-review-id',rid);
    im.title='点击查看原图'; im.alt='证件缩略图';
    /* 注意：不要给 src 追加 ?t= 破缓存参数。
       hc_review_service.py 的 /thumb/ 路由用 path.split('/')[2] 直接当 riderId，
       带查询串会 RID.fullmatch 失败返回 400 invalid_id，重试必然还是失败。
       新建 img 元素本身会重新发起请求，服务恢复后即可加载。 */
    im.src=src;
    im.onerror=function(){ hcThumbFail(im); };
    if(d.parentNode) d.parentNode.replaceChild(im,d);
  };
  if(el.parentNode) el.parentNode.replaceChild(d,el);
}
/* 整个看板脚本包在 (function(){...})() 里，行内 onerror 走的是全局作用域，

/* KPI（随筛选联动） */
function renderStats(){
  var c={'none':0,'expired':0,'d7':0,'d30':0,'d90':0,'ok':0,'rexpired':0,'rd7':0,'rnew':0};
  view.forEach(function(o){ if(c[o.st]!==undefined) c[o.st]++; });
  var total=view.length;
  var bad=c.none+c.expired+c.rexpired;
  var hasCert=view.filter(function(o){return o.ctp==='健康证';}).length;
  var known=total-view.filter(function(o){return o.st==='missing';}).length;
  var derivedN=view.filter(function(o){return o.eD||o.xD||(!o.h&&!supp(o).hireHistorical&&!!dv(o).hire);}).length;
  var rate=known?((known-bad)/known*100):null;
  var cov=total?(hasCert/total*100):0;
  var todo=c.expired+c.none+c.d7+c.rd7+c.rexpired;
  var urgent=c.expired+c.none;
  var d7all=c.d7+c.rd7+c.rexpired;
  var d30all=c.d30;
  var newOnly=c.rnew+c.rd7+c.rexpired;
  var cards=[
    ['ic0','在职骑手',total,'',''],
    ['icMissing','未采集·待核实',view.filter(function(o){return o.st==='missing';}).length,'warning','其中推定补全 '+derivedN+' 人'],
    ['ic1','当前不合规',bad,'danger','停用 '+urgent+' · 需处理'],
    ['ic2','7 天内到期',d7all,'warning','健康证 '+c.d7+' · 回执单 '+(c.rd7+c.rexpired)],
    ['ic3','30 天内到期',d30all,'warning','本月计划续办'],
    ['ic4','回执单临期',(c.rd7+c.rexpired),'warning','到期即无证上岗'],
    ['ic5','新人待取证',newOnly,'','入职≤30天过渡期'],
    ['ic6','健康证覆盖率',cov.toFixed(1)+'%','',hasCert+' / '+total],
    ['ic7','上岗合规率',rate===null?'—':rate.toFixed(2)+'%','ok',rate===null?'排除源数据缺失':(known-bad)+' 人合规']
  ];
  document.getElementById('stats').innerHTML=cards.map(function(x){
    return '<div class="sc '+(x[3]||'')+'"><div class="l">'+x[1]+'</div><div class="n">'+x[2]+'</div><div class="sub">'+(x[4]||'&nbsp;')+'</div></div>';
  }).join('');
  document.getElementById('todoBar').innerHTML='<span class="tt">当前筛选待处理 '+todo+' 人</span>'
    +'<span class="tchip red" data-st="expired">已过期停用 '+c.expired+'</span>'
    +'<span class="tchip red" data-st="none">双无 '+c.none+'</span>'
    +'<span class="tchip orange" data-st="d7">健康证7天内 '+c.d7+'</span>'
    +'<span class="tchip orange" data-st="rd7">回执单7天内 '+c.rd7+'</span>'
    +'<span class="tchip red" data-st="rexpired">回执单已过期 '+c.rexpired+'</span>'
    +'<span class="tchip amber" data-st="d30">30天内 '+c.d30+'</span>'
    +'<span class="hint">点击色块直接筛出该批名单</span>';
  Array.prototype.forEach.call(document.querySelectorAll('.tchip[data-st]'),function(el){
    el.onclick=function(){ st.stt=el.getAttribute('data-st'); document.getElementById('fSt').value=st.stt; filter(); };
  });
}

/* 站点风险排行（按筛选结果内待处理人数） */
function renderRank(){
  var m={};
  view.forEach(function(o){
    if(['none','expired','d7','d30','rd7','rexpired'].indexOf(o.st)<0) return;
    var k=o.c+' · '+o.s; if(!m[k]) m[k]=0; m[k]++;
  });
  var arr=Object.keys(m).map(function(k){return [k,m[k]];}).sort(function(a,b){return b[1]-a[1];}).slice(0,10);
  var box=document.getElementById('rankBox');
  if(!arr.length){ box.innerHTML='<h3>站点风险排行</h3><div class="empty" style="padding:16px">当前筛选无待处理人员</div>'; return; }
  var max=arr[0][1]||1;
  box.innerHTML='<h3>站点风险排行 · 按待处理人数（Top 10）</h3>'+arr.map(function(x){
    var pct=Math.round(x[1]/max*100);
    var col=x[1]>=max*0.8?'#c62828':(x[1]>=max*0.5?'#ef6c00':'#ffb74d');
    return '<div class="rrow"><div class="rname" data-site="'+esc(x[0].split(' · ')[1])+'">'+esc(x[0])+'</div>'
      +'<div class="rtrack"><div class="rfill" style="width:'+pct+'%;background:'+col+'"></div></div>'
      +'<div class="rval">'+x[1]+'</div></div>';
  }).join('');
  Array.prototype.forEach.call(box.querySelectorAll('.rname'),function(el){
    el.onclick=function(){
      /* 点排行站点：清空组织筛选并只选该站点 */
      sel.big=[];sel.reg=[];sel.city=[];sel.site=[el.getAttribute('data-site')];
      SEL_KEYS.forEach(rebuildOpts); SEL_KEYS.forEach(renderMsel); filter();
    };
  });
}

document.getElementById('btnHelp').addEventListener('click',function(){
  alert('数据来源：M:\\下载 下最新「骑手排班明细数据_*.xlsx」+ 最新「_健康证到期监控_*.xlsx」。\n\n'
    +'更新方式：全自动。M盘监控服务（每60秒扫描）发现新表落地后，会自动重建本看板数据，无需任何手动操作；本页面刷新即可看到最新数据。');
});
document.getElementById('btnExp').addEventListener('click',function(){
  var head=['大区','区域','城市','站点','骑手ID','姓名','类型','发证日期','入职日期','入职日期来源','健康证到期','剩余天数','回执单到期','回执单剩余','处置','核查状态','证件照片'];
  var rows=view.map(function(o){
    return [o.b,o.g,o.c,o.s,o.r,o.n,o.ctp||'',o.cd||'',hireValue(o),(o.h?'健康证源':dv(o).hire?'采集 '+DERIVED_AT:supp(o).hireHistorical?'历史缓存 '+supp(o).sourceAt:'缺失'),o.dE||'',(o.hd2===null?'':o.hd2)+(o.eD?'（推定）':''),o.dX||'',(o.rd===null?'':o.rd)+(o.xD?'（推定）':''),(ST_LABEL[o.st]||o.st),RV_LABEL[o.reviewStatus]||'未采集',o.hasImg?'有':'无'];
  });
  var csv=[head].concat(rows).map(function(r){
    return r.map(function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';}).join(',');
  }).join('\r\n');
  var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='健康证督办名单_'+TODAY+'_'+view.length+'人.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
});
document.getElementById('btnShot').addEventListener('click',function(){
  if(!window.html2canvas){ alert('截图库未加载（_libs/html2canvas），请联网后重试'); return; }
  var btn=this, old=btn.textContent;
  btn.disabled=true; btn.textContent='截图中…';
  var oldSize=st.size, oldPage=st.page;
  /* 行数过多时不能全展开：展开后画布高度超浏览器上限会导致 toDataURL 返回空图 */
  var expanded=false;
  if(view.length<=1500){ st.size=view.length; st.page=1; render(); expanded=true; }  // 展开全部行整版截图
  else { st.page=1; render(); alert('当前共 '+view.length+' 行，超出整版截图上限，本次截取当前页；请先按大区/站点筛选后再截图可截全量。'); }
  /* 关键：解除表格容器 max-height/overflow 滚动裁剪，否则 html2canvas 只截到可视区（隐藏行） */
  var tc=document.getElementById('tc');
  var oldMH=tc.style.maxHeight, oldOF=tc.style.overflow;
  tc.style.maxHeight='none'; tc.style.overflow='visible';
  /* 动态 scale：不超过浏览器画布上限（单边65535px、总面积2.68亿px），上限2倍清晰度 */
  var w=document.body.scrollWidth, h=document.body.scrollHeight;
  var scale=Math.max(0.5, Math.min(2, 268435456/(w*h), 65535/h));
  setTimeout(function(){
    html2canvas(document.body,{backgroundColor:'#fff',scale:scale,useCORS:true,windowWidth:w})
      .then(function(canvas){
        var a=document.createElement('a');
        a.href=canvas.toDataURL('image/png');
        a.download='健康证监控看板_'+TODAY+'.png';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
      })
      .catch(function(e){ alert('截图失败：'+e.message); })
      .then(function(){
        tc.style.maxHeight=oldMH; tc.style.overflow=oldOF;   // 恢复滚动容器
        if(expanded){ st.size=oldSize; st.page=oldPage; }
        render();
        btn.disabled=false; btn.textContent=old;
      });
  }, 300);
});
Array.prototype.forEach.call(document.querySelectorAll('th[data-sort]'),function(th){
  th.addEventListener('click',function(){
    var k=th.getAttribute('data-sort');
    st.dir=(st.key===k)?-st.dir:1; st.key=k; sort(); render();
    Array.prototype.forEach.call(document.querySelectorAll('th .sort'),function(s){s.className='sort';});
    var ind=th.querySelector('.sort')||document.createElement('span');
    ind.className='sort '+(st.dir===1?'asc':'desc');
    if(!th.querySelector('.sort')) th.appendChild(ind);
  });
});

filter();
})();
