<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>在职骑手详情 · 健康证到期监控</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei',Arial,sans-serif;background:#e8f4fd;color:#1a2e45;min-height:100vh}
.header{background:linear-gradient(135deg,#1565c0,#1976d2,#1e88e5);padding:12px 24px;border-bottom:3px solid #0d47a1;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;box-shadow:0 2px 8px rgba(21,101,192,.4);position:sticky;top:0;z-index:100}
.header h1{font-size:18px;font-weight:700;color:#fff;letter-spacing:1px;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.header p{font-size:12px;color:#bbdefb;margin-top:3px;line-height:1.6}
.hbtn{padding:6px 14px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:4px;font-size:12px;cursor:pointer;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.7)}

.stats{display:flex;gap:10px;padding:12px 16px;flex-wrap:wrap;background:#f0f7ff}
.sc{background:linear-gradient(135deg,#fff,#e3f2fd);border:1px solid #90caf9;border-radius:10px;padding:12px 16px;min-width:140px;flex:1 1 170px;max-width:250px;box-shadow:0 3px 12px rgba(21,101,192,.1);text-align:center;transition:transform .15s}
.sc:hover{transform:translateY(-2px)}
.sc .ic{font-size:22px;line-height:1;margin-bottom:4px}
.sc .n{font-size:26px;font-weight:800;color:#1565c0;line-height:1.2}
.sc .l{font-size:11px;color:#5c7a9e;margin-bottom:2px}
.sc .sub{font-size:11px;color:#7890a8;margin-top:3px;line-height:1.4}
.sc.danger{background:linear-gradient(135deg,#fff,#ffebee);border-color:#ef9a9a}
.sc.danger .n,.sc.danger .ic{color:#c62828}
.sc.warning{background:linear-gradient(135deg,#fff,#fff3e0);border-color:#ffb74d}
.sc.warning .n,.sc.warning .ic{color:#e65100}
.sc.ok{background:linear-gradient(135deg,#fff,#e8f5e9);border-color:#a5d6a7}
.sc.ok .n,.sc.ok .ic{color:#2e7d32}

.todo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#fff8e1;border-bottom:1px solid #ffe0b2;font-size:13px}
.todo .tt{font-weight:700;color:#5d4037}
.tchip{padding:4px 12px;border-radius:14px;font-size:12px;cursor:pointer;border:1px solid transparent;font-weight:600}
.tchip.red{background:#c62828;color:#fff}
.tchip.orange{background:#ef6c00;color:#fff}
.tchip.amber{background:#fff;color:#e65100;border-color:#ffb74d}
.tchip:hover{opacity:.85}
.todo .hint{font-size:11px;color:#8d6e63;margin-left:auto}

.filter-bar{display:flex;gap:8px;padding:10px 16px;flex-wrap:wrap;align-items:center;background:#f5f9ff;border-bottom:1px solid #90caf9}
.filter-bar select,.filter-bar input{padding:6px 9px;border:1px solid #90caf9;border-radius:4px;font-size:13px;background:#fff;color:#1a2e45;outline:none}
.filter-bar select:focus,.filter-bar input:focus{border-color:#1565c0}
.filter-bar input{flex:1;min-width:170px}
.row-count{font-size:12px;color:#5c7a9e;font-weight:600}
.chk{display:flex;align-items:center;gap:4px;font-size:12px;color:#5c7a9e;cursor:pointer;white-space:nowrap}
.btn-exp{padding:6px 12px;background:#1565c0;color:#fff;border:none;border-radius:4px;font-size:12px;cursor:pointer}
.btn-exp:hover{background:#0d47a1}

.rank{margin:12px 16px 0;background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(21,101,192,.1);padding:12px 14px}
.rank h3{font-size:14px;font-weight:600;color:#1565c0;margin-bottom:10px}
.rrow{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:12px}
.rname{width:180px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;color:#1a2e45}
.rname:hover{color:#1565c0;text-decoration:underline}
.rtrack{flex:1;height:13px;background:#e3f2fd;border-radius:3px;overflow:hidden}
.rfill{height:100%;border-radius:3px}
.rval{width:44px;text-align:right;font-weight:600;color:#1a2e45}

#tc{margin:12px 16px 0;background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(21,101,192,.1);overflow:auto;max-height:calc(100vh - 200px)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:#1565c0;color:#fff;padding:8px 9px;text-align:left;font-weight:600;white-space:nowrap;cursor:pointer;user-select:none;border:1px solid #1976d2;z-index:2}
th:hover{background:#1976d2}
td{padding:6px 9px;border:1px solid #cce0f5;white-space:nowrap;background:#fff}
tr:hover td{background:#f0f7ff}
.sort::after{font-size:10px;margin-left:2px;color:#90caf9}
.sort.asc::after{content:"▲"}.sort.desc::after{content:"▼"}
.num{text-align:right}
.d-neg{color:#c62828 !important;font-weight:700}
.d-warn{color:#e65100 !important;font-weight:600}
.d-mid{color:#f9a825 !important}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.b-none{background:#c62828;color:#fff}
.b-expired{background:#ef5350;color:#fff}
.b-d7{background:#ef6c00;color:#fff}
.b-d30{background:#ffb74d;color:#5d4037}
.b-d90{background:#fff59d;color:#5d4037}
.b-ok{background:#e8f5e9;color:#2e7d32}
.b-rd7{background:#8e24aa;color:#fff}
.b-rnew{background:#e3f2fd;color:#1565c0}
.b-pre{background:#eceff1;color:#607d8b}
.cert-none{color:#90a4ae;font-style:italic}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;padding:12px 16px 26px;flex-wrap:wrap;font-size:13px;color:#5c7a9e}
.pager button{padding:5px 13px;border:1px solid #90caf9;background:#fff;color:#1565c0;border-radius:4px;cursor:pointer;font-size:13px}
.pager button:disabled{opacity:.4;cursor:default}
.pager select{padding:5px 8px;border:1px solid #90caf9;border-radius:4px;background:#fff;color:#1a2e45}
.pager .info{font-weight:600;color:#1a2e45}
.empty{text-align:center;padding:40px;color:#90a4ae;font-size:14px}
.note{padding:8px 16px;font-size:11px;color:#7890a8;background:#f0f7ff}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>在职骑手详情 · 健康证到期监控</h1>
    <p id="metaLine">加载中...</p>
  </div>
  <button class="hbtn" id="btnHelp" title="数据来自 M:\下载 最新排班表 + 最新健康证监控表">更新数据</button>
</div>

<div class="todo" id="todoBar"></div>

<div class="stats" id="stats"></div>

<div class="filter-bar">
  <select id="fBig"><option value="">全部大区</option></select>
  <select id="fReg"><option value="">全部区域</option></select>
  <select id="fCity"><option value="">全部城市</option></select>
  <select id="fSite"><option value="">全部站点</option></select>
  <select id="fSt">
    <option value="">全部处置状态</option>
    <option value="none">双无（立即停用）</option>
    <option value="expired">健康证已过期</option>
    <option value="d7">健康证 7 天内</option>
    <option value="d30">健康证 30 天内</option>
    <option value="d90">健康证 90 天内</option>
    <option value="rd7">回执单 7 天内</option>
    <option value="rexpired">回执单已过期</option>
    <option value="rnew">新人待取证</option>
    <option value="ok">正常</option>
  </select>
  <select id="fHire">
    <option value="">全部入职时长</option>
    <option value="30">入职 ≤30 天</option>
    <option value="90">入职 31-90 天</option>
    <option value="365">入职 91-365 天</option>
    <option value="9999">入职 &gt;1 年</option>
  </select>
  <input id="fQ" placeholder="搜索姓名 / 骑手ID / 站点">
  <label class="chk"><input type="checkbox" id="fPre"> 含预离职已通过</label>
  <button class="btn-exp" id="btnExp">导出督办名单</button>
  <span class="row-count" id="rowCount"></span>
</div>

<div class="rank" id="rankBox"></div>

<div id="tc">
  <table>
    <thead><tr>
      <th data-sort="g">区域</th>
      <th data-sort="c">城市</th>
      <th data-sort="s">站点</th>
      <th data-sort="r">骑手ID</th>
      <th data-sort="n">姓名</th>
      <th data-sort="h">入职日期</th>
      <th data-sort="hd" class="num">入职天数</th>
      <th data-sort="e">健康证到期</th>
      <th data-sort="hd2" class="num">剩余</th>
      <th data-sort="x">回执单到期</th>
      <th data-sort="rd" class="num">回执单剩余</th>
      <th data-sort="st">处置</th>
    </tr></thead>
    <tbody id="tb"></tbody>
  </table>
</div>
<div class="pager" id="pager"></div>
<div class="note" id="noteLine"></div>

<script src="health_cert_data.js"></script>
<script>
(function(){
var META = window.HC_META || {};
var DATA = window.HC_DATA || [];
var TODAY = (function(){ var d=new Date(); function p(n){return n<10?'0'+n:''+n;} return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); })();

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function days(a,b){ if(!a||!b) return null; var x=new Date(a+'T00:00:00'),y=new Date(b+'T00:00:00'); return Math.round((x-y)/86400000); }
function fmtD(a){ if(!a) return '<span class="cert-none">—</span>'; return esc(a); }
function fmtN(n){ if(n===null) return '<span class="cert-none">—</span>';
  var c = n<0?' class="d-neg"':(n<=7?' class="d-warn"':(n<=30?' class="d-mid"':''));
  return '<span'+c+'>'+n+'天</span>'; }
function hireDays(o){ return days(TODAY,o.h); }

var ST_LABEL={'none':'双无·停用','expired':'已过期·停用','d7':'7天内·紧急','d30':'30天内·待办','d90':'90天内·关注','ok':'正常','rexpired':'回执单过期','rd7':'回执单7天·紧急','rnew':'新人待取证','pre':'预离职'};
var ST_CLS={'none':'b-none','expired':'b-expired','d7':'b-d7','d30':'b-d30','d90':'b-d90','ok':'b-ok','rexpired':'b-expired','rd7':'b-rd7','rnew':'b-rnew','pre':'b-pre'};

/* 预计算：剩余天数与状态（一次性） */
DATA.forEach(function(o){
  o.hd2 = o.e ? days(o.e, TODAY) : null;   // 健康证剩余
  o.rd  = o.x ? days(o.x, TODAY) : null;   // 回执单剩余
  o.hd  = hireDays(o);                      // 入职天数
  o.st  = statusOf(o);
});
function statusOf(o){
  if(o.p===1) return 'pre';
  var h=o.hd2, r=o.rd;
  if(!o.e && !o.x) return 'none';
  if(o.e){
    if(h<0) return 'expired';
    if(h<=7) return 'd7';
    if(h<=30) return 'd30';
    if(h<=90) return 'd90';
    return 'ok';
  }
  if(r!==null && r<0) return 'rexpired';
  if(r!==null && r<=7) return 'rd7';
  return 'rnew';
}

var st={big:'',reg:'',city:'',site:'',stt:'',hire:'',q:'',pre:false,key:'hd2',dir:1,page:1,size:100};
var view=[];

/* 顶部元信息 */
(function(){
  var m=META;
  document.getElementById('metaLine').innerHTML =
    '在职基数：排班明细 ' + esc(m.sched_date||'-') + '　|　证件状态：烽火台健康证监控 T-1 ' + esc(m.hc_date||'-')
    + '　|　生成 ' + esc(m.gen||'-') + '　|　剩余天数按今日 ' + TODAY + ' 实时计算';
  document.getElementById('noteLine').textContent =
    '口径说明：在职名单以当日排班明细为准（实名），证件状态由 T-1 健康证监控表按骑手ID左连接；默认排除「预离职已通过」人员，勾选后可查看。';
})();

/* 筛选下拉：级联填充 */
function fillSel(id, arr, cur){
  var el=document.getElementById(id); var keep=el.value;
  var vals=arr.filter(function(v,i,a){return v&&a.indexOf(v)===i;}).sort(function(a,b){return a.localeCompare(b,'zh-Hans-CN');});
  el.innerHTML='<option value="">'+cur+'</option>'+vals.map(function(v){return '<option value="'+esc(v)+'">'+esc(v)+'</option>';}).join('');
  if(vals.indexOf(keep)>=0) el.value=keep;
}
var allBig=[],allReg=[],allCity=[],allSite=[];
DATA.forEach(function(o){ allBig.push(o.b); allReg.push(o.g); allCity.push(o.c); allSite.push(o.s); });
fillSel('fBig',allBig,'全部大区'); fillSel('fReg',allReg,'全部区域');
fillSel('fCity',allCity,'全部城市'); fillSel('fSite',allSite,'全部站点');

function filter(){
  var q=st.q;
  view=DATA.filter(function(o){
    if(!st.pre && o.p===1) return false;
    if(st.big && o.b!==st.big) return false;
    if(st.reg && o.g!==st.reg) return false;
    if(st.city && o.c!==st.city) return false;
    if(st.site && o.s!==st.site) return false;
    if(st.stt && o.st!==st.stt) return false;
    if(st.hire){
      var hd=o.hd; if(hd===null) return false;
      var lim=parseInt(st.hire,10);
      if(lim===30){ if(!(hd<=30)) return false; }
      else if(lim===90){ if(!(hd>30&&hd<=90)) return false; }
      else if(lim===365){ if(!(hd>90&&hd<=365)) return false; }
      else { if(!(hd>365)) return false; }
    }
    if(q){ var s=(o.s+' '+o.r+' '+o.n+' '+o.c).toLowerCase(); if(s.indexOf(q)===-1) return false; }
    return true;
  });
  sort(); st.page=1; render(); renderStats(); renderRank();
}

function sort(){
  var k=st.key,d=st.dir;
  view.sort(function(a,b){
    var va=a[k],vb=b[k];
    if(k==='hd2'||k==='rd'||k==='hd'||k==='r'){
      var na=(va===null||va==='')?-999999:Number(va), nb=(vb===null||vb==='')?-999999:Number(vb);
      return (na-nb)*d;
    }
    va=String(va==null?'':va); vb=String(vb==null?'':vb);
    return va.localeCompare(vb,'zh-Hans-CN')*d;
  });
}

function render(){
  var total=view.length, pages=Math.max(1,Math.ceil(total/st.size));
  if(st.page>pages) st.page=pages;
  var start=(st.page-1)*st.size, slice=view.slice(start,start+st.size), html=[];
  for(var i=0;i<slice.length;i++){
    var o=slice[i];
    html.push('<tr>'
      +'<td>'+esc(o.g)+'</td><td>'+esc(o.c)+'</td><td>'+esc(o.s)+'</td>'
      +'<td>'+esc(o.r)+'</td><td>'+esc(o.n)+'</td>'
      +'<td>'+fmtD(o.h)+'</td><td class="num">'+(o.hd===null?'—':o.hd)+'</td>'
      +'<td>'+fmtD(o.e)+'</td><td class="num">'+fmtN(o.hd2)+'</td>'
      +'<td>'+fmtD(o.x)+'</td><td class="num">'+fmtN(o.rd)+'</td>'
      +'<td><span class="badge '+(ST_CLS[o.st]||'b-pre')+'">'+(ST_LABEL[o.st]||o.st)+'</span></td></tr>');
  }
  document.getElementById('tb').innerHTML=html.join('')||'<tr><td colspan="12" class="empty">没有符合条件的骑手</td></tr>';
  document.getElementById('rowCount').textContent='筛选 '+total+' 人';
  var end=Math.min(start+st.size,total);
  var pg=document.getElementById('pager');
  pg.innerHTML='<button id="pgF"'+(st.page<=1?' disabled':'')+'>首页</button>'
    +'<button id="pgP"'+(st.page<=1?' disabled':'')+'>上一页</button>'
    +'<span class="info">'+(total?start+1:0)+'-'+end+' / 共 '+total+' 人</span>'
    +'<button id="pgN"'+(st.page>=pages?' disabled':'')+'>下一页</button>'
    +'<button id="pgL"'+(st.page>=pages?' disabled':'')+'>末页</button>　第 <b>'+st.page+'</b>/'+pages+' 页　'
    +'<select id="pgS">'+[50,100,200,500].map(function(n){return '<option value="'+n+'"'+(n===st.size?' selected':'')+'>'+n+' 条/页</option>';}).join('')+'</select>';
  var b=function(id,fn){var e=document.getElementById(id); if(e) e.onclick=fn;};
  b('pgF',function(){st.page=1;render();}); b('pgP',function(){if(st.page>1){st.page--;render();}});
  b('pgN',function(){if(st.page<pages){st.page++;render();}}); b('pgL',function(){st.page=pages;render();});
  var s=document.getElementById('pgS'); if(s) s.onchange=function(){st.size=parseInt(this.value,10);st.page=1;render();};
}

/* KPI（随筛选联动） */
function renderStats(){
  var c={'none':0,'expired':0,'d7':0,'d30':0,'d90':0,'ok':0,'rexpired':0,'rd7':0,'rnew':0};
  view.forEach(function(o){ if(c[o.st]!==undefined) c[o.st]++; });
  var total=view.length;
  var bad=c.none+c.expired+c.rexpired;
  var hasCert=view.filter(function(o){return !!o.e;}).length;
  var rate=total?((total-bad)/total*100):0;
  var cov=total?(hasCert/total*100):0;
  var todo=c.expired+c.none+c.d7+c.rd7+c.rexpired;
  var urgent=c.expired+c.none;
  var d7all=c.d7+c.rd7+c.rexpired;
  var d30all=c.d30;
  var newOnly=c.rnew+c.rd7+c.rexpired;
  var cards=[
    ['ic0','在职骑手',total,'',''],
    ['ic1','当前不合规',bad,'danger','停用 '+urgent+' · 需处理'],
    ['ic2','7 天内到期',d7all,'warning','健康证 '+c.d7+' · 回执单 '+(c.rd7+c.rexpired)],
    ['ic3','30 天内到期',d30all,'warning','本月计划续办'],
    ['ic4','回执单临期',(c.rd7+c.rexpired),'warning','到期即无证上岗'],
    ['ic5','新人待取证',newOnly,'','入职≤30天过渡期'],
    ['ic6','健康证覆盖率',cov.toFixed(1)+'%','',hasCert+' / '+total],
    ['ic7','上岗合规率',rate.toFixed(2)+'%','ok',(total-bad)+' 人合规']
  ];
  document.getElementById('stats').innerHTML=cards.map(function(x){
    return '<div class="sc '+(x[3]||'')+'"><div class="l">'+x[1]+'</div><div class="n">'+x[2]+'</div><div class="sub">'+(x[4]||'&nbsp;')+'</div></div>';
  }).join('');
  document.getElementById('todoBar').innerHTML='<span class="tt">当前筛选待处理 '+todo+' 人</span>'
    +'<span class="tchip red" data-st="expired">已过期停用 '+c.expired+'</span>'
    +'<span class="tchip red" data-st="none">双无 '+c.none+'</span>'
    +'<span class="tchip orange" data-st="d7">健康证7天内 '+c.d7+'</span>'
    +'<span class="tchip orange" data-st="rd7">回执单7天内 '+c.rd7+'</span>'
    +'<span class="tchip red" data-st="rexpired">回执单已过期 '+c.rexpired+'</span>'
    +'<span class="tchip amber" data-st="d30">30天内 '+c.d30+'</span>'
    +'<span class="hint">点击色块直接筛出该批名单</span>';
  Array.prototype.forEach.call(document.querySelectorAll('.tchip[data-st]'),function(el){
    el.onclick=function(){ st.stt=el.getAttribute('data-st'); document.getElementById('fSt').value=st.stt; filter(); };
  });
}

/* 站点风险排行（按筛选结果内待处理人数） */
function renderRank(){
  var m={};
  view.forEach(function(o){
    if(['none','expired','d7','d30','rd7','rexpired'].indexOf(o.st)<0) return;
    var k=o.c+' · '+o.s; if(!m[k]) m[k]=0; m[k]++;
  });
  var arr=Object.keys(m).map(function(k){return [k,m[k]];}).sort(function(a,b){return b[1]-a[1];}).slice(0,10);
  var box=document.getElementById('rankBox');
  if(!arr.length){ box.innerHTML='<h3>站点风险排行</h3><div class="empty" style="padding:16px">当前筛选无待处理人员</div>'; return; }
  var max=arr[0][1]||1;
  box.innerHTML='<h3>站点风险排行 · 按待处理人数（Top 10）</h3>'+arr.map(function(x){
    var pct=Math.round(x[1]/max*100);
    var col=x[1]>=max*0.8?'#c62828':(x[1]>=max*0.5?'#ef6c00':'#ffb74d');
    return '<div class="rrow"><div class="rname" data-site="'+esc(x[0].split(' · ')[1])+'">'+esc(x[0])+'</div>'
      +'<div class="rtrack"><div class="rfill" style="width:'+pct+'%;background:'+col+'"></div></div>'
      +'<div class="rval">'+x[1]+'</div></div>';
  }).join('');
  Array.prototype.forEach.call(box.querySelectorAll('.rname'),function(el){
    el.onclick=function(){ st.site=el.getAttribute('data-site'); document.getElementById('fSite').value=st.site; filter(); };
  });
}

/* 事件 */
['fBig','fReg','fCity','fSite','fSt','fHire'].forEach(function(id){
  document.getElementById(id).addEventListener('change',function(){
    st.big=document.getElementById('fBig').value; st.reg=document.getElementById('fReg').value;
    st.city=document.getElementById('fCity').value; st.site=document.getElementById('fSite').value;
    st.stt=document.getElementById('fSt').value; st.hire=document.getElementById('fHire').value;
    filter();
  });
});
document.getElementById('fQ').addEventListener('input',function(){ st.q=this.value.toLowerCase(); filter(); });
document.getElementById('fPre').addEventListener('change',function(){ st.pre=this.checked; filter(); });
document.getElementById('btnHelp').addEventListener('click',function(){
  alert('数据来源：M:\\下载 下最新「骑手排班明细数据_*.xlsx」+ 最新「_健康证到期监控_*.xlsx」。\n\n'
    +'更新方式：双击本目录的「导入健康证监控表.bat」，脚本会自动找最新两份表并重建数据，然后刷新本页面。');
});
document.getElementById('btnExp').addEventListener('click',function(){
  var head=['大区','区域','城市','站点','骑手ID','姓名','入职日期','健康证到期','剩余天数','回执单到期','回执单剩余','处置'];
  var rows=view.map(function(o){
    return [o.b,o.g,o.c,o.s,o.r,o.n,o.h||'',o.e||'',(o.hd2===null?'':o.hd2),o.x||'',(o.rd===null?'':o.rd),(ST_LABEL[o.st]||o.st)];
  });
  var csv=[head].concat(rows).map(function(r){
    return r.map(function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';}).join(',');
  }).join('\r\n');
  var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='健康证督办名单_'+TODAY+'_'+view.length+'人.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
});
Array.prototype.forEach.call(document.querySelectorAll('th[data-sort]'),function(th){
  th.addEventListener('click',function(){
    var k=th.getAttribute('data-sort');
    st.dir=(st.key===k)?-st.dir:1; st.key=k; sort(); render();
    Array.prototype.forEach.call(document.querySelectorAll('th .sort'),function(s){s.className='sort';});
    var ind=th.querySelector('.sort')||document.createElement('span');
    ind.className='sort '+(st.dir===1?'asc':'desc');
    if(!th.querySelector('.sort')) th.appendChild(ind);
  });
});

filter();
})();
</script>
</body>
