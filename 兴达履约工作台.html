<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>兴达履约安全工作台</title>
<style>
:root{
  --header-h:50px;
  --notify-h:38px;
  --sidebar-open:200px;
  --sidebar-closed:60px;
  --sidebar:#1a2634;
  --sidebar-hover:#243447;
  --sidebar-active:#151f2b;
  --accent:#00bcd4;
  --accent-dark:#00acc1;
  --text:#eceff1;
  --text-muted:#90a4ae;
  --main-bg:#f0f2f5;
  --notify-bg:#fff8e1;
  --notify-text:#f57f17;
  --notify-border:#ffe082;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:"Microsoft YaHei","PingFang SC",sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}

/* 顶部 Header */
.top-header{height:var(--header-h);background:linear-gradient(90deg,#00acc1 0%,#26c6da 100%);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;box-shadow:0 2px 4px rgba(0,0,0,.12)}
.header-left{display:flex;align-items:center;gap:12px}
.hamburger{width:36px;height:36px;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s}
.hamburger:hover{background:rgba(255,255,255,.15)}
.hamburger svg{width:22px;height:22px;fill:#fff}
.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600;letter-spacing:.3px}
.brand-dot{width:28px;height:28px;border-radius:50%;background:#fff;color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.header-right{display:flex;align-items:center;gap:18px;font-size:14px}
.header-right a,.header-right span{color:#fff;text-decoration:none;opacity:.95}
.header-right a:hover{opacity:1;text-decoration:underline}
.user-pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:20px}
.user-avatar{width:24px;height:24px;border-radius:50%;background:#fff;color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}

/* 通知条 */
.notify-bar{height:var(--notify-h);background:var(--notify-bg);border-bottom:1px solid var(--notify-border);color:var(--notify-text);display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:13px;flex-shrink:0}
.notify-left{display:flex;align-items:center;gap:10px}
.notify-left svg{width:18px;height:18px;fill:var(--notify-text)}
.notify-items{display:flex;gap:18px;align-items:center;overflow:hidden;white-space:nowrap}
.notify-items span{cursor:pointer}
.notify-items span:hover{text-decoration:underline}
.notify-right{display:flex;align-items:center;gap:12px}
.notify-right a{color:var(--notify-text);text-decoration:none}
.notify-right a:hover{text-decoration:underline}
.notify-close{width:22px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s}
.notify-close:hover{background:rgba(245,127,23,.12)}
.notify-close svg{width:14px;height:14px;fill:var(--notify-text)}

/* 主体 */
.body-wrap{flex:1;display:flex;overflow:hidden}

/* 侧边栏 */
.sidebar{width:var(--sidebar-open);background:var(--sidebar);color:var(--text);display:flex;flex-direction:column;transition:width .25s ease;flex-shrink:0;overflow:hidden}
.sidebar.collapsed{width:var(--sidebar-closed)}
.sidebar-inner{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 0}
.sidebar-inner::-webkit-scrollbar{width:4px}
.sidebar-inner::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px}

.menu-group{margin-bottom:6px}
.group-title{padding:10px 16px 6px;font-size:12px;color:var(--text-muted);white-space:nowrap;opacity:1;transition:opacity .2s}
.sidebar.collapsed .group-title{opacity:0;height:0;padding:0;overflow:hidden}

.menu-item{display:flex;align-items:center;height:42px;padding:0 16px;cursor:pointer;transition:.15s;position:relative;white-space:nowrap}
.menu-item:hover{background:var(--sidebar-hover)}
.menu-item.active{background:var(--sidebar-active);color:#fff}
.menu-item.active::before{content:"";position:absolute;left:0;top:8;bottom:8;width:3px;background:var(--accent);border-radius:0 2px 2px 0}
.menu-icon{width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:12px;fill:currentColor;opacity:.9}
.sidebar.collapsed .menu-icon{margin-right:0}
.menu-text{font-size:14px;opacity:1;transition:opacity .2s}
.sidebar.collapsed .menu-text{opacity:0;width:0;overflow:hidden}
.menu-badge{margin-left:auto;font-size:11px;background:rgba(255,255,255,.12);padding:1px 6px;border-radius:10px;opacity:1;transition:opacity .2s}
.sidebar.collapsed .menu-badge{opacity:0}

/* tooltip for collapsed */
.menu-item{position:relative}
.sidebar.collapsed .menu-item:hover::after{content:attr(data-title);position:absolute;left:56px;top:50%;transform:translateY(-50%);background:#263238;color:#fff;padding:6px 10px;border-radius:4px;font-size:12px;white-space:nowrap;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3)}

/* 主内容区 */
.main{flex:1;display:flex;flex-direction:column;background:var(--main-bg);overflow:hidden;position:relative}
.breadcrumb{height:40px;background:#fff;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;padding:0 16px;font-size:13px;color:#555;flex-shrink:0}
.breadcrumb a{color:#2196f3;text-decoration:none}
.breadcrumb a:hover{text-decoration:underline}
.breadcrumb .sep{margin:0 6px;color:#bdbdbd}
.content-wrap{flex:1;position:relative;overflow:hidden}
.content-wrap iframe{width:100%;height:100%;border:none;background:#fff}

/* 欢迎页 */
.welcome{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#555;text-align:center}
.welcome.show{display:flex}
.welcome h1{font-size:32px;font-weight:400;color:#37474f;margin-bottom:12px}
.welcome p{font-size:16px;color:#78909c;margin:0}
.welcome .tiles{display:flex;gap:16px;margin-top:32px;flex-wrap:wrap;justify-content:center}
.tile{width:160px;height:100px;background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.2s;border:1px solid #e0e0e0}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.1);border-color:var(--accent)}
.tile svg{width:28px;height:28px;fill:var(--accent);margin-bottom:8px}
.tile span{font-size:14px;color:#455a64}

/* 底部 footer in sidebar */
.sidebar-footer{padding:10px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:var(--text-muted);white-space:nowrap;opacity:1;transition:opacity .2s}
.sidebar.collapsed .sidebar-footer{opacity:0}

/* mobile */
@media(max-width:768px){
  .sidebar{position:absolute;left:0;top:calc(var(--header-h) + var(--notify-h));bottom:0;z-index:99;box-shadow:4px 0 12px rgba(0,0,0,.2)}
  .sidebar.collapsed{left:calc(-1 * var(--sidebar-closed))}
  .overlay{display:none;position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:98}
  .overlay.show{display:block}
}
</style>
</head>

<!-- Header -->
<header class="top-header">

<!-- Body -->
<div class="body-wrap">

    icon: '<path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6.54L17.8 9.7 12 12.94 6.18 9.7 5.12 8.46 12 4.8l6.82 3.74z"/>',
    items: [
      {key:'clothing_main', label:'护航服装看板', file:'./护航服装/护航服装看板.html'},

    ]

const menuContainer = document.getElementById('menuContainer');
function renderMenu(){
  let html = '';
  MENU.forEach((g, gi) => {
    html += '<div class="menu-group">';
    html += '<div class="group-title">' + g.group + '</div>';
    g.items.forEach(item => {
      html += '<div class="menu-item" data-key="' + item.key + '" data-title="' + item.label + '" data-group="' + g.group + '" onclick="loadBoard(\'' + item.key + '\')">';
      html += '<div class="menu-icon"><svg viewBox="0 0 24 24">' + g.icon + '</svg></div>';
      html += '<div class="menu-text">' + item.label + '</div>';
      html += '</div>';
    });
    html += '</div>';
  });
  menuContainer.innerHTML = html;
}

function findItem(key){
  for (const g of MENU) {
    const item = g.items.find(i => i.key === key);
    if (item) return {group: g.group, item: item};
  }
  return null;
}

function loadBoard(key){
  const found = findItem(key);
  if (!found) return;
  const {group, item} = found;

  document.getElementById('welcome').classList.remove('show');
  document.getElementById('mainFrame').style.display = 'block';
  document.getElementById('mainFrame').src = item.file;

  document.getElementById('bcGroup').innerHTML = '<a href="#" onclick="showWelcome();return false;">首页</a> <span class="sep">/</span> ' + group + ' <span class="sep">/</span> ' + item.label;

  document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
  const active = document.querySelector('.menu-item[data-key="' + key + '"]');
  if (active) active.classList.add('active');
}

function showWelcome(){
  document.getElementById('welcome').classList.add('show');
  document.getElementById('mainFrame').style.display = 'none';
  document.getElementById('mainFrame').src = '';
  document.getElementById('bcGroup').textContent = '欢迎使用';
  document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
}

// 侧边栏折叠
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
let collapsed = false;
document.getElementById('toggleSidebar').addEventListener('click', () => {
  collapsed = !collapsed;
  sidebar.classList.toggle('collapsed', collapsed);
  if (window.innerWidth <= 768) {
    overlay.classList.toggle('show', !collapsed);
  }
});
overlay.addEventListener('click', () => {
  collapsed = true;
  sidebar.classList.add('collapsed');
  overlay.classList.remove('show');
});

// 通知条关闭
document.getElementById('closeNotify').addEventListener('click', () => {
  document.getElementById('notifyBar').style.display = 'none';
  document.documentElement.style.setProperty('--notify-h','0px');
});

// 顶部日期
function setDate(){
  const d = new Date();
  const w = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  const s = (d.getMonth()+1) + '月' + d.getDate() + '日 ' + w;
  document.getElementById('todayDate').textContent = s;
}

// 尝试从环境变量/本地存储读取用户名（仅显示）
try {
  const saved = localStorage.getItem('xd_workbench_user');
  if (saved) document.getElementById('userName').textContent = saved;
} catch(e){}

renderMenu();
setDate();
</script>
