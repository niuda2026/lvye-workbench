<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>110 工单实时监控中心</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="110_data.js"></script>
<style>
  :root{
    --bg:#f4f6fb; --panel:#ffffff; --ink:#1f2937; --muted:#6b7280;
    --line:#e5e7eb; --primary:#2563eb; --primary-soft:#eff4ff;
    --red:#ef4444; --amber:#f59e0b; --green:#10b981; --purple:#7c3aed;
    --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .mono{font-family:"SF Mono",Consolas,"Roboto Mono",monospace;font-variant-numeric:tabular-nums}
  .wrap{max-width:1480px;margin:0 auto;padding:18px 22px 60px}

  /* Header */
  header.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px}
  .brand{display:flex;align-items:baseline;gap:12px}
  .brand h1{font-size:22px;font-weight:700;letter-spacing:.5px}
  .brand .src{font-size:12px;color:var(--muted)}
  .brand .src b{color:var(--primary)}
  .hstatus{display:flex;align-items:center;gap:18px;font-size:13px;color:var(--muted)}
  .hstatus .clock{font-size:18px;font-weight:600;color:var(--ink)}
  .hstatus .updated b{color:var(--ink)}
  .pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px;
    box-shadow:0 0 0 0 rgba(16,185,129,.5);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}70%{box-shadow:0 0 0 8px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}

  /* KPI */
  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:18px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi .label{font-size:12px;color:var(--muted);margin-bottom:8px}
  .kpi .val{font-size:28px;font-weight:700;line-height:1}
  .kpi .val small{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px}
  .kpi .bar{position:absolute;left:0;top:0;height:3px;width:100%}
  .kpi.k-total .bar{background:var(--primary)} .kpi.k-total .val{color:var(--primary)}
  .kpi.k-pend .bar{background:var(--red)} .kpi.k-pend .val{color:var(--red)}
  .kpi.k-proc .bar{background:var(--amber)} .kpi.k-proc .val{color:var(--amber)}
  .kpi.k-done .bar{background:var(--green)} .kpi.k-done .val{color:var(--green)}
  .kpi.k-new .bar{background:var(--purple)} .kpi.k-new .val{color:var(--purple)}
  .kpi.k-city .bar{background:#0ea5e9} .kpi.k-city .val{color:#0ea5e9}

  /* Layout grid */
  .grid{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;margin-bottom:16px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px}
  .panel h3{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .panel h3 .dot{width:6px;height:6px;border-radius:50%;background:var(--primary)}
  .panel h3 .sub{font-size:11px;color:var(--muted);font-weight:400;margin-left:auto}

  .chart-box{position:relative;height:300px}
  .chart-box.sm{height:240px}

  /* City table */
  .city-table{width:100%;border-collapse:collapse;font-size:13px}
  .city-table th,.city-table td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  .city-table th{font-size:12px;color:var(--muted);font-weight:600;cursor:pointer;user-select:none}
  .city-table th:hover{color:var(--primary)}
  .city-table td.num{text-align:right;font-family:"SF Mono",Consolas,monospace}
  .city-table tbody tr:hover{background:var(--primary-soft)}
  .rank{display:inline-flex;width:22px;height:22px;border-radius:6px;background:#eef2ff;color:var(--primary);
    font-size:12px;font-weight:700;align-items:center;justify-content:center}
  .rank.top{background:var(--primary);color:#fff}
  .pctbar{position:relative;height:8px;background:#eef2f7;border-radius:5px;width:90px;display:inline-block;vertical-align:middle;overflow:hidden}
  .pctbar>span{position:absolute;left:0;top:0;height:100%;border-radius:5px;background:linear-gradient(90deg,#60a5fa,#2563eb)}

  /* badge */
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;line-height:1.6}
  .b-pend{background:#fee2e2;color:#b91c1c} .b-proc{background:#fef3c7;color:#b45309} .b-done{background:#d1fae5;color:#047857}
  .b-red{background:#fee2e2;color:#b91c1c} .b-orange{background:#ffedd5;color:#c2410c}
  .b-yellow{background:#fef9c3;color:#a16207} .b-blue{background:#dbeafe;color:#1d4ed8}

  /* Latest + recent */
  .latest{list-style:none;max-height:300px;overflow:auto}
  .latest li{padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
  .latest li:last-child{border-bottom:none}
  .latest .ln{display:flex;justify-content:space-between;gap:10px}
  .latest .city{font-weight:600} .latest .t{color:var(--muted);font-size:12px}
  .latest .meta{color:var(--muted);font-size:12px;margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}

  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .filters input,.filters select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;outline:none}
  .filters input:focus,.filters select:focus{border-color:var(--primary)}
  .filters .grow{flex:1;min-width:180px}
  table.recent{width:100%;border-collapse:collapse;font-size:13px}
  table.recent th,table.recent td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  table.recent th{font-size:12px;color:var(--muted);font-weight:600;cursor:pointer;position:sticky;top:0;background:#fff}
  table.recent tbody tr:hover{background:var(--primary-soft)}
  .note{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}
  .empty{padding:30px;text-align:center;color:var(--muted)}

  @media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}
  @media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>110 工单实时监控中心</h1>
      <span class="src">数据源：<b>fxgl365.com</b> 公司风险管理系统 · 事件处理</span>
    </div>
    <div class="hstatus">
      <div><span class="pulse"></span>实时监控</div>
      <div class="clock mono" id="clock">--:--:--</div>
      <div class="updated">数据更新于 <b id="updated">--</b> <span id="age"></span></div>
    </div>
  </header>

  <!-- KPI -->
  <section class="kpis" id="kpis"></section>

  <!-- Charts row -->
  <section class="grid">
    <div class="panel">
      <h3><span class="dot"></span>城市工单分布 TOP10<span class="sub">按工单总量</span></h3>
      <div class="chart-box"><canvas id="cityChart"></canvas></div>
    </div>
    <div class="panel">
      <h3><span class="dot"></span>工单状态分布<span class="sub">待处理 / 处理中 / 完成</span></h3>
      <div class="chart-box"><canvas id="statusChart"></canvas></div>
    </div>
  </section>

  <section class="grid">
    <div class="panel">
      <h3><span class="dot"></span>近 30 天上报趋势<span class="sub">按创建日期</span></h3>
      <div class="chart-box sm"><canvas id="trendChart"></canvas></div>
    </div>
    <div class="panel">
      <h3><span class="dot"></span>事件类型 TOP10<span class="sub">按工单量</span></h3>
      <div class="chart-box sm"><canvas id="typeChart"></canvas></div>
    </div>
  </section>

  <!-- City monitor table -->
  <section class="panel" style="margin-bottom:16px">
    <h3><span class="dot"></span>城市实时监控表<span class="sub" id="citySub"></span></h3>
    <div style="overflow:auto;max-height:420px">
      <table class="city-table" id="cityTable">
        <thead><tr>
          <th data-k="rank">#</th><th data-k="name">城市</th>
          <th data-k="count" class="num">工单总数</th>
          <th data-k="pending" class="num">待处理</th>
          <th data-k="processing" class="num">处理中</th>
          <th data-k="done" class="num">完成</th>
          <th data-k="count">占比</th>
        </tr></thead>
        <tbody id="cityBody"></tbody>
      </table>
    </div>
  </section>

  <!-- Latest -->
  <section class="grid">
    <div class="panel">
      <h3><span class="dot"></span>最新工单<span class="sub">最近 20 条</span></h3>
      <ul class="latest" id="latestList"></ul>
    </div>
    <div class="panel">
      <h3><span class="dot"></span>事件处理明细<span class="sub" id="recentSub"></span></h3>
      <div class="filters">
        <input class="grow" id="fSearch" placeholder="搜索 编号 / 城市 / 类型 / 处理人">
        <select id="fStatus">
          <option value="">全部状态</option>
          <option value="待处理">待处理</option>
          <option value="处理中">处理中</option>
          <option value="处理完成">处理完成</option>
        </select>
        <select id="fLevel">
          <option value="">全部等级</option>
          <option value="红色">红色</option>
          <option value="橙色">橙色</option>
          <option value="黄色">黄色</option>
          <option value="蓝色">蓝色</option>
        </select>
      </div>
      <div style="overflow:auto;max-height:360px">
        <table class="recent" id="recentTable">
          <thead><tr>
            <th>编号</th><th>城市</th><th>类型</th><th>等级</th>
            <th>状态</th><th>上报时间</th><th>处理人</th>
          </tr></thead>
          <tbody id="recentBody"></tbody>
        </table>
      </div>
      <div class="note" id="dataNote"></div>
    </div>
  </section>
</div>

<script>
let rawData = null;
let charts = {};
let citySort = {k:'count', dir:-1};

function fmt(n){ return (n||0).toLocaleString('zh-CN'); }
function statusBadge(s){
  if(s==='待处理') return '<span class="badge b-pend">待处理</span>';
  if(s==='处理中') return '<span class="badge b-proc">处理中</span>';
  return '<span class="badge b-done">处理完成</span>';
}
function levelBadge(l){
  const m={'红色':'b-red','橙色':'b-orange','黄色':'b-yellow','蓝色':'b-blue'};
  return '<span class="badge '+(m[l]||'b-blue')+'">'+l+'</span>';
}

function renderHeader(){
  document.getElementById('updated').textContent = rawData.lastUpdated || '--';
  const note = rawData.meta && rawData.meta.statusNote ? rawData.meta.statusNote : '';
  document.getElementById('dataNote').textContent = '说明：' + note + ' ｜ 数据由 fetch_110_cdp.py 经 CDP 在登录态页面内抓取，运行「一键刷新110工单数据.bat」可更新。';
}

function renderKPI(){
  const k = rawData.kpi || {};
  const cards = [
    {c:'k-total', label:'工单总量', val:fmt(k.total)},
    {c:'k-pend', label:'待处理', val:fmt(k.pending)},
    {c:'k-proc', label:'处理中', val:fmt(k.processing)},
    {c:'k-done', label:'处理完成', val:fmt(k.done)},
    {c:'k-new', label:'今日新增', val:fmt(k.todayNew)},
    {c:'k-city', label:'覆盖城市', val:fmt(k.cityCount)},
  ];
  document.getElementById('kpis').innerHTML = cards.map(c=>
    `<div class="kpi ${c.c}"><div class="bar"></div><div class="label">${c.label}</div>
     <div class="val mono">${c.val}</div></div>`).join('');
}

function destroyCharts(){ for(const k in charts){ if(charts[k]){ charts[k].destroy(); } } charts={}; }

function renderCharts(){
  destroyCharts();
  // 城市 TOP10
  const cities = (rawData.cityStats||[]).slice(0,10).reverse();
  charts.city = new Chart(document.getElementById('cityChart'),{
    type:'bar',
    data:{ labels:cities.map(c=>c.name),
      datasets:[{label:'工单量',data:cities.map(c=>c.count),
        backgroundColor:'#2563eb',borderRadius:5}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{x:{ticks:{precision:0},grid:{color:'#f1f5f9'}},y:{grid:{display:false}}}}
  });
  // 状态分布 环形
  const sd = rawData.statusDist||[];
  const colorMap={'待处理':'#ef4444','处理中':'#f59e0b','处理完成':'#10b981'};
  charts.status = new Chart(document.getElementById('statusChart'),{
    type:'doughnut',
    data:{labels:sd.map(s=>s.name),
      datasets:[{data:sd.map(s=>s.value),
        backgroundColor:sd.map(s=>colorMap[s.name]||'#94a3b8'),borderWidth:2,borderColor:'#fff'}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'62%',
      plugins:{legend:{position:'bottom',labels:{boxWidth:12,padding:14}}}}
  });
  // 趋势
  const tr = rawData.trend||[];
  charts.trend = new Chart(document.getElementById('trendChart'),{
    type:'line',
    data:{labels:tr.map(t=>t.date.slice(5)),
      datasets:[{label:'上报量',data:tr.map(t=>t.count),
        borderColor:'#2563eb',backgroundColor:'rgba(37,99,235,.12)',fill:true,
        tension:.3,pointRadius:2,borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{x:{ticks:{maxTicksLimit:12},grid:{display:false}},y:{ticks:{precision:0},grid:{color:'#f1f5f9'}}}}
  });
  // 类型 TOP10
  const td = (rawData.typeDist||[]).slice(0,10).reverse();
  charts.type = new Chart(document.getElementById('typeChart'),{
    type:'bar',
    data:{labels:td.map(t=>t.name),
      datasets:[{label:'工单量',data:td.map(t=>t.value),
        backgroundColor:'#7c3aed',borderRadius:5}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{x:{ticks:{precision:0},grid:{color:'#f1f5f9'}},y:{grid:{display:false}}}}
  });
}

function renderCity(){
  let rows = (rawData.cityStats||[]).slice();
  const total = (rawData.kpi&&rawData.kpi.total)||1;
  rows.sort((a,b)=> (a[citySort.k]>=b[citySort.k]?1:-1)*citySort.dir);
  const max = Math.max(...rows.map(r=>r.count),1);
  document.getElementById('citySub').textContent = `共 ${rows.length} 个城市`;
  document.getElementById('cityBody').innerHTML = rows.map((r,i)=>{
    const pct = (r.count/total*100).toFixed(1);
    return `<tr>
      <td><span class="rank ${i<3?'top':''}">${i+1}</span></td>
      <td>${r.name}</td>
      <td class="num mono">${fmt(r.count)}</td>
      <td class="num mono" style="color:var(--red)">${fmt(r.pending)}</td>
      <td class="num mono" style="color:var(--amber)">${fmt(r.processing)}</td>
      <td class="num mono" style="color:var(--green)">${fmt(r.done)}</td>
      <td><span class="pctbar"><span style="width:${(r.count/max*100).toFixed(1)}%"></span></span> ${pct}%</td>
    </tr>`;
  }).join('') || '<tr><td colspan="7" class="empty">暂无数据</td></tr>';
}

function renderLatest(){
  const ls = rawData.latest||[];
  document.getElementById('latestList').innerHTML = ls.map(o=>
    `<li><div class="ln"><span class="city">${o.city}</span><span class="t mono">${o.reportTime||''}</span></div>
     <div class="meta"><span>${o.type||''}</span>${levelBadge(o.level)} ${statusBadge(o.status)}
     <span>编号 ${o.eventNo||''}</span></div></li>`).join('')
    || '<li class="empty">暂无数据</li>';
}

function renderRecent(){
  const all = rawData.recent||[];
  const kw = (document.getElementById('fSearch').value||'').trim().toLowerCase();
  const fs = document.getElementById('fStatus').value;
  const fl = document.getElementById('fLevel').value;
  let rows = all.filter(o=>{
    if(fs && o.status!==fs) return false;
    if(fl && o.level!==fl) return false;
    if(kw){ const s=(o.id+' '+(o.city||'')+' '+(o.type||'')+' '+(o.handler||'')).toLowerCase(); if(!s.includes(kw)) return false; }
    return true;
  });
  document.getElementById('recentSub').textContent = `匹配 ${rows.length} / ${all.length} 条`;
  document.getElementById('recentBody').innerHTML = rows.slice(0,200).map(o=>
    `<tr><td class="mono">${o.id||''}</td><td>${o.city||''}</td><td>${o.type||''}</td>
     <td>${levelBadge(o.level)}</td><td>${statusBadge(o.status)}</td>
     <td class="mono">${o.reportTime||''}</td><td>${o.handler||'-'}</td></tr>`).join('')
    || '<tr><td colspan="7" class="empty">无匹配记录</td></tr>';
}

function bindUI(){
  document.querySelectorAll('#cityTable th[data-k]').forEach(th=>{
    th.onclick=()=>{ const k=th.dataset.k; if(citySort.k===k) citySort.dir*=-1; else {citySort.k=k; citySort.dir=-1;} renderCity(); };
  });
  ['fSearch','fStatus','fLevel'].forEach(id=>{
    document.getElementById(id).addEventListener('input',renderRecent);
    document.getElementById(id).addEventListener('change',renderRecent);
  });
}

function tickClock(){
  const d=new Date();
  const p=n=>String(n).padStart(2,'0');
  document.getElementById('clock').textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  if(rawData && rawData.lastUpdated){
    const up = new Date(rawData.lastUpdated.replace(/-/g,'/')).getTime();
    const mins = Math.max(0, Math.floor((Date.now()-up)/60000));
    document.getElementById('age').textContent = mins>0 ? `（${mins} 分钟前）` : '（刚刚）';
  }
}

function renderAll(){
  renderHeader(); renderKPI(); renderCharts(); renderCity(); renderLatest(); renderRecent();
}

(async function init(){
  if(typeof EMBEDDED_DATA==='undefined'){
    document.getElementById('kpis').innerHTML='<div class="empty">未能加载 110_data.js，请确认文件在同目录</div>';
    return;
  }
  rawData = EMBEDDED_DATA;
  bindUI();
  renderAll();
  tickClock(); setInterval(tickClock,1000);
  // 自动刷新：公网 http 环境下每 60s 重新拉取数据文件
  setInterval(async ()=>{
    try{
      const r = await fetch('110_data.js?t='+Date.now(),{cache:'no-store'});
      if(!r.ok) return;
      const txt = await r.text();
      const m = txt.match(/const EMBEDDED_DATA\s*=\s*(\{[\s\S]*\});/);
      if(!m) return;
      const nd = JSON.parse(m[1]);
      if(nd.lastUpdated!==rawData.lastUpdated){
        rawData = nd; renderAll();
      }
    }catch(e){ /* file:// 下静默失败 */ }
  },60000);
})();
</script>
</body>
</html>
