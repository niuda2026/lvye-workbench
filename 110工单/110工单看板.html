<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>110工单实时看板</title>
<style>
/* ---------- 基础 ---------- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f4f6fa;
  --surface: #ffffff;
  --text-primary: #1e293b;
  --text-secondary: #64748b;
  --text-muted: #94a3b8;
  --border: #e2e8f0;
  --blue-500: #0B4F8A;
  --blue-50: #eff6ff;
  --blue-600: #0B4F8A;
  --amber-500: #f59e0b;
  --amber-50: #fffbeb;
  --red-500: #ef4444;
  --red-50: #fef2f2;
  --orange-500: #f97316;
  --purple-500: #8b5cf6;
  --green-500: #10b981;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,.07), 0 2px 4px -2px rgba(0,0,0,.05);
  --shadow-lg: 0 10px 25px -3px rgba(0,0,0,.1), 0 4px 6px -4px rgba(0,0,0,.05);
  --radius: 10px;
  --radius-sm: 6px;
  --transition: 150ms ease;
  --sidebar-w: 220px;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.app { display: flex; min-height: 100vh; }

/* ---------- 侧边栏 ---------- */
.sidebar {
  width: var(--sidebar-w);
  background: #fff;
  border-right: 1px solid var(--border);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  position: fixed;
  inset: 0 auto 0 0;
  z-index: 100;
}
.brand {
  padding: 18px 20px;
  font-size: .9375rem;
  font-weight: 700;
  color: var(--text-primary);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand::before {
  content: '';
  width: 28px; height: 28px;
  background: var(--blue-500);
  border-radius: 6px;
  display: inline-block;
}
.brand::after {
  content: '110';
  position: absolute;
  left: 26px; top: 21px;
  color: #fff;
  font-size: .625rem;
  font-weight: 800;
}
nav { padding: 12px 0; flex: 1; overflow-y: auto; }
.nav-group { margin-bottom: 16px; }
.nav-group-title {
  padding: 8px 20px;
  font-size: .6875rem;
  color: var(--text-muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .04em;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px 10px 20px;
  margin: 0 12px;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: .8125rem;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition);
}
.nav-item:hover { background: #f8fafc; color: var(--text-primary); }
.nav-item.active { background: var(--blue-50); color: var(--blue-600); font-weight: 600; }
.nav-item .icon { font-size: 1rem; width: 20px; text-align: center; }

/* ---------- 主内容区 ---------- */
.main-content {
  flex: 1;
  margin-left: var(--sidebar-w);
  padding: 24px 28px 40px;
  max-width: calc(100% - var(--sidebar-w));
}

/* Header */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}
.header-left h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }
.header-left p { font-size: .8125rem; color: var(--text-muted); margin-top: 2px; }
.header-right { display: flex; align-items: center; gap: 12px; }
.last-updated { font-size: .75rem; color: var(--text-muted); }
.btn-refresh {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text-primary);
  font-size: .8125rem; font-weight: 500;
  cursor: pointer;
  transition: all var(--transition);
  box-shadow: var(--shadow-sm);
}
.btn-refresh:hover { background: var(--blue-50); border-color: var(--blue-500); color: var(--blue-600); }
.btn-refresh:active { transform: scale(.97); }
@keyframes spin { to { transform: rotate(360deg); } }
.btn-refresh.loading .icon { animation: spin .8s linear infinite; }

/* Stat Cards */
.stat-cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 18px 20px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow var(--transition), transform var(--transition);
  cursor: default;
  position: relative;
  overflow: hidden;
}
.stat-card::before {
  content: ''; position: absolute; left: 0; top: 10px; bottom: 10px;
  width: 3px; border-radius: 0 3px 3px 0;
}
.stat-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.stat-card .label { font-size: .75rem; color: var(--text-secondary); font-weight: 500; margin-bottom: 6px; }
.stat-card .value { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
.stat-card.total::before { background: var(--text-muted); } .stat-card.total .value { color: #64748b; }
.stat-card.pending::before { background: var(--red-500); } .stat-card.pending { background: var(--red-50); } .stat-card.pending .value { color: var(--red-500); }
.stat-card.processing::before { background: var(--blue-500); } .stat-card.processing { background: var(--blue-50); } .stat-card.processing .value { color: var(--blue-500); }
.stat-card.review::before { background: var(--amber-500); } .stat-card.review { background: var(--amber-50); } .stat-card.review .value { color: #d97706; }
.stat-card.clue::before { background: var(--purple-500); } .stat-card.clue { background: #f5f3ff; } .stat-card.clue .value { color: var(--purple-500); }
.stat-card.done::before { background: var(--green-500); } .stat-card.done { background: #f0fdf4; } .stat-card.done .value { color: var(--green-500); }

/* Primary Tabs */
.primary-tabs {
  display: flex; gap: 0;
  margin-bottom: 20px;
  background: var(--surface);
  border-radius: var(--radius);
  padding: 4px;
  box-shadow: var(--shadow-sm);
  width: fit-content;
}
.primary-tab {
  padding: 10px 24px;
  border: none;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-secondary);
  font-size: .875rem; font-weight: 500;
  cursor: pointer;
  transition: all var(--transition);
}
.primary-tab.active { background: var(--blue-500); color: #fff; box-shadow: var(--shadow-sm); }
.primary-tab:hover:not(.active) { color: var(--text-primary); }

/* Filter bar */
.filter-bar {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 16px 20px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 20px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.filter-item { display: flex; flex-direction: column; gap: 6px; }
.filter-item label { font-size: .75rem; color: var(--text-secondary); font-weight: 500; }
.filter-item input, .filter-item select {
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: .8125rem;
  color: var(--text-primary);
  background: #fff;
}
.filter-actions {
  grid-column: 1 / -1;
  display: flex; justify-content: flex-end; gap: 10px;
}
.btn-link {
  background: transparent; border: none;
  color: var(--blue-500); font-size: .8125rem; font-weight: 500; cursor: pointer;
}
.btn {
  padding: 7px 14px; border-radius: var(--radius-sm); font-size: .8125rem; font-weight: 500; cursor: pointer;
  border: 1px solid var(--border); background: #fff; color: var(--text-primary);
}
.btn.primary { background: var(--blue-500); border-color: var(--blue-500); color: #fff; }
.btn.export { background: var(--amber-500); border-color: var(--amber-500); color: #fff; }

/* Charts */
.charts-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 24px;
}
.chart-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 20px 24px;
  box-shadow: var(--shadow-sm);
}
.chart-card h3 { font-size: .875rem; font-weight: 600; margin-bottom: 12px; }
.chart-wrap { position: relative; width: 100%; }
.chart-wrap.doughnut { max-width: 240px; margin: 0 auto; }

/* Table */
.table-card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.table-card .table-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
}
.table-card .table-header .info { font-size: .8125rem; color: var(--text-secondary); }
.table-card .table-header .info strong { color: var(--text-primary); }
.page-size-select {
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: .75rem; color: var(--text-primary); background: var(--surface);
  cursor: pointer;
}
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .8125rem; }
th {
  padding: 12px 14px; text-align: left; font-weight: 600;
  color: var(--text-secondary); background: #f8fafc;
  border-bottom: 1px solid var(--border);
  white-space: nowrap; font-size: .75rem;
  text-transform: uppercase; letter-spacing: .03em;
  user-select: none;
}
th.sortable { cursor: pointer; } th.sortable:hover { color: var(--blue-500); }
td {
  padding: 11px 14px;
  border-bottom: 1px solid #f1f5f9;
  color: var(--text-primary);
  white-space: nowrap;
}
tr:hover td { background: #f8fafc; }
td.id a { color: var(--blue-500); text-decoration: none; font-weight: 500; cursor: pointer; }
td.id a:hover { text-decoration: underline; }
td.status .tag {
  display: inline-block; padding: 2px 10px; border-radius: 10px;
  font-size: .6875rem; font-weight: 600;
}
td.status .tag.pending { background: #fef2f2; color: #dc2626; }
td.status .tag.processing { background: #eff6ff; color: #0B4F8A; }
td.status .tag.closed { background: #f0fdf4; color: #16a34a; }
td.summary { max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
td .overdue-tag { color: var(--red-500); font-size: .6875rem; font-weight: 600; }
.btn-detail {
  padding: 4px 12px; border: 1px solid var(--blue-500); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--blue-500); font-size: .75rem; font-weight: 500;
  cursor: pointer; transition: all var(--transition);
}
.btn-detail:hover { background: var(--blue-500); color: #fff; }

/* Pagination */
.pagination {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 14px 24px; border-top: 1px solid var(--border);
}
.pagination button {
  min-width: 32px; height: 32px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--text-primary); font-size: .75rem;
  cursor: pointer; transition: all var(--transition);
}
.pagination button:hover:not(:disabled) { border-color: var(--blue-500); color: var(--blue-500); }
.pagination button.active { background: var(--blue-500); border-color: var(--blue-500); color: #fff; font-weight: 600; }
.pagination button:disabled { opacity: .4; cursor: not-allowed; }

/* Modal */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(15, 23, 42, .45); z-index: 1000;
  align-items: center; justify-content: center;
  backdrop-filter: blur(2px);
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--surface); border-radius: var(--radius);
  box-shadow: var(--shadow-lg); width: 1100px; max-width: 96vw; max-height: 90vh;
  display: flex; flex-direction: column; overflow: hidden;
  animation: modalIn .2s ease-out;
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(.96) translateY(10px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.modal-header .title-area { display: flex; align-items: center; gap: 12px; }
.modal-header .event-id { font-size: 1rem; font-weight: 700; }
.modal-header .level-tag {
  padding: 2px 10px; border-radius: 10px; font-size: .6875rem; font-weight: 600;
  background: var(--blue-50); color: var(--blue-500);
}
.modal-header .status-tag {
  padding: 2px 10px; border-radius: 10px; font-size: .6875rem; font-weight: 600;
}
.modal-header .status-tag.pending { background: #fef2f2; color: #dc2626; }
.modal-header .status-tag.processing { background: #eff6ff; color: #0B4F8A; }
.modal-header .status-tag.closed { background: #f0fdf4; color: #16a34a; }
.modal-close {
  width: 32px; height: 32px; border: none; background: transparent;
  color: var(--text-muted); font-size: 1.2rem; cursor: pointer; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: #f1f5f9; color: var(--text-primary); }

/* Modal top: timeline + actions */
.modal-top {
  padding: 14px 20px; border-bottom: 1px solid var(--border);
  background: #fff;
}
.timeline {
  display: flex; align-items: center; justify-content: space-between;
  position: relative; margin-bottom: 16px;
}
.timeline::before {
  content: ''; position: absolute; top: 14px; left: 0; right: 0; height: 2px;
  background: var(--border); z-index: 0;
}
.timeline-step {
  position: relative; z-index: 1; text-align: center;
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.timeline-dot {
  width: 28px; height: 28px; border-radius: 50%; background: #fff;
  border: 2px solid var(--border); display: flex; align-items: center; justify-content: center;
  font-size: .75rem; color: var(--text-muted);
}
.timeline-step.done .timeline-dot { border-color: var(--green-500); color: var(--green-500); background: #f0fdf4; }
.timeline-step.active .timeline-dot { border-color: var(--blue-500); color: var(--blue-500); background: var(--blue-50); }
.timeline-step span { font-size: .75rem; color: var(--text-secondary); }
.timeline-step.done span { color: var(--green-500); font-weight: 600; }
.timeline-step.active span { color: var(--blue-500); font-weight: 600; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
.modal-actions button {
  padding: 6px 14px; border-radius: var(--radius-sm); font-size: .75rem; font-weight: 500; cursor: pointer;
  border: 1px solid var(--border); background: #fff; color: var(--text-primary);
}
.modal-actions button.primary { background: var(--blue-500); border-color: var(--blue-500); color: #fff; }
.modal-actions button.danger { color: var(--red-500); border-color: var(--red-500); }

/* Modal body split */
.modal-body-layout {
  display: flex; flex: 1; min-height: 0;
}
.modal-tabs {
  display: flex; border-bottom: 1px solid var(--border); padding: 0 20px;
  flex-shrink: 0; overflow-x: auto;
}
.modal-tab {
  padding: 12px 16px; border: none; background: transparent;
  color: var(--text-secondary); font-size: .8125rem; font-weight: 500;
  cursor: pointer; position: relative; white-space: nowrap;
}
.modal-tab:hover { color: var(--text-primary); }
.modal-tab.active { color: var(--blue-500); font-weight: 600; }
.modal-tab.active::after {
  content: ''; position: absolute; bottom: -1px; left: 8px; right: 8px; height: 2px;
  background: var(--blue-500); border-radius: 1px;
}
.modal-body {
  flex: 1; overflow-y: auto; padding: 20px;
  min-width: 0;
}
.modal-body .tab-content { display: none; }
.modal-body .tab-content.active { display: block; }
.modal-sidebar {
  width: 260px; border-left: 1px solid var(--border); padding: 16px;
  overflow-y: auto; background: #fafbfc; flex-shrink: 0;
}
.sidebar-section { margin-bottom: 18px; }
.sidebar-section h5 {
  font-size: .75rem; color: var(--text-secondary); font-weight: 600; margin-bottom: 10px;
  display: flex; align-items: center; justify-content: space-between;
}
.sidebar-section h5 .count { font-size: .6875rem; color: var(--text-muted); }
.person-item {
  display: flex; align-items: center; gap: 8px; padding: 6px 0;
  font-size: .8125rem;
}
.person-avatar {
  width: 26px; height: 26px; border-radius: 50%; background: var(--blue-500);
  color: #fff; font-size: .6875rem; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.person-name { color: var(--text-primary); font-weight: 500; }
.person-org { font-size: .6875rem; color: var(--text-muted); margin-left: 34px; }
.time-info { font-size: .75rem; color: var(--text-secondary); }
.time-info div { margin-bottom: 6px; }

/* Detail sections */
.detail-section { margin-bottom: 20px; }
.detail-section:last-child { margin-bottom: 0; }
.detail-section h4 {
  font-size: .8125rem; font-weight: 600; color: var(--text-primary);
  margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
}
.detail-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px 20px;
}
.detail-grid.triple { grid-template-columns: 1fr 1fr 1fr; }
.detail-item { display: flex; gap: 8px; font-size: .8125rem; padding: 4px 0; }
.detail-item .key { color: var(--text-muted); white-space: nowrap; flex-shrink: 0; min-width: 100px; }
.detail-item .key::after { content: '：'; }
.detail-item .val { color: var(--text-primary); word-break: break-all; }
.detail-item.full { grid-column: 1 / -1; }
.detail-item.full .val { line-height: 1.7; }

/* Progress supplement */
.supplement-item {
  border-left: 2px solid var(--blue-500); padding-left: 12px; margin-bottom: 16px;
}
.supplement-meta { font-size: .75rem; color: var(--text-muted); margin-bottom: 4px; }
.supplement-content { font-size: .8125rem; color: var(--text-primary); line-height: 1.6; }

/* Elephant chat */
.chat-item { display: flex; gap: 10px; margin-bottom: 14px; }
.chat-avatar {
  width: 32px; height: 32px; border-radius: 50%; background: #e2e8f0;
  display: flex; align-items: center; justify-content: center; font-size: .75rem; flex-shrink: 0;
}
.chat-body { flex: 1; }
.chat-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.chat-name { font-size: .8125rem; font-weight: 600; }
.chat-time { font-size: .6875rem; color: var(--text-muted); }
.chat-text { font-size: .8125rem; color: var(--text-primary); line-height: 1.5; background: #f8fafc; padding: 8px 10px; border-radius: var(--radius-sm); }

/* Log table */
.log-table { width: 100%; font-size: .8125rem; border-collapse: collapse; }
.log-table th { padding: 8px 12px; text-align: left; background: #f8fafc; font-size: .75rem; color: var(--text-secondary); border-bottom: 1px solid var(--border); }
.log-table td { padding: 8px 12px; border-bottom: 1px solid #f1f5f9; font-size: .75rem; }

/* Empty state */
.empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
.empty-state .icon { font-size: 2rem; margin-bottom: 8px; }
.empty-state p { font-size: .8125rem; }

/* Toast */
.toast {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
  background: #1e293b; color: #fff; padding: 10px 24px; border-radius: 20px;
  font-size: .8125rem; font-weight: 500; z-index: 2000;
  pointer-events: none; opacity: 0; transition: opacity .3s;
}
.toast.show { opacity: 1; }

/* City dashboard */
.city-kpi { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
.city-layout { display: grid; grid-template-columns: 1fr 1.2fr; gap: 20px; }
.city-left, .city-right { display: flex; flex-direction: column; gap: 20px; }
.city-chart-card { flex: 1; min-height: 280px; }
.city-bar { height: 380px; }
.city-table-card { flex: 1; }
.rank { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: #f1f5f9; color: var(--text-secondary); font-size: .75rem; font-weight: 700; }
.rank.top { background: var(--blue-500); color: #fff; }

/* Responsive */
@media (max-width: 1100px) {
  .stat-cards { grid-template-columns: repeat(2, 1fr); }
  .charts-grid { grid-template-columns: 1fr; }
  .filter-bar { grid-template-columns: repeat(2, 1fr); }
  .modal { width: 98vw; }
}
@media (max-width: 680px) {
  .sidebar { display: none; }
  .main-content { margin-left: 0; max-width: 100%; }
  .stat-cards { grid-template-columns: repeat(2, 1fr); }
  .filter-bar { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">公司风险管理系统 · 110工单</div>
    <nav>
      <div class="nav-group">
        <div class="nav-group-title">风险事件</div>
        <div class="nav-item" data-module="city"><span class="icon">&#127759;</span>城市监控</div>
        <div class="nav-item" data-module="report"><span class="icon">+</span>事件上报</div>
        <div class="nav-item" data-module="process"><span class="icon">&#128203;</span>事件处理</div>
      </div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

<script>
// ==================== DATA LAYER ====================
let rawData = null;
let currentModule = 'city';
let currentProcessView = 'pending';
let currentClueView = 'pending';
let currentProcessPage = 1;
let currentCluePage = 1;
let processPageSize = 10;
let cluePageSize = 10;
let chartInstances = {};

const PROCESS_VIEW_KEYS = ['pending', 'history', 'notify', 'shared', 'qaFail'];
const PROCESS_VIEW_NAMES = { pending: '待我处理', history: '处理历史', notify: '通知我的', shared: '我共同处理的', qaFail: '质检不通过' };
const CLUE_VIEW_KEYS = ['pending', 'history', 'notify'];
const CLUE_VIEW_NAMES = { pending: '待我核实', history: '核实历史', notify: '通知我的' };
const STATUS_TAGS = { '待处理': 'pending', '处理中': 'processing', '关单待审核': 'closed', '已关闭': 'closed', '未审核': 'pending', '已核实': 'closed' };

function loadData() {
  rawData = EMBEDDED_DATA;
  return true;
}

function getProcessOrders(viewKey) {
  if (!rawData || !rawData.orders) return [];
  if (viewKey === 'pending') return rawData.orders.slice(0, 5);
  if (viewKey === 'history') return rawData.orders.slice(0, 3);
  return rawData.orders;
}
function getClueOrders(viewKey) {
  if (!rawData || !rawData.clues) return [];
  if (viewKey === 'pending') return rawData.clues.filter(c => c.status === '未审核');
  if (viewKey === 'history') return rawData.clues.filter(c => c.status !== '未审核');
  return rawData.clues;
}

// ==================== NAV ====================
document.querySelectorAll('.nav-item').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    el.classList.add('active');
    const mod = el.dataset.module;
    currentModule = mod;
    document.getElementById('cityModule').style.display = mod === 'city' ? '' : 'none';
    document.getElementById('processModule').style.display = mod === 'process' ? '' : 'none';
    document.getElementById('clueModule').style.display = mod === 'clue' ? '' : 'none';
    if (mod === 'report') {
      document.getElementById('cityModule').style.display = 'none';
      document.getElementById('processModule').style.display = 'none';
      document.getElementById('clueModule').style.display = 'none';
      document.getElementById('pageTitle').textContent = '事件上报';
      document.getElementById('pageSubTitle').textContent = '风险事件录入 — fxgl365.com';
      if (!document.getElementById('reportPlaceholder')) {
        document.getElementById('processModule').insertAdjacentHTML('afterend', '<div id="reportPlaceholder" class="table-card"><div class="empty-state"><div class="icon">+</div><p>事件上报模块需对接 fxgl365.com 创建接口，当前为占位</p></div></div>');
      }
    } else {
      const rp = document.getElementById('reportPlaceholder');
      if (rp) rp.remove();
    }
    if (mod === 'city') {
      document.getElementById('pageTitle').textContent = '城市监控';
      document.getElementById('pageSubTitle').textContent = '全国城市工单实时态势 — fxgl365.com';
      renderCityModule();
    }
    if (mod === 'process') {
      document.getElementById('pageTitle').textContent = '事件处理';
      document.getElementById('pageSubTitle').textContent = '事件处理 &amp; 状态跟进 — fxgl365.com';
      renderProcessModule();
    }
    if (mod === 'clue') {
      document.getElementById('pageTitle').textContent = '线索核实';
      document.getElementById('pageSubTitle').textContent = '风险线索核查 — fxgl365.com';
      renderClueModule();
    }
  });
});

// ==================== RENDER PROCESS ====================
function renderProcessModule() {
  renderProcessStats();
  renderProcessTabs();
  renderProcessTable();
  renderCharts();
}
function renderProcessStats() {
  const v = rawData?.views || {};
  const s = rawData?.stats || {};
  const cards = [
    { cls: 'total', label: '全部工单', value: v.pending + v.history + v.notify + v.shared + v.qaFail },
    { cls: 'pending', label: '待处理', value: s.pending ?? v.pending },
    { cls: 'processing', label: '处理中', value: s.processing ?? 0 },
    { cls: 'review', label: '关单待审核', value: s.pendingReview ?? 0 }
  ];
  document.getElementById('processStatCards').innerHTML = cards.map(c =>
    `<div class="stat-card ${c.cls}"><div class="label">${c.label}</div><div class="value">${c.value}</div></div>`
  ).join('');
}
function renderProcessTabs() {
  const v = rawData?.views || {};
  document.getElementById('processTabs').innerHTML = PROCESS_VIEW_KEYS.map(k =>
    `<button class="primary-tab${k === currentProcessView ? ' active' : ''}" onclick="switchProcessView('${k}')">${PROCESS_VIEW_NAMES[k]} (${v[k] ?? 0})</button>`
  ).join('');
}
function switchProcessView(k) {
  currentProcessView = k; currentProcessPage = 1;
  renderProcessTabs(); renderProcessTable();
}
function changeProcessPageSize() {
  processPageSize = parseInt(document.getElementById('processPageSize').value);
  currentProcessPage = 1; renderProcessTable();
}
function renderProcessTable() {
  const all = getProcessOrders(currentProcessView);
  const total = all.length;
  const totalPages = Math.ceil(total / processPageSize) || 1;
  if (currentProcessPage > totalPages) currentProcessPage = totalPages;
  const start = (currentProcessPage - 1) * processPageSize;
  const page = all.slice(start, start + processPageSize);
  document.getElementById('processTableInfo').innerHTML = `共 <strong>${total}</strong> 条 · ${PROCESS_VIEW_NAMES[currentProcessView]}`;
  document.getElementById('processTableBody').innerHTML = page.map(o => `
    <tr>
      <td class="id"><a onclick="openDetail('${o.id}')">${o.id}</a></td>
      <td>${o.business}</td><td>${o.source}</td><td>${o.type}</td>
      <td>${o.occurTime}</td><td>${o.city}</td><td>${o.level}</td>
      <td class="summary" title="${escapeHtml(o.summary)}">${o.summary}</td>
      <td class="status"><span class="tag ${STATUS_TAGS[o.status] || 'pending'}">${o.status}</span>${o.overdue ? '<br><span class="overdue-tag">超时'+o.overdueDays+'天</span>' : ''}</td>
      <td>${o.reportTime}</td><td>${o.updateTime}</td><td>${o.reporter || '-'}</td>
      <td><button class="btn-detail" onclick="openDetail('${o.id}')">${o.status === '待处理' ? '去处理' : '查看'}</button></td>
    </tr>
  `).join('');
  renderPagination('process', 'processPagination', totalPages, currentProcessPage, n => { currentProcessPage = n; renderProcessTable(); });
}
function applyProcessFilters() { toast('筛选功能需对接真实数据，当前为前端占位'); }
function clearProcessFilters() { document.querySelectorAll('#processFilters input').forEach(i => i.value = ''); toast('已清空筛选'); }
function exportProcessTable() { toast('导出功能需对接真实数据，当前为前端占位'); }

// ==================== RENDER CLUE ====================
function renderClueModule() {
  renderClueStats(); renderClueTabs(); renderClueTable();
}
function renderClueStats() {
  const v = rawData?.clueViews || {};
  const cards = [
    { cls: 'total', label: '全部线索', value: v.pending + v.history + v.notify },
    { cls: 'pending', label: '待我核实', value: v.pending },
    { cls: 'done', label: '已核实', value: v.history },
    { cls: 'clue', label: '通知我的', value: v.notify }
  ];
  document.getElementById('clueStatCards').innerHTML = cards.map(c =>
    `<div class="stat-card ${c.cls}"><div class="label">${c.label}</div><div class="value">${c.value}</div></div>`
  ).join('');
}
function renderClueTabs() {
  const v = rawData?.clueViews || {};
  document.getElementById('clueTabs').innerHTML = CLUE_VIEW_KEYS.map(k =>
    `<button class="primary-tab${k === currentClueView ? ' active' : ''}" onclick="switchClueView('${k}')">${CLUE_VIEW_NAMES[k]} (${v[k] ?? 0})</button>`
  ).join('');
}
function switchClueView(k) { currentClueView = k; currentCluePage = 1; renderClueTabs(); renderClueTable(); }
function changeCluePageSize() { cluePageSize = parseInt(document.getElementById('cluePageSize').value); currentCluePage = 1; renderClueTable(); }
function renderClueTable() {
  const all = getClueOrders(currentClueView);
  const total = all.length;
  const totalPages = Math.ceil(total / cluePageSize) || 1;
  if (currentCluePage > totalPages) currentCluePage = totalPages;
  const start = (currentCluePage - 1) * cluePageSize;
  const page = all.slice(start, start + cluePageSize);
  document.getElementById('clueTableInfo').innerHTML = `共 <strong>${total}</strong> 条 · ${CLUE_VIEW_NAMES[currentClueView]}`;
  document.getElementById('clueTableBody').innerHTML = page.map(c => `
    <tr>
      <td class="id"><a onclick="openClue('${c.id}')">${c.id}</a></td>
      <td>${c.business}</td><td>${c.type}</td><td class="status"><span class="tag ${STATUS_TAGS[c.status] || 'pending'}">${c.status}</span></td>
      <td class="summary" title="${escapeHtml(c.content)}">${c.content}</td>
      <td>${c.city}</td><td>${c.clueDate}</td><td>${c.sourceDate}</td><td>${c.sourceSystem}</td>
      <td><button class="btn-detail" onclick="openClue('${c.id}')">去处理</button></td>
    </tr>
  `).join('');
  renderPagination('clue', 'cluePagination', totalPages, currentCluePage, n => { currentCluePage = n; renderClueTable(); });
}
function applyClueFilters() { toast('筛选功能需对接真实数据，当前为前端占位'); }
function clearClueFilters() { document.querySelectorAll('#clueFilters input').forEach(i => i.value = ''); toast('已清空筛选'); }
function exportClueTable() { toast('导出功能需对接真实数据，当前为前端占位'); }
function openClue(id) { toast('线索详情弹窗待补充，当前点击线索编号 ' + id); }

// ==================== CITY DASHBOARD ====================
function renderCityModule() {
  const orders = rawData?.orders || [];
  const cityStats = rawData?.cityStats || [];
  const total = orders.length;
  const pending = orders.filter(o => o.status === '待处理').length;
  const processing = orders.filter(o => o.status === '处理中').length;
  const todayStr = new Date().toISOString().slice(0, 10);
  const today = orders.filter(o => (o.reportTime || '').startsWith(todayStr)).length;
  document.getElementById('cityKpiCards').innerHTML = [
    { cls: 'total', label: '覆盖城市', value: cityStats.length },
    { cls: 'pending', label: '待处理工单', value: pending },
    { cls: 'processing', label: '处理中工单', value: processing },
    { cls: 'done', label: '今日新增', value: today }
  ].map(c => `<div class="stat-card ${c.cls}"><div class="label">${c.label}</div><div class="value">${c.value}</div></div>`).join('');

  // city rank table
  const totalCount = total || 1;
  document.getElementById('cityTableInfo').textContent = `全国城市实时排行 · 共 ${cityStats.length} 个城市`;
  document.getElementById('cityTableBody').innerHTML = cityStats.slice(0, 20).map((c, i) => `
    <tr>
      <td><span class="rank ${i < 3 ? 'top' : ''}">${i + 1}</span></td>
      <td>${c.name}</td>
      <td><strong>${c.count}</strong></td>
      <td>${c.pending}</td>
      <td>${c.processing}</td>
      <td>${c.closed}</td>
      <td>${(c.count * 100 / totalCount).toFixed(1)}%</td>
    </tr>
  `).join('');

  // latest orders
  const latest = [...orders].sort((a, b) => (b.reportTime || '').localeCompare(a.reportTime || '')).slice(0, 15);
  document.getElementById('cityLatestBody').innerHTML = latest.map(o => `
    <tr>
      <td>${o.reportTime?.slice(0, 16) || '-'}</td>
      <td>${o.city?.slice(0, 10) || '-'}</td>
      <td>${o.type}</td>
      <td><span class="tag ${STATUS_TAGS[o.status] || 'pending'}">${o.status}</span></td>
      <td class="summary" title="${escapeHtml(o.summary)}">${o.summary?.slice(0, 40) || '-'}...</td>
    </tr>
  `).join('');

  renderCityCharts(cityStats);
}
function renderCityCharts(cityStats) {
  destroyCharts();
  const top15 = cityStats.slice(0, 15).reverse();
  chartInstances.cityRank = new Chart(document.getElementById('chartCityRank'), {
    type: 'bar',
    data: { labels: top15.map(c => c.name), datasets: [{ label: '工单数', data: top15.map(c => c.count), backgroundColor: '#0B4F8A', borderRadius: 4, barThickness: 16 }] },
    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { grid: { display: false } } } }
  });
  const typeData = rawData?.typeDistribution || [];
  chartInstances.cityType = new Chart(document.getElementById('chartCityType'), {
    type: 'doughnut',
    data: { labels: typeData.map(d => d.name), datasets: [{ data: typeData.map(d => d.value), backgroundColor: ['#0B4F8A', '#f59e0b', '#ef4444', '#10b981', '#8b5cf6', '#6366f1'], borderWidth: 2, borderColor: '#fff' }] },
    options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, font: { size: 11 } } } } }
  });
}

// ==================== CHARTS ====================
function renderCharts() {
  const orders = rawData?.orders || [];
  const typeMap = {}; orders.forEach(o => { typeMap[o.type] = (typeMap[o.type] || 0) + 1; });
  const cityMap = {}; orders.forEach(o => { const c = o.city?.replace(/省|市|区/g, '').trim().slice(-4) || o.city; cityMap[c] = (cityMap[c] || 0) + 1; });
  const citySorted = Object.entries(cityMap).sort((a, b) => b[1] - a[1]).slice(0, 10);
  const levelMap = {}; orders.forEach(o => { levelMap[o.level] = (levelMap[o.level] || 0) + 1; });
  const trendMap = {}; orders.forEach(o => { const d = o.occurTime?.split(' ')[0]; if (d) trendMap[d] = (trendMap[d] || 0) + 1; });
  const trendSorted = Object.entries(trendMap).sort((a, b) => a[0].localeCompare(b[0]));
  destroyCharts();
  chartInstances.type = new Chart(document.getElementById('chartType'), { type: 'doughnut', data: { labels: Object.keys(typeMap), datasets: [{ data: Object.values(typeMap), backgroundColor: ['#0B4F8A', '#f59e0b', '#ef4444', '#10b981', '#8b5cf6'], borderWidth: 2, borderColor: '#fff' }] }, options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'bottom', labels: { padding: 16, usePointStyle: true, font: { size: 11 } } } } } });
  chartInstances.city = new Chart(document.getElementById('chartCity'), { type: 'bar', data: { labels: citySorted.map(e => e[0]), datasets: [{ data: citySorted.map(e => e[1]), backgroundColor: '#0B4F8A', borderRadius: 4, barThickness: 18 }] }, options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false }, ticks: { font: { size: 10 } } }, y: { grid: { display: false }, ticks: { font: { size: 10 } } } } } });
  chartInstances.level = new Chart(document.getElementById('chartLevel'), { type: 'doughnut', data: { labels: Object.keys(levelMap), datasets: [{ data: Object.values(levelMap), backgroundColor: ['#0B4F8A', '#60a5fa', '#93c5fd'], borderWidth: 2, borderColor: '#fff' }] }, options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'bottom', labels: { padding: 16, usePointStyle: true, font: { size: 11 } } } } } });
  chartInstances.trend = new Chart(document.getElementById('chartTrend'), { type: 'line', data: { labels: trendSorted.map(e => e[0]), datasets: [{ data: trendSorted.map(e => e[1]), borderColor: '#0B4F8A', backgroundColor: 'rgba(11,79,138,.08)', fill: true, tension: .4, pointRadius: 4, pointBackgroundColor: '#0B4F8A' }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false }, ticks: { font: { size: 10 }, maxRotation: 45 } }, y: { beginAtZero: true, grid: { color: '#f1f5f9' }, ticks: { font: { size: 10 }, stepSize: 1 } } } } });
}
function destroyCharts() { Object.values(chartInstances).forEach(c => c.destroy()); chartInstances = {}; }

// ==================== PAGINATION ====================
function renderPagination(module, containerId, totalPages, current, cb) {
  let html = `<button ${current === 1 ? 'disabled' : ''} onclick="pagGo('${module}', ${current - 1})">‹</button>`;
  for (let i = 1; i <= totalPages; i++) {
    if (totalPages <= 7 || i === 1 || i === totalPages || Math.abs(i - current) <= 1) {
      html += `<button class="${i === current ? 'active' : ''}" onclick="pagGo('${module}', ${i})">${i}</button>`;
    } else if (i === 2 && current > 4) { html += `<button disabled>…</button>`; }
    else if (i === totalPages - 1 && current < totalPages - 3) { html += `<button disabled>…</button>`; }
  }
  html += `<button ${current === totalPages ? 'disabled' : ''} onclick="pagGo('${module}', ${current + 1})">›</button>`;
  window._pagCbs = window._pagCbs || {};
  window._pagCbs[module] = cb;
}
function pagGo(module, n) { const cb = window._pagCbs && window._pagCbs[module]; if (cb) cb(n); }

// ==================== MODAL ====================
function openDetail(id) {
  const order = rawData?.orders?.find(o => o.id === id);
  if (!order) return;
  document.getElementById('modalEventId').textContent = order.id;
  document.getElementById('modalLevel').textContent = order.level;
  const statusEl = document.getElementById('modalStatus');
  statusEl.textContent = order.status;
  statusEl.className = 'status-tag ' + (STATUS_TAGS[order.status] || 'pending');
  window._modalOrder = order; window._modalTab = 0;
  document.querySelectorAll('.modal-tab').forEach((t, i) => t.classList.toggle('active', i === 0));
  renderModalTimeline(order);
  renderModalSidebar(order);
  renderModalTabs();
  renderModalContent(0);
  document.getElementById('modalOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeModal(e) {
  if (e && e.target !== document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').classList.remove('show');
  document.body.style.overflow = '';
}
function renderModalTimeline(o) {
  const tl = o?.detail?.progressTimeline || [];
  const map = { '待处理': 0, '处理中': 3, '关单待审核': 4, '已关闭': 4 };
  const activeIdx = map[o.status] ?? 0;
  document.getElementById('modalTimeline').innerHTML = tl.map((s, i) => {
    const done = s.done || i < activeIdx;
    const active = i === activeIdx && !done;
    return `<div class="timeline-step ${done ? 'done' : ''} ${active ? 'active' : ''}">
      <div class="timeline-dot">${done ? '✓' : i + 1}</div>
      <span>${s.stage}</span>
    </div>`;
  }).join('');
}
function renderModalSidebar(o) {
  const p = o?.detail?.people || {};
  const sections = [
    { key: 'reporter', title: '上报人' },
    { key: 'handler', title: '处理人（已确认）' },
    { key: 'coHandlers', title: '共同处理人' },
    { key: 'notifiers', title: '通知人' }
  ];
  let html = '';
  sections.forEach(sec => {
    const list = p[sec.key] || [];
    html += `<div class="sidebar-section"><h5>${sec.title} <span class="count">${list.length}人</span></h5>`;
    list.forEach(per => {
      html += `<div class="person-item"><div class="person-avatar">${(per.name || '?')[0]}</div><div class="person-name">${per.name}</div></div>`;
      if (per.org && per.org !== '-') html += `<div class="person-org">${per.org}</div>`;
    });
    html += '</div>';
  });
  html += `<div class="sidebar-section"><h5>时间信息</h5><div class="time-info">
    <div>创建时间：${o.reportTime || '-'}</div>
    <div>更新时间：${o.updateTime || '-'}</div>
  </div></div>`;
  document.getElementById('modalSidebar').innerHTML = html;
}
function renderModalTabs() {
  const tabs = ['事件信息', '辅助数据', '进展信息', '操作日志', '大象记录', '保险信息', '关联事件'];
  document.getElementById('modalTabs').innerHTML = tabs.map((t, i) =>
    `<button class="modal-tab${i === window._modalTab ? ' active' : ''}" onclick="switchModalTab(${i})">${t}</button>`
  ).join('');
}
function switchModalTab(idx) { window._modalTab = idx; renderModalTabs(); renderModalContent(idx); }

    const ot = d.other || {};

      ['是否已报保险', ot.insuranceReported], ['关联保险单号', ot.insuranceNo], ['是否完成赔付', ot.compensationDone],
      ['是否疑似伤残', ot.suspectedDisability], ['保险赔付金额', ot.compensationAmount], ['是否有媒体报道', ot.mediaCoverage],
      ['警方介入(业务)', ot.policeInvolvedBiz], ['监管部门介入', ot.regulatorInvolved], ['是否诉讼', ot.litigation],

    else {

function buildSection(title, fields) {
  let html = `<div class="detail-section"><h4>${title}</h4><div class="detail-grid">`;
  fields.forEach(([k, v]) => { html += `<div class="detail-item"><span class="key">${k}</span><span class="val">${escapeHtml(String(v ?? '-'))}</span></div>`; });
  html += '</div></div>';
  return html;
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._tid); t._tid = setTimeout(() => t.classList.remove('show'), 2000); }
const toast = showToast;

async function refreshData() {
  const btn = document.getElementById('btnRefresh');
  btn.classList.add('loading');
  await loadData();
  btn.classList.remove('loading');
  document.getElementById('lastUpdated').textContent = '更新于 ' + (rawData?.lastUpdated || '--');
  if (currentModule === 'city') { renderCityModule(); }
  else if (currentModule === 'process') { renderProcessModule(); }
  else if (currentModule === 'clue') { renderClueModule(); }
  showToast('数据已刷新');
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

(async function init() {
  await loadData();
  document.getElementById('lastUpdated').textContent = '更新于 ' + (rawData?.lastUpdated || '--');
  renderCityModule();
})();
