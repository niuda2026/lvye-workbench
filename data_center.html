<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据中心 - 源数据同步监控</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f5f7fa;
    color: #333;
    padding: 24px;
  }
  .header {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 8px;
  }
  .header h1 { font-size: 22px; color: #1a1a2e; }
  .header .updated { font-size: 13px; color: #888; }
  .legend {
    display: flex;
    gap: 18px;
    font-size: 13px;
    color: #666;
    margin-bottom: 20px;
    padding: 10px 14px;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .dot.ok { background: #22c55e; }
  .dot.warn { background: #f59e0b; }
  .dot.miss { background: #ef4444; }
  .board {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
    margin-bottom: 18px;
    overflow: hidden;
  }
  .board-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid #eee;
    flex-wrap: wrap;
    gap: 8px;
  }
  .board-title { font-size: 16px; font-weight: 600; }
  .board-pages { font-size: 12px; color: #888; margin-top: 4px; }
  .badge {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge.ok { background: #dcfce7; color: #16a34a; }
  .badge.warn { background: #fef3c7; color: #d97706; }
  .badge.miss { background: #fee2e2; color: #dc2626; }
  .board-meta { padding: 10px 18px 0; font-size: 12px; color: #999; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td {
    padding: 10px 18px;
    text-align: left;
    font-size: 13px;
    border-bottom: 1px solid #f0f0f0;
  }
  th { background: #fafbfc; color: #666; font-weight: 600; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  .fname { color: #2563eb; word-break: break-all; }
  .st {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 12px;
    white-space: nowrap;
  }
  .st.ok { background: #dcfce7; color: #16a34a; }
  .st.warn { background: #fef3c7; color: #d97706; }
  .st.miss { background: #fee2e2; color: #dc2626; }
  .empty { padding: 16px 18px; color: #999; font-size: 13px; }
</style>
</head>
<body>
  <div class="header">
    <h1>数据中心</h1>
    <span class="updated" id="updatedAt"></span>
  </div>
  <div class="legend">
    <span><span class="dot ok"></span>已同步</span>
    <span><span class="dot warn"></span>源数据已更新，看板未同步</span>
    <span><span class="dot miss"></span>未找到源数据</span>
  </div>
  <div id="boards"></div>

<script src="data_center.js"></script>
<script>
  function render(data) {
    document.getElementById('updatedAt').textContent = '数据生成时间：' + (data.updated_at || '--');
    var wrap = document.getElementById('boards');
    wrap.innerHTML = '';
    if (!data.boards || !data.boards.length) {
      wrap.innerHTML = '<div class="empty">暂无看板数据</div>';
      return;
    }
    data.boards.forEach(function(b) {
      var card = document.createElement('div');
      card.className = 'board';

      var stClass = b.all_synced ? 'ok' : (b.missing_count > 0 ? 'miss' : 'warn');
      var stText = b.all_synced ? '全部已同步' : (b.missing_count > 0 ? '存在缺失源数据' : '存在未同步数据');
      var head = document.createElement('div');
      head.className = 'board-head';
      head.innerHTML = '<div><div class="board-title">' + b.title + '</div>' +
        '<div class="board-pages">子页面：' + (b.pages || []).join('、') + '</div></div>' +
        '<div class="badge ' + stClass + '">' + stText + '</div>';
      card.appendChild(head);

      var meta = document.createElement('div');
      meta.className = 'board-meta';
      meta.textContent = '看板数据文件最后同步时间：' + (b.data_mtime || '--') +
        '　|　源数据 ' + b.synced_count + '/' + (b.sources ? b.sources.length : 0) + ' 已同步' +
        (b.unsynced_count ? '　|　未同步 ' + b.unsynced_count : '') +
        (b.missing_count ? '　|　缺失 ' + b.missing_count : '');
      card.appendChild(meta);

      var table = document.createElement('table');
      var trh = document.createElement('tr');
      trh.innerHTML = '<th>源数据类型</th><th>最新源数据文件</th><th>源数据更新时间</th><th>同步状态</th>';
      table.appendChild(trh);
      (b.sources || []).forEach(function(s) {
        var tr = document.createElement('tr');
        var st = s.synced === true ? '<span class="st ok">已同步</span>'
          : (s.synced === false ? '<span class="st warn">未同步</span>'
             : '<span class="st miss">未找到源数据</span>');
        tr.innerHTML = '<td>' + s.type + '</td>' +
          '<td class="fname">' + s.latest + '</td>' +
          '<td>' + s.mtime + '</td>' +
          '<td>' + st + '</td>';
        table.appendChild(tr);
      });
      card.appendChild(table);
      wrap.appendChild(card);
    });
  }

  if (window.DATA_CENTER) {
    render(window.DATA_CENTER);
  } else {
    fetch('data_center.json').then(function(r){ return r.json(); }).then(render).catch(function(){
      document.getElementById('boards').innerHTML = '<div class="empty">数据加载失败，请确认 data_center.js / data_center.json 存在</div>';
    });
  }
</script>
</body>
</html>
