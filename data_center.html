<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>数据中心 - 源数据同步监控</title>
<style>
  :root {
    --primary: #1d4ed8;
    --primary-deep: #172554;
    --ink: #0f172a;
    --ink-2: #334155;
    --ink-3: #64748b;
    --ink-4: #94a3b8;
    --line: #e2e8f0;
    --line-soft: #eef2f7;
    --bg: #f4f6fb;
    --card: #ffffff;
    --ok: #059669;
    --ok-bg: #ecfdf5;
    --ok-line: #a7f3d0;
    --warn: #d97706;
    --warn-bg: #fffbeb;
    --warn-line: #fde68a;
    --miss: #dc2626;
    --miss-bg: #fef2f2;
    --miss-line: #fecaca;
    --none: #64748b;
    --none-bg: #f8fafc;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(15,23,42,.04), 0 8px 24px -8px rgba(15,23,42,.10);
    --shadow-hover: 0 2px 4px rgba(15,23,42,.05), 0 16px 40px -12px rgba(29,78,216,.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background:
      radial-gradient(1200px 400px at 80% -180px, rgba(59,130,246,.14), transparent 60%),
      radial-gradient(900px 320px at 10% -140px, rgba(99,102,241,.10), transparent 55%),
      var(--bg);
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ───────── Hero ───────── */
  .hero {
    background: linear-gradient(120deg, #16275c 0%, #1d4ed8 55%, #2563eb 100%);
    color: #fff;
    padding: 26px 32px 88px;
    position: relative;
    overflow: hidden;
  }
  .hero::after {
    content: '';
    position: absolute; right: -120px; top: -120px;
    width: 420px; height: 420px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.12), transparent 65%);
    pointer-events: none;
  }
  .hero-inner { max-width: 1320px; margin: 0 auto; position: relative; z-index: 1; }
  .hero-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .hero-title { display: flex; align-items: center; gap: 14px; }
  .hero-icon {
    width: 46px; height: 46px; border-radius: 13px;
    background: rgba(255,255,255,.16);
    border: 1px solid rgba(255,255,255,.28);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    backdrop-filter: blur(4px);
  }
  .hero-title h1 { font-size: 24px; font-weight: 700; letter-spacing: 2px; }
  .hero-title .sub { font-size: 12.5px; color: rgba(255,255,255,.75); margin-top: 3px; letter-spacing: .5px; }
  .hero-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .legend {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 13px; border-radius: 999px;
    background: rgba(255,255,255,.13);
    border: 1px solid rgba(255,255,255,.22);
    font-size: 12px; color: rgba(255,255,255,.92);
    backdrop-filter: blur(4px);
  }
  .legend .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot.ok { background: #34d399; box-shadow: 0 0 8px rgba(52,211,153,.9); }
  .dot.warn { background: #fbbf24; box-shadow: 0 0 8px rgba(251,191,36,.9); }
  .dot.miss { background: #f87171; box-shadow: 0 0 8px rgba(248,113,113,.9); }
  .dot.none { background: #cbd5e1; }

  /* ───────── Overview panel ───────── */
  .overview {
    max-width: 1320px; margin: -58px auto 0; padding: 0 32px;
    position: relative; z-index: 2;
  }
  .overview-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 26px;
    display: flex; align-items: center; gap: 30px; flex-wrap: wrap;
  }
  .donut-wrap { display: flex; align-items: center; gap: 18px; min-width: 220px; }
  .donut { position: relative; width: 104px; height: 104px; flex: none; }
  .donut svg { transform: rotate(-90deg); }
  .donut .track { fill: none; stroke: var(--line-soft); stroke-width: 10; }
  .donut .val {
    fill: none; stroke: url(#donutGrad); stroke-width: 10; stroke-linecap: round;
    transition: stroke-dashoffset .8s cubic-bezier(.22,.8,.3,1);
  }
  .donut-center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .donut-center b { font-size: 22px; font-weight: 700; color: var(--ink); letter-spacing: -0.5px; }
  .donut-center span { font-size: 10.5px; color: var(--ink-4); margin-top: 1px; }
  .donut-side .t1 { font-size: 14px; font-weight: 700; color: var(--ink); }
  .donut-side .t2 { font-size: 12px; color: var(--ink-3); margin-top: 4px; line-height: 1.6; }
  .divider-v { width: 1px; align-self: stretch; background: var(--line-soft); }
  .kpis { display: flex; gap: 14px; flex: 1; flex-wrap: wrap; justify-content: flex-end; }
  .kpi {
    flex: 1; min-width: 128px; max-width: 220px;
    background: linear-gradient(180deg, #fbfcfe 0%, #f6f8fc 100%);
    border: 1px solid var(--line-soft);
    border-radius: 13px;
    padding: 15px 18px;
    position: relative;
    overflow: hidden;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .kpi:hover { transform: translateY(-2px); box-shadow: 0 10px 24px -10px rgba(15,23,42,.18); }
  .kpi::before {
    content: ''; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3.5px; border-radius: 3px;
  }
  .kpi.blue::before { background: #3b82f6; }
  .kpi.green::before { background: #10b981; }
  .kpi.amber::before { background: #f59e0b; }
  .kpi.red::before { background: #ef4444; }
  .kpi .num { font-size: 26px; font-weight: 700; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
  .kpi.blue .num { color: #1d4ed8; }
  .kpi.green .num { color: #059669; }
  .kpi.amber .num { color: #d97706; }
  .kpi.red .num { color: #dc2626; }
  .kpi .lbl { font-size: 12px; color: var(--ink-3); margin-top: 3px; display: flex; align-items: center; gap: 5px; }

  /* ───────── Toolbar ───────── */
  .toolbar {
    max-width: 1320px; margin: 18px auto 0; padding: 0 32px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .anchor-chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 15px; border-radius: 999px;
    background: #fff; border: 1px solid var(--line);
    font-size: 12.5px; font-weight: 600; color: var(--ink-2);
    cursor: pointer; text-decoration: none;
    box-shadow: 0 1px 2px rgba(15,23,42,.04);
    transition: all .15s ease;
  }
  .anchor-chip:hover { border-color: #bfdbfe; color: var(--primary); box-shadow: 0 4px 12px -4px rgba(29,78,216,.25); transform: translateY(-1px); }
  .anchor-chip .gdot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .anchor-chip .cnt { font-size: 11px; color: var(--ink-4); font-weight: 500; }
  .toolbar .spacer { flex: 1; }
  .filter-btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 16px; border-radius: 999px;
    border: 1px solid var(--line); background: #fff;
    font-size: 12.5px; font-weight: 600; color: var(--ink-2);
    cursor: pointer; transition: all .15s ease;
    box-shadow: 0 1px 2px rgba(15,23,42,.04);
  }
  .filter-btn:hover { border-color: #fecaca; color: var(--miss); }
  .filter-btn.on { background: #fef2f2; border-color: #fca5a5; color: #b91c1c; }

  /* ───────── Groups ───────── */
  .container { max-width: 1320px; margin: 0 auto; padding: 18px 32px 56px; }
  .group {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 24px;
    overflow: hidden;
    scroll-margin-top: 16px;
    transition: box-shadow .2s ease;
  }
  .group:hover { box-shadow: var(--shadow-hover); }
  .group.alert-miss { border-color: #fecaca; }
  .group.alert-warn { border-color: #fde68a; }

  .group-head {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 22px;
    border-bottom: 1px solid var(--line-soft);
    flex-wrap: wrap;
  }
  .g-icon {
    width: 40px; height: 40px; border-radius: 11px; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 19px;
  }
  .g-title-wrap { min-width: 130px; }
  .g-title { font-size: 16.5px; font-weight: 700; color: var(--ink); letter-spacing: .5px; }
  .g-sub { font-size: 11.5px; color: var(--ink-4); margin-top: 2px; }
  .g-progress { flex: 1; min-width: 200px; max-width: 340px; }
  .g-progress .bar-bg {
    height: 7px; border-radius: 5px; background: var(--line-soft); overflow: hidden;
  }
  .g-progress .bar {
    height: 100%; border-radius: 5px;
    background: linear-gradient(90deg, #34d399, #10b981);
    transition: width .6s cubic-bezier(.22,.8,.3,1);
  }
  .g-progress .bar.warn { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
  .g-progress .bar.miss { background: linear-gradient(90deg, #f87171, #ef4444); }
  .g-progress .txt { font-size: 11px; color: var(--ink-4); margin-top: 5px; display: flex; justify-content: space-between; }
  .g-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .badge {
    padding: 5px 14px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .badge.ok { background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok-line); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-line); }
  .badge.miss { background: var(--miss-bg); color: var(--miss); border: 1px solid var(--miss-line); }
  .badge.none { background: var(--none-bg); color: var(--none); border: 1px solid var(--line); }
  .badge .b-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* boards */
  .board-list { padding: 6px 22px; }
  .board-row {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 11px 0;
    border-bottom: 1px dashed var(--line-soft);
    flex-wrap: wrap;
  }
  .board-row:last-child { border-bottom: none; }
  .board-name {
    min-width: 170px; font-size: 13.5px; font-weight: 600; color: var(--ink-2);
    display: flex; align-items: center; gap: 8px; padding-top: 1px;
  }
  .mark { font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .mark.on { background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok-line); }
  .mark.off { background: var(--none-bg); color: var(--ink-4); border: 1px solid var(--line); }
  .open-link {
    font-size: 11px; color: var(--primary); text-decoration: none;
    padding: 2px 8px; border-radius: 8px; border: 1px solid transparent; white-space: nowrap;
    transition: all .15s ease;
  }
  .open-link:hover { background: #eff6ff; border-color: #bfdbfe; }
  .tabs { flex: 1; display: flex; flex-wrap: wrap; gap: 6px; min-width: 240px; }
  .tab-chip {
    padding: 3px 11px; border-radius: 999px; font-size: 12px;
    background: #f6f8fc; color: var(--ink-2); border: 1px solid var(--line-soft);
    transition: all .15s ease;
  }
  .tab-chip:hover { background: #eff6ff; border-color: #bfdbfe; color: var(--primary); }
  .tab-chip.single { background: transparent; color: var(--ink-4); border-style: dashed; }

  /* monitor table */
  .monitor-wrap { border-top: 1px solid var(--line-soft); background: linear-gradient(180deg, #fcfdff, #f8fafd); }
  .monitor-head {
    display: flex; flex-direction: column; gap: 3px;
    padding: 12px 22px 6px; font-size: 12px; color: var(--ink-3);
  }
  .monitor-head .mh-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
  .monitor-head .m { font-variant-numeric: tabular-nums; }
  .monitor-head b { color: var(--ink-2); font-size: 12px; letter-spacing: .5px; display: inline-flex; align-items: baseline; gap: 4px; vertical-align: baseline; }
  .monitor-head b::before { content: ''; width: 3px; height: 12px; border-radius: 2px; background: var(--primary); }
  .monitor-head .m { font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; }
  th {
    padding: 9px 22px; text-align: left;
    font-size: 11.5px; font-weight: 600; color: var(--ink-4);
    letter-spacing: .5px; white-space: nowrap;
    border-bottom: 1px solid var(--line-soft);
  }
  td {
    padding: 10px 22px; font-size: 12.5px; color: var(--ink-2);
    border-top: 1px solid var(--line-soft);
  }
  tr:first-child td { border-top: none; }
  tbody tr { transition: background .12s ease; }
  tbody tr:hover { background: #fff; }
  tr.alert-warn-row td { background: var(--warn-bg); }
  tr.alert-miss-row td { background: var(--miss-bg); }
  td.type { font-weight: 600; color: var(--ink); white-space: nowrap; }
  .fname {
    color: #2563eb; word-break: break-all; max-width: 520px;
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
  }
  td.time { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .rel { font-size: 11px; color: var(--ink-4); margin-left: 7px; }
  .st {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3.5px 12px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
  }
  .st.ok { background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok-line); }
  .st.warn { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-line); }
  .st.miss { background: var(--miss-bg); color: var(--miss); border: 1px solid var(--miss-line); }
  .st::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .none-tip { padding: 16px 22px; font-size: 12.5px; color: var(--ink-4); }
  .empty { padding: 60px; text-align: center; color: var(--ink-4); font-size: 14px; }
  .footer { text-align: center; color: var(--ink-4); font-size: 12px; padding: 6px 0 26px; }

  @media (max-width: 900px) {
    .hero { padding: 20px 18px 84px; }
    .overview, .toolbar, .container { padding-left: 18px; padding-right: 18px; }
    .overview-card { gap: 18px; }
    .kpis { justify-content: flex-start; }
    .g-progress { order: 5; max-width: none; flex-basis: 100%; }
    .fname { max-width: 200px; }
  }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <linearGradient id="donutGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#34d399"/>
        <stop offset="100%" stop-color="#059669"/>
      </linearGradient>
    </defs>
  </svg>

  <div class="hero">
    <div class="hero-inner">
      <div class="hero-top">
        <div class="hero-title">
          <div class="hero-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="3" y="12" width="4" height="9" rx="1.2" fill="#fff" opacity=".65"/><rect x="10" y="7" width="4" height="14" rx="1.2" fill="#fff" opacity=".85"/><rect x="17" y="3" width="4" height="18" rx="1.2" fill="#fff"/></svg></div>
          <div>
            <h1>数据中心</h1>
            <div class="sub">源数据同步监控 · DATA SYNC CENTER</div>
          </div>
        </div>
        <div class="hero-right">
          <span class="legend"><span class="dot ok"></span>已同步</span>
          <span class="legend"><span class="dot warn"></span>源新看板未同步</span>
          <span class="legend"><span class="dot miss"></span>未找到源数据</span>
          <span class="legend"><span class="dot none"></span>暂无监控</span>
          <span class="legend" id="updatedAt">数据生成时间：--</span>
        </div>
      </div>
    </div>
  </div>

  <div class="overview">
    <div class="overview-card">
      <div class="donut-wrap">
        <div class="donut">
          <svg width="104" height="104" viewBox="0 0 104 104">
            <circle class="track" cx="52" cy="52" r="44"/>
            <circle class="val" id="donutVal" cx="52" cy="52" r="44"/>
          </svg>
          <div class="donut-center"><b id="donutPct">--%</b><span>总体同步率</span></div>
        </div>
        <div class="donut-side">
          <div class="t1">源数据同步总览</div>
          <div class="t2" id="donutSide">--</div>
        </div>
      </div>
      <div class="divider-v"></div>
      <div class="kpis">
        <div class="kpi blue"><div class="num" id="kpiGroups">-</div><div class="lbl">🗂️ 监控分组</div></div>
        <div class="kpi blue"><div class="num" id="kpiBoards">-</div><div class="lbl">📊 看板总数</div></div>
        <div class="kpi green"><div class="num" id="kpiSynced">-</div><div class="lbl">✅ 源数据已同步</div></div>
        <div class="kpi amber"><div class="num" id="kpiUnsync">-</div><div class="lbl">⏳ 看板待更新</div></div>
        <div class="kpi red"><div class="num" id="kpiMissing">-</div><div class="lbl">🚫 源数据缺失</div></div>
        <div class="kpi green"><div class="num" id="kpiActionOk">-</div><div class="lbl">⚙️ 动作正常</div></div>
        <div class="kpi red"><div class="num" id="kpiActionAlert">-</div><div class="lbl">🚨 动作未执行</div></div>
      </div>
    </div>
  </div>

  <div class="toolbar" id="toolbar">
    <!-- anchor chips injected here -->
    <span class="spacer"></span>
    <button class="filter-btn" id="filterBtn" onclick="toggleFilter()">🔍 只看异常</button>
  </div>

  <div class="container" id="groups"></div>
  <div class="footer">兴达履约安全工作台 · 数据中心</div>

<script src="data_center.js?v=202609112300"></script>
<script>
  var showOnlyAlert = false;

  function stHtml(synced) {
    if (synced === true) return '<span class="st ok">已同步</span>';
    if (synced === false) return '<span class="st warn">未同步</span>';
    return '<span class="st miss">未找到源数据</span>';
  }

  function rowCls(synced) {
    if (synced === false) return ' class="alert-warn-row"';
    if (synced === null || synced === undefined) return ' class="alert-miss-row"';
    return '';
  }

  function relTime(mtStr, baseStr) {
    if (!mtStr || mtStr === '--') return '';
    var t = new Date(mtStr.replace(/-/g, '/'));
    var base = baseStr ? new Date(baseStr.replace(/-/g, '/')) : new Date();
    if (isNaN(t.getTime())) return '';
    var diff = Math.max(0, base - t) / 1000;
    if (diff < 3600) return Math.max(1, Math.floor(diff / 60)) + ' 分钟前';
    if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
    return Math.floor(diff / 86400) + ' 天前';
  }

  function groupIcon(title) {
    var map = {
      '交通安全': '🚦', '履约项目': '📋', '服装标准化': '👕', '骑手管理': '🏍️',
      '保险': '🛡️', '公司风险管理系统': '⚠️', '站点地图': '🗺️', '月度累计': '📅',
      '数据中心': '🖥️'
    };
    return map[title] || '📁';
  }
  function groupColor(title) {
    var map = {
      '交通安全': ['#eff6ff', '#3b82f6'], '履约项目': ['#f0fdf4', '#22c55e'],
      '服装标准化': ['#fdf4ff', '#c026d3'], '骑手管理': ['#fff7ed', '#f97316'],
      '保险': ['#eff6ff', '#0ea5e9'], '公司风险管理系统': ['#fef2f2', '#ef4444'],
      '站点地图': ['#f0fdfa', '#14b8a6'], '月度累计': ['#eef2ff', '#6366f1'],
      '数据中心': ['#f8fafc', '#64748b']
    };
    return map[title] || ['#f8fafc', '#64748b'];
  }

  function groupBadge(mon) {
    if (!mon) return '<span class="badge none"><span class="b-dot"></span>暂无监控</span>';
    var ast = mon.action_stats || {alert_count:0, missing_count:0};
    var actionAlert = ast.alert_count + ast.missing_count;
    if (actionAlert > 0) return '<span class="badge miss"><span class="b-dot"></span>' + actionAlert + ' 个动作未执行</span>';
    if (mon.missing_count > 0) return '<span class="badge miss"><span class="b-dot"></span>缺失 ' + mon.missing_count + ' 项源数据</span>';
    if (mon.unsynced_count > 0) return '<span class="badge warn"><span class="b-dot"></span>' + mon.unsynced_count + ' 项待更新</span>';
    return '<span class="badge ok"><span class="b-dot"></span>全部健康</span>';
  }

  function actHtml(ok) {
    if (ok === true) return '<span class="st ok">已执行</span>';
    if (ok === false) return '<span class="st miss">超期未执行</span>';
    return '<span class="st miss">未找到</span>';
  }

  function renderActions(mon, baseStr) {
    if (!mon || !(mon.actions || []).length) {
      return '';
    }
    var ast = mon.action_stats || {};
    var metaTxt = '<span class="m">逻辑动作 <b style="color:#0f172a">' + ast.ok_count + '/' + ast.total + '</b> 正常</span>' +
      (ast.alert_count ? '<span class="m" style="color:#dc2626">　|　超期 ' + ast.alert_count + '</span>' : '') +
      (ast.missing_count ? '<span class="m" style="color:#dc2626">　|　缺失 ' + ast.missing_count + '</span>' : '');

    var rows = '';
    mon.actions.forEach(function(a) {
      var note = a.note ? '<span class="rel" style="color:#64748b;margin-left:6px">(' + a.note + ')</span>' : '';
      var age = a.age_hours !== null ? '<span class="rel">' + Math.round(a.age_hours) + ' 小时前</span>' : '';
      // 日志类动作的失败原因（文件新 ≠ 抓取成功）
      var failTip = '';
      if ((a.fail_lines || []).length) {
        failTip = '<div class="rel" style="color:#dc2626;white-space:normal;max-width:520px;margin-top:3px">' +
          '⚠ ' + a.fail_lines.map(function(s){ return s.replace(/</g,'&lt;'); }).join('<br>⚠ ') + '</div>';
      }
      rows += '<tr' + (a.ok === false ? ' class="alert-miss-row"' : '') + '>' +
        '<td class="type">' + a.label + '</td>' +
        '<td><div class="fname" title="' + a.path + '">' + a.latest + '</div></td>' +
        '<td class="time">' + a.mtime + age + note + failTip + '</td>' +
        '<td>' + actHtml(a.ok) + '</td></tr>';
    });
    return '<div class="monitor-wrap" style="margin-top:14px">' +
      '<div class="monitor-head"><div class="mh-row"><b>逻辑动作执行监控</b></div><div style="text-align:right;font-size:11.5px;line-height:1.9">' + metaTxt + '</div></div>' +
      '<table><thead><tr><th>动作名称</th><th>监控文件</th><th>最后执行时间</th><th>状态</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>';
  }

  function renderMonitor(mon, baseStr) {
    if (!mon) {
      return '<div class="none-tip">本分组未配置源数据监控，暂无同步状态展示。</div>';
    }
    var total = (mon.sources || []).length;
    var pct = total ? Math.round(mon.synced_count / total * 100) : 100;
    var barCls = pct === 100 ? '' : (mon.missing_count > 0 ? ' miss' : ' warn');
    var metaTxt = '<span class="m">看板数据文件最后同步：<b style="color:#0f172a">' + (mon.data_mtime || '--') + '</b></span>' +
      '<span class="m">　|　源数据 <b style="color:#0f172a">' + mon.synced_count + '/' + total + '</b> 已同步</span>' +
      (mon.unsynced_count ? '<span class="m" style="color:#d97706">　|　待更新 ' + mon.unsynced_count + '</span>' : '') +
      (mon.missing_count ? '<span class="m" style="color:#dc2626">　|　缺失 ' + mon.missing_count + '</span>' : '');

    var rows = '';
    (mon.sources || []).forEach(function(s) {
      rows += '<tr' + rowCls(s.synced) + '>' +
        '<td class="type">' + s.type + '</td>' +
        '<td><div class="fname" title="' + s.latest + '">' + s.latest + '</div></td>' +
        '<td class="time">' + s.mtime + '<span class="rel">' + relTime(s.mtime, baseStr) + '</span></td>' +
        '<td>' + stHtml(s.synced) + '</td></tr>';
    });
    var srcTable = total ? '<table><thead><tr><th>源数据类型</th><th>最新源数据文件</th><th>源数据更新时间</th><th>同步状态</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table>' : '<div style="padding:14px 0;color:#64748b;font-size:12px">本分组未配置 M 盘/本地源数据监控。</div>';
    return '<div class="monitor-wrap">' +
      '<div class="monitor-head"><div class="mh-row"><b>源数据同步明细</b></div><div style="text-align:right;font-size:11.5px;line-height:1.9">' + metaTxt + '</div></div>' +
      srcTable + '</div>';
  }

  function render(data) {
    document.getElementById('updatedAt').textContent = '数据生成时间：' + (data.updated_at || '--');
    var baseStr = data.updated_at;
    var wrap = document.getElementById('groups');
    wrap.innerHTML = '';
    if (!data.groups || !data.groups.length) {
      wrap.innerHTML = '<div class="empty">暂无数据</div>';
      return;
    }

    /* overview totals */
    var totSources = 0, totSynced = 0, totUnsync = 0, totMissing = 0, totBoards = 0;
    var totActions = 0, actionOk = 0, actionAlert = 0, actionMissing = 0;
    data.groups.forEach(function(g) {
      totBoards += (g.boards || []).length;
      if (g.monitor) {
        totSources += (g.monitor.sources || []).length;
        totSynced += g.monitor.synced_count || 0;
        totUnsync += g.monitor.unsynced_count || 0;
        totMissing += g.monitor.missing_count || 0;
        var ast = g.monitor.action_stats || {};
        totActions += ast.total || 0;
        actionOk += ast.ok_count || 0;
        actionAlert += ast.alert_count || 0;
        actionMissing += ast.missing_count || 0;
      }
    });
    var pct = totSources ? Math.round(totSynced / totSources * 100) : 100;
    var C = 2 * Math.PI * 44;
    var donut = document.getElementById('donutVal');
    donut.setAttribute('stroke-dasharray', C);
    donut.setAttribute('stroke-dashoffset', C * (1 - pct / 100));
    document.getElementById('donutPct').textContent = pct + '%';
    document.getElementById('donutPct').style.color = pct === 100 ? '#059669' : (totMissing ? '#dc2626' : '#d97706');
    document.getElementById('donutSide').innerHTML =
      '共 <b style="color:#0f172a">' + totSources + '</b> 项源数据，其中 <b style="color:#059669">' + totSynced + '</b> 项已同步' +
      (totUnsync ? '，<b style="color:#d97706">' + totUnsync + '</b> 项看板待更新' : '') +
      (totMissing ? '，<b style="color:#dc2626">' + totMissing + '</b> 项源缺失' : '') +
      '<br>共 <b style="color:#0f172a">' + totActions + '</b> 个逻辑动作，<b style="color:#059669">' + actionOk + '</b> 个正常' +
      (actionAlert ? '，<b style="color:#dc2626">' + actionAlert + '</b> 个超期未执行' : '') +
      (actionMissing ? '，<b style="color:#dc2626">' + actionMissing + '</b> 个动作文件缺失' : '');
    document.getElementById('kpiGroups').textContent = data.groups.length;
    document.getElementById('kpiBoards').textContent = totBoards;
    document.getElementById('kpiSynced').textContent = totSynced;
    document.getElementById('kpiUnsync').textContent = totUnsync;
    document.getElementById('kpiMissing').textContent = totMissing;
    document.getElementById('kpiActionOk').textContent = actionOk;
    document.getElementById('kpiActionAlert').textContent = actionAlert + actionMissing;

    /* toolbar anchors */
    var toolbar = document.getElementById('toolbar');
    var spacer = toolbar.querySelector('.spacer');
    data.groups.forEach(function(g, gi) {
      var a = document.createElement('a');
      a.className = 'anchor-chip';
      a.href = '#grp-' + gi;
      var ast = g.monitor ? (g.monitor.action_stats || {}) : {};
      var actionAlertCnt = ast.alert_count + ast.missing_count;
      var stColor = !g.monitor ? '#cbd5e1' : ((g.monitor.all_synced && ast.all_ok) ? '#34d399' : ((g.monitor.missing_count > 0 || actionAlertCnt > 0) ? '#f87171' : '#fbbf24'));
      var cntTxt = g.monitor ? (g.monitor.synced_count + '/' + (g.monitor.sources || []).length) : (g.boards ? g.boards.length + ' 板' : '');
      a.innerHTML = '<span class="gdot" style="background:' + stColor + '"></span>' + g.title +
        (cntTxt ? '<span class="cnt">' + cntTxt + '</span>' : '');
      toolbar.insertBefore(a, spacer);
    });

    /* group cards */
    data.groups.forEach(function(g, gi) {
      var card = document.createElement('div');
      card.className = 'group';
      card.id = 'grp-' + gi;
      var ast2 = g.monitor ? (g.monitor.action_stats || {}) : {};
      var hasActionAlert = ast2.alert_count + ast2.missing_count > 0;
      if (g.monitor && (!g.monitor.all_synced || hasActionAlert)) {
        card.className += (g.monitor.missing_count > 0 || hasActionAlert) ? ' alert-miss' : ' alert-warn';
      }
      if (showOnlyAlert && g.monitor && g.monitor.all_synced && !hasActionAlert) {
        card.style.display = 'none';
      }

      /* progress */
      var mTotal = g.monitor ? (g.monitor.sources || []).length : 0;
      var mPct = (g.monitor && mTotal) ? Math.round(g.monitor.synced_count / mTotal * 100) : 100;
      var mBarCls = mPct === 100 ? '' : (g.monitor && g.monitor.missing_count > 0 ? ' miss' : ' warn');
      var progressHtml = '';
      if (g.monitor) {
        progressHtml = '<div class="g-progress">' +
          '<div class="bar-bg"><div class="bar' + mBarCls + '" style="width:' + mPct + '%"></div></div>' +
          '<div class="txt"><span>源数据同步进度</span><span>' + mPct + '%</span></div></div>';
      }

      var iconBg = groupColor(g.title);
      var head = '<div class="group-head">' +
        '<div class="g-icon" style="background:' + iconBg[0] + '">' + groupIcon(g.title) + '</div>' +
        '<div class="g-title-wrap"><div class="g-title">' + g.title + '</div>' +
        '<div class="g-sub">' + (g.boards ? g.boards.length : 0) + ' 个看板' +
        (g.monitor ? ' · ' + (g.monitor.sources || []).length + ' 项源数据' : '') + '</div></div>' +
        progressHtml +
        '<div class="g-right">' + groupBadge(g.monitor) + '</div>' +
        '</div>';

      var boardRows = '';
      (g.boards || []).forEach(function(b) {
        var mark = b.monitored
          ? '<span class="mark on">已监控</span>'
          : '<span class="mark off">暂无监控</span>';
        var open = '';
        if (b.file && /^(https?:|file:|\/|[A-Za-z]:\/)/.test(b.file)) {
          var href = b.file;
          if (/^[A-Za-z]:\//.test(href)) href = 'file:///' + href.replace(/\\/g, '/');
          open = ' <a class="open-link" href="' + href + '" target="_blank" title="' + b.file + '">打开 ↗</a>';
        }
        var tabs = '';
        if (b.tabs && b.tabs.length) {
          b.tabs.forEach(function(t) { tabs += '<span class="tab-chip">' + t + '</span>'; });
        } else {
          tabs = '<span class="tab-chip single">单页面</span>';
        }
        boardRows += '<div class="board-row"><div class="board-name">' + b.label + mark + open +
          '</div><div class="tabs">' + tabs + '</div></div>';
      });

      card.innerHTML = head + '<div class="board-list">' + boardRows + '</div>' + renderMonitor(g.monitor, baseStr) + renderActions(g.monitor, baseStr);
      wrap.appendChild(card);
    });
  }

  function toggleFilter() {
    showOnlyAlert = !showOnlyAlert;
    var btn = document.getElementById('filterBtn');
    btn.className = 'filter-btn' + (showOnlyAlert ? ' on' : '');
    btn.textContent = showOnlyAlert ? '✕ 显示全部分组' : '🔍 只看异常';
    var groups = document.querySelectorAll('.group');
    groups.forEach(function(card, gi) {
      var mon = null;
      if (window.DATA_CENTER && window.DATA_CENTER.groups[gi]) mon = window.DATA_CENTER.groups[gi].monitor;
      var ast = mon ? (mon.action_stats || {}) : {};
      var hasActionAlert = ast.alert_count + ast.missing_count > 0;
      var isAlert = mon && (!mon.all_synced || hasActionAlert);
      card.style.display = (showOnlyAlert && !isAlert) ? 'none' : '';
    });
  }

  if (window.DATA_CENTER) {
    render(window.DATA_CENTER);
  } else {
    fetch('data_center.json').then(function(r){ return r.json(); }).then(render).catch(function(){
      document.getElementById('groups').innerHTML = '<div class="empty">数据加载失败，请确认 data_center.js / data_center.json 存在</div>';
    });
  }
</script>
</body>
</html>
