<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据中心 - 源数据同步监控</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #eef3fb 0%, #f7f9fd 100%);
    color: #333;
    min-height: 100vh;
  }
  .topbar {
    background: linear-gradient(135deg, #0B4F8A 0%, #1E88E5 50%, #1e88e5 100%);
    padding: 0 24px;
    border-bottom: 3px solid #0A3D6B;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    box-shadow: 0 2px 8px rgba(11,79,138,.4);
    color: #fff;
    height: 76px;
    overflow: hidden;
  }
  .topbar h1 { font-size: 20px; font-weight: 700; letter-spacing: 1px; text-shadow: 0 1px 3px rgba(0,0,0,.3); white-space: nowrap; }
  .topbar-right { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .topbar .sub { font-size: 12px; color: #B3D0E8; text-align: right; white-space: nowrap; }
  .topbar .legend {
    display: inline-flex;
    gap: 14px;
    padding: 5px 14px;
    background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 20px;
    font-size: 12px;
    color: #fff;
    white-space: nowrap;
  }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .dot.ok { background: #4ade80; box-shadow: 0 0 6px rgba(74,222,128,.8); }
  .dot.warn { background: #fbbf24; box-shadow: 0 0 6px rgba(251,191,36,.8); }
  .dot.miss { background: #f87171; box-shadow: 0 0 6px rgba(248,113,113,.8); }
  .dot.none { background: #94a3b8; }

  .container { max-width: 1240px; margin: 0 auto; padding: 24px 28px 48px; }

  .group {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 10px rgba(11,79,138,.08);
    margin-bottom: 22px;
    overflow: hidden;
    border: 1px solid #e6eef8;
  }
  .group-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    background: linear-gradient(90deg, #f3f8fe 0%, #ffffff 100%);
    border-bottom: 1px solid #e6eef8;
    flex-wrap: wrap;
    gap: 8px;
  }
  .group-title { font-size: 17px; font-weight: 700; color: #0B4F8A; }
  .group-title::before {
    content: '';
    display: inline-block;
    width: 4px; height: 16px;
    background: linear-gradient(180deg, #1E88E5, #0B4F8A);
    border-radius: 2px;
    margin-right: 10px;
    vertical-align: -2px;
  }
  .group-meta { font-size: 12px; color: #8899aa; }
  .badge {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge.ok { background: #dcfce7; color: #16a34a; }
  .badge.warn { background: #fef3c7; color: #d97706; }
  .badge.miss { background: #fee2e2; color: #dc2626; }
  .badge.none { background: #f1f5f9; color: #64748b; }

  .group-body { padding: 4px 0; }

  .board-row {
    display: flex;
    align-items: flex-start;
    padding: 12px 20px;
    border-bottom: 1px solid #f2f6fb;
    gap: 14px;
    flex-wrap: wrap;
  }
  .board-row:last-child { border-bottom: none; }
  .board-name {
    min-width: 150px;
    font-size: 14px;
    font-weight: 600;
    color: #1a3353;
    padding-top: 2px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .board-name .mark { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 10px; }
  .mark.on { background: #e0f2fe; color: #0369a1; }
  .mark.off { background: #f1f5f9; color: #64748b; }
  .tabs {
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-width: 260px;
  }
  .tab-chip {
    padding: 3px 10px;
    border-radius: 14px;
    font-size: 12px;
    background: #f0f5fc;
    color: #3b5b7d;
    border: 1px solid #dbe7f5;
  }
  .tab-chip.single { background: #f8fafc; color: #94a3b8; border-style: dashed; }

  .monitor-wrap { border-top: 1px dashed #dbe7f5; background: #fbfdff; }
  .monitor-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    font-size: 12px;
    color: #7a8aa0;
    flex-wrap: wrap;
    gap: 6px;
  }
  .monitor-head b { color: #0B4F8A; }
  table { width: 100%; border-collapse: collapse; }
  th, td {
    padding: 9px 20px;
    text-align: left;
    font-size: 12.5px;
    border-top: 1px solid #f0f4fa;
  }
  th { background: #f6fafd; color: #5a7086; font-weight: 600; white-space: nowrap; }
  .fname { color: #2563eb; word-break: break-all; }
  .st {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 12px;
    white-space: nowrap;
  }
  .st.ok { background: #dcfce7; color: #16a34a; }
  .st.warn { background: #fef3c7; color: #d97706; }
  .st.miss { background: #fee2e2; color: #dc2626; }
  .none-tip { padding: 14px 20px; font-size: 12.5px; color: #94a3b8; }
  .none-tip::before { content: 'ⓘ '; }
  .empty { padding: 40px; text-align: center; color: #94a3b8; font-size: 14px; }
  .footer { text-align: center; color: #a0b0c0; font-size: 12px; padding: 10px 0 20px; }
</style>
</head>
<body>
  <div class="topbar">
    <h1>数据中心</h1>
    <div class="topbar-right">
      <div class="legend">
        <span><span class="dot ok"></span>已同步</span>
        <span><span class="dot warn"></span>源数据已更新，看板未同步</span>
        <span><span class="dot miss"></span>未找到源数据</span>
        <span><span class="dot none"></span>暂无监控</span>
      </div>
      <div class="sub" id="updatedAt">数据生成时间：--</div>
    </div>
  </div>
  <div class="container" id="groups"></div>
  <div class="footer">兴达履约安全工作台 · 数据中心</div>

<script src="data_center.js"></script>
<script>
  function stHtml(synced) {
    if (synced === true) return '<span class="st ok">已同步</span>';
    if (synced === false) return '<span class="st warn">未同步</span>';
    return '<span class="st miss">未找到源数据</span>';
  }

  function groupBadge(mon) {
    if (!mon) return '<span class="badge none">暂无监控</span>';
    var cls = mon.all_synced ? 'ok' : (mon.missing_count > 0 ? 'miss' : 'warn');
    var txt = mon.all_synced ? '全部已同步' : (mon.missing_count > 0 ? '存在缺失源数据' : '存在未同步数据');
    return '<span class="badge ' + cls + '">' + txt + '</span>';
  }

  function renderMonitor(mon) {
    if (!mon) {
      return '<div class="none-tip">本分组未配置源数据监控，暂无同步状态展示。</div>';
    }
    var metaTxt = '看板数据文件最后同步：' + (mon.data_mtime || '--') +
      '　|　源数据 ' + mon.synced_count + '/' + (mon.sources ? mon.sources.length : 0) + ' 已同步' +
      (mon.unsynced_count ? '　|　未同步 ' + mon.unsynced_count : '') +
      (mon.missing_count ? '　|　缺失 ' + mon.missing_count : '');
    var rows = '';
    (mon.sources || []).forEach(function(s) {
      rows += '<tr><td>' + s.type + '</td><td class="fname">' + s.latest + '</td><td>' + s.mtime + '</td><td>' + stHtml(s.synced) + '</td></tr>';
    });
    return '<div class="monitor-wrap"><div class="monitor-head"><b>源数据同步明细</b><span>' + metaTxt + '</span></div>' +
      '<table><tr><th>源数据类型</th><th>最新源数据文件</th><th>源数据更新时间</th><th>同步状态</th></tr>' + rows + '</table></div>';
  }

  function render(data) {
    document.getElementById('updatedAt').textContent = '数据生成时间：' + (data.updated_at || '--');
    var wrap = document.getElementById('groups');
    wrap.innerHTML = '';
    if (!data.groups || !data.groups.length) {
      wrap.innerHTML = '<div class="empty">暂无数据</div>';
      return;
    }
    data.groups.forEach(function(g) {
      var card = document.createElement('div');
      card.className = 'group';

      var boardRows = '';
      (g.boards || []).forEach(function(b) {
        var mark = b.monitored ? '<span class="mark on">已监控</span>' : '<span class="mark off">暂无监控</span>';
        var tabs = '';
        if (b.tabs && b.tabs.length) {
          b.tabs.forEach(function(t) { tabs += '<span class="tab-chip">' + t + '</span>'; });
        } else {
          tabs = '<span class="tab-chip single">单页面</span>';
        }
        boardRows += '<div class="board-row"><div class="board-name">' + b.label + mark + '</div><div class="tabs">' + tabs + '</div></div>';
      });

      var head = document.createElement('div');
      head.className = 'group-head';
      head.innerHTML = '<div class="group-title">' + g.title + '</div>' +
        '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
        '<span class="group-meta">' + (g.boards ? g.boards.length : 0) + ' 个看板</span>' +
        groupBadge(g.monitor) + '</div>';
      card.appendChild(head);

      var body = document.createElement('div');
      body.className = 'group-body';
      body.innerHTML = boardRows;
      card.appendChild(body);

      var monWrap = document.createElement('div');
      monWrap.innerHTML = renderMonitor(g.monitor);
      card.appendChild(monWrap.firstChild);
      wrap.appendChild(card);
    });
  }

  if (window.DATA_CENTER) {
    render(window.DATA_CENTER);
  } else {
    fetch('data_center.json').then(function(r){ return r.json(); }).then(render).catch(function(){
      document.getElementById('groups').innerHTML = '<div class="empty">数据加载失败，请确认 data_center.js / data_center.json 存在</div>';
    });
  }
</script>
</body>
</html>
