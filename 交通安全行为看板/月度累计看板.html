<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>月度累计看板</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F0F6FC;color:#1a2e45;font-family:'Segoe UI','Microsoft YaHei','PingFang SC',Arial,sans-serif;font-size:13px;min-height:100vh}
.header{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#0B4F8A 0%,#1E88E5 50%,#1e88e5 100%);padding:14px 24px;border-bottom:3px solid #0A3D6B;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;box-shadow:0 2px 8px rgba(11,79,138,.4)}
.header-title{font-size:20px;font-weight:700;color:#ffffff;letter-spacing:1px;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.header-sub{font-size:12px;color:#B3D0E8;margin-top:3px}
.header-right{text-align:right;font-size:12px;color:#B3D0E8;line-height:1.8}
.tab-bar{display:flex;background:#0B4F8A;border-bottom:2px solid #0A3D6B;padding:0 16px;gap:4px;flex-wrap:wrap}
.tab-item{padding:10px 22px;cursor:pointer;color:#8FB8DA;border-bottom:3px solid transparent;font-size:13px;font-weight:500;transition:all .2s;white-space:nowrap}
.tab-item:hover{color:#fff;background:rgba(255,255,255,.1)}
.tab-item.active{color:#fff;border-bottom:3px solid #fff;background:rgba(255,255,255,.15)}
.filter-bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 16px;background:#ffffff;border-bottom:1px solid #d6e4f0;box-shadow:0 1px 3px rgba(11,79,138,.06)}
.filter-bar label{color:#0B4F8A;font-size:12px;white-space:nowrap;font-weight:500}
.filter-bar select{background:#fff;color:#1a2e45;border:1px solid #8FB8DA;padding:5px 8px;border-radius:4px;font-size:13px;outline:none;font-weight:600;cursor:pointer}
.filter-bar .hint{color:#78909c;font-size:12px}
.ms-wrap{position:relative;display:inline-block;vertical-align:top;}
.ms-btn{display:flex;align-items:center;justify-content:space-between;min-width:90px;max-width:160px;padding:5px 8px;background:#fff;border:1px solid #8FB8DA;border-radius:4px;font-size:12px;color:#1a2e45;cursor:pointer;user-select:none;gap:4px;}
.ms-btn:hover{border-color:#0B4F8A;}
.ms-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ms-arrow{font-size:10px;color:#4F6E87;transition:transform .2s;}
.ms-wrap.open .ms-arrow{transform:rotate(180deg);}
.ms-drop{display:none;position:absolute;top:calc(100% + 2px);left:0;min-width:120px;max-width:220px;max-height:220px;overflow-y:auto;background:#fff;border:1px solid #8FB8DA;border-radius:4px;box-shadow:0 4px 12px rgba(0,0,0,.12);z-index:9999;padding:4px 0;}
.ms-wrap.open .ms-drop{display:block;}
.ms-item{display:flex;align-items:center;gap:6px;padding:5px 10px;font-size:12px;color:#1a2e45;cursor:pointer;white-space:nowrap;}
.ms-item:hover{background:#EAF2F9;}
.ms-item input[type=checkbox]{margin:0;cursor:pointer;accent-color:#0B4F8A;}
.ms-item.checked{background:#e8f5e9;font-weight:600;}
.btn{padding:5px 14px;border-radius:4px;border:none;cursor:pointer;font-size:12px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.btn-secondary{background:#EAF2F9;color:#0B4F8A;border:1px solid #8FB8DA}
.btn-secondary:hover{background:#B3D0E8}
.summary-row{display:flex;gap:10px;padding:12px 16px;flex-wrap:wrap;background:#f0f7ff}
.card{background:#ffffff;border:1px solid #d6e4f0;border-radius:6px;padding:10px 14px;min-width:150px;flex:1;max-width:230px;box-shadow:0 1px 4px rgba(11,79,138,.08)}
.card .c-label{font-size:11px;color:#4F6E87;margin-bottom:3px;letter-spacing:.3px}
.card .c-value{font-size:20px;font-weight:700;color:#0B4F8A;font-variant-numeric:tabular-nums;letter-spacing:.2px}
.card .c-sub{font-size:11px;color:#90a4ae;margin-top:3px}
.card.green .c-value{color:#2e7d32}
.card.yellow .c-value{color:#e65100}
.card.red .c-value{color:#c62828}
.panel{display:none}
.panel.active{display:block}
.table-wrap{overflow:auto;max-height:calc(100vh - 210px)}
table.dt{width:100%;border-collapse:collapse;font-size:12px}
table.dt th{background:#0B4F8A;color:#fff;padding:8px 10px;text-align:center;border:1px solid #1E88E5;white-space:normal;position:sticky;top:var(--hdfix,0px);z-index:2;line-height:1.4;font-size:12px;letter-spacing:.5px;font-weight:600}
table.dt th.sub{background:#1565C0;font-weight:400;font-size:11px;letter-spacing:.2px}
table.dt td{padding:7px 10px;border:1px solid #e3edf7;text-align:center;white-space:nowrap;background:#fff;font-variant-numeric:tabular-nums}
table.dt td.l{text-align:left}
table.dt th.sticky-col,table.dt td.sticky-col{position:sticky;z-index:1;background:#fff}
table.dt th.sticky-col{background:#0B4F8A;z-index:3}
tr.lv-total td.sticky-col{background:#dbeafe!important}
tr.lv-subregion td.sticky-col{background:#F0F6FC!important}
tr.lv-merchant td.sticky-col{background:#f8fafe!important}
tr.lv-site:hover td.sticky-col{background:#f0f7ff!important}
td.sticky-col.cell-good{background:#e8f5e9!important}
td.sticky-col.cell-bad{background:#ffebee!important}
table.dt th.sticky-last,table.dt td.sticky-last{border-right:2px solid #0B4F8A!important;box-shadow:2px 0 4px rgba(11,79,138,.15)}
tr.lv-total td{background:#dbeafe!important;font-weight:700;color:#0A3D6B;font-size:13px;border-bottom:2px solid #8FB8DA}
tr.lv-subregion td{background:#F0F6FC!important;font-weight:700;color:#0B4F8A}
tr.lv-merchant td{background:#f8fafe!important;font-weight:500;color:#1E88E5;font-style:italic}
tr.lv-site td{background:#fff}
tr.lv-site:nth-child(even) td{background:#f8fafc}
tr.lv-site:hover td{background:#f0f7ff}
.rg{background:#e8f5e9!important;color:#2e7d32!important;font-weight:600}
.ry{background:#fff3e0!important;color:#e65100!important;font-weight:600}
.rr{background:#ffebee!important;color:#c62828!important;font-weight:600}
.rn{color:#90a4ae}
.delta-up{color:#2e7d32;font-weight:600}
.delta-down{color:#c62828;font-weight:600}
.delta-zero{color:#90a4ae;font-weight:600}
.note{font-size:11px;color:#78909c;padding:6px 16px;background:#fff;border-bottom:1px solid #d6e4f0;line-height:1.6}
</style>
<script src="monthly_summary.js"></script>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">📊 月度累计看板</div>
    <div class="header-sub">站点维度月度累计 · 高速骑手 / 护航服装 / 安全权益 / 站长安全评级（跨月对比）</div>
  </div>
  <div class="header-right">
    <div id="dataRange">数据文件: monthly_summary.js</div>
    <div>戴盔系带率 ≥ 99% &nbsp;|&nbsp; 路口超速率 ≤ 2.58% &nbsp;|&nbsp; 闯红灯率 ≤ 16.23% &nbsp;|&nbsp; 里程逆行率 ≤ 2.45% &nbsp;|&nbsp; 工装检核率 ≥ 80% &nbsp;|&nbsp; 美团工服率 ≥ 92%</div>
  </div>
</div>

<div class="filter-bar">
  <label>统计月份</label>
  <select id="monthSel" onchange="renderAll()"></select>
  <span class="hint" id="monthHint"></span>
  <div style="flex:1"></div>
  <button class="btn btn-secondary" onclick="exportTable()">⬇ 导出Excel</button>
</div>

<div class="summary-row" id="summaryRow"></div>

<div class="filter-bar">
  <label>大区</label>
  <div class="ms-wrap" id="msf-region"><div class="ms-btn" onclick="toggleMs('msf-region')"><span class="ms-label">全部</span><span class="ms-arrow">▾</span></div><div class="ms-drop" id="msf-region-drop"></div></div>
  <label>区域</label>
  <div class="ms-wrap" id="msf-subregion"><div class="ms-btn" onclick="toggleMs('msf-subregion')"><span class="ms-label">全部</span><span class="ms-arrow">▾</span></div><div class="ms-drop" id="msf-subregion-drop"></div></div>
  <label>城市</label>
  <div class="ms-wrap" id="msf-city"><div class="ms-btn" onclick="toggleMs('msf-city')"><span class="ms-label">全部</span><span class="ms-arrow">▾</span></div><div class="ms-drop" id="msf-city-drop"></div></div>
  <label>站点</label>
  <div class="ms-wrap" id="msf-site"><div class="ms-btn" onclick="toggleMs('msf-site')"><span class="ms-label">全部</span><span class="ms-arrow">▾</span></div><div class="ms-drop" id="msf-site-drop"></div></div>
  <button class="btn btn-secondary" onclick="clearMsFilter()">清除筛选</button>
  <span id="msFilterCount" style="color:#4F6E87;font-size:12px;margin-left:4px"></span>
</div>

<div class="tab-bar">
  <div class="tab-item active" data-tab="safety" onclick="switchTab('safety')">🛡️ 安全权益</div>
  <div class="tab-item" data-tab="rating" onclick="switchTab('rating')">🏅 站长安全评级</div>
  <div class="tab-item" data-tab="highway" onclick="switchTab('highway')">⚡ 高速骑手</div>
  <div class="tab-item" data-tab="clothing" onclick="switchTab('clothing')">👕 护航服装</div>
</div>
<div class="note" id="noteLine"></div>

<div class="panel active" id="panel-safety">
  <div class="table-wrap"><table class="dt" id="tbl-safety"><thead></thead><tbody></tbody></table></div>
</div>
<div class="panel" id="panel-rating">
  <div class="table-wrap"><table class="dt" id="tbl-rating"><thead></thead><tbody></tbody></table></div>
</div>
<div class="panel" id="panel-highway">
  <div class="table-wrap"><table class="dt" id="tbl-highway"><thead></thead><tbody></tbody></table></div>
</div>
<div class="panel" id="panel-clothing">
  <div class="table-wrap"><table class="dt" id="tbl-clothing"><thead></thead><tbody></tbody></table></div>
</div>

<script src="../_libs/exceljs.min.js"></script>
<script>
// ══════════════════════════════════════════════════════════
// 月度累计看板渲染
// 数据: window.MONTHLY_SUMMARY = {months:[...], updated, sites:[...]}
// sites 每行: {level, region, subregion, city, name, "2026-08": {
//   helmet:{num,den,rate}, speed:{num,den,rate}, redlight:{num,den,rate},
//   reverse:{num,den,rate}, clothing:{cloth:{num,den,rate},vis:{num,den,rate}},
//   high_speed:{days,pct}}}
// 跨月对比: 选中月份 cur；若存在上一归档月 prev 则附「上月值 + 环比」列
// ══════════════════════════════════════════════════════════
var MONTHLY = window.MONTHLY_SUMMARY || {months: [], sites: []};

// 四板块配置（与安全权益看板 METRIC_CFG 口径一致）
var PANELS = {
  safety: {
    title: '安全权益',
    // 阈值与「骑手交通安全四项」看板（骑手交通行为明细看板.html）完全一致：戴盔 ≥99% 绿、97~99 黄、<97 红；超速 ≤2.58% 绿、2.58~4.21 黄、>4.21 红
    metrics: [
      {key:'helmet', label:'戴盔系带率', target:99, goodHigh:true, redAt:97},
      {key:'speed', label:'路口超速率', target:2.58, goodHigh:false, redAt:4.21}
    ]
  },
  rating: {
    title: '站长安全评级',
    // 阈值与「骑手交通安全四项」看板完全一致：闯红灯 ≤16.23% 绿、16.23~27.89 黄、>27.89 红；逆行 ≤2.45% 绿、2.45~4.6 黄、>4.6 红
    metrics: [
      {key:'redlight', label:'闯红灯率', target:16.23, goodHigh:false, redAt:27.89},
      {key:'reverse', label:'里程逆行率', target:2.45, goodHigh:false, redAt:4.6}
    ]
  },
  highway: {
    title: '高速骑手',
    metrics: [
      {key:'high_speed', label:'高速超速占比', target:null, goodHigh:false}
    ]
  },
  clothing: {
    title: '护航服装',
    // 双指标（数据源 data_excluded.js 的 ESCORT_DATA，已剔除恶劣天气口径）：
    //   cloth 工装检核率 = Σcn/Σon（目标 ≥ 80%）；vis 美团工服率 = Σvc/Σto（目标 ≥ 92%）
    metrics: [
      {key:'clothing', sub:'cloth', label:'工装检核率', target:80, goodHigh:true},
      {key:'clothing', sub:'vis', label:'美团工服率', target:92, goodHigh:true}
    ]
  }
};
var LEVEL_TITLE = {total:'公司', subregion:'区域', merchant:'城市', site:'站点'};
var REGION_ORDER = ['华北一区','华北二区','华北三区','华东大区','中南大区'];
var curTab = 'safety';
var curMonth = null;
var prevMonth = null;

function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function rateVal(site, month, m){
  // m 为 metric 对象 {key, sub?}；clothing 双指标用 sub 定位 cloth/vis。返回 {v:百分比或null, has:bool}
  var mv = site[month];
  if(!mv) return {v:null, has:false};
  var o = mv[m.key];
  if(!o) return {v:null, has:false};
  var oo = m.sub ? o[m.sub] : o;
  if(!oo) return {v:null, has:false};
  if(m.key==='high_speed') return {v:oo.pct, has:oo.pct!=null};
  return {v:oo.rate, has:oo.rate!=null};
}
function anyClothingHas(s, month){
  // clothing 面板行筛选：当月 cloth/vis 任一有值即渲染
  if(month==null) return false;
  var mets = PANELS.clothing.metrics;
  for(var i=0;i<mets.length;i++){ if(rateVal(s, month, mets[i]).has) return true; }
  return false;
}
function fmtPct(v){
  if(v==null || isNaN(v)) return '<span class="rn">-</span>';
  return v.toFixed(2)+'%';
}
function rcClass(v, m){
  if(v==null || isNaN(v) || m.target==null) return '';
  if(m.goodHigh) return v>=m.target?'rg':(v>=(m.redAt!==undefined?m.redAt:m.target-5)?'ry':'rr');
  return v<=m.target?'rg':(v<=(m.redAt!==undefined?m.redAt:m.target+5)?'ry':'rr');
}
function deltaHtml(cur, prev, m){
  if(cur==null || prev==null || isNaN(cur) || isNaN(prev)) return '<span class="rn">-</span>';
  var d = cur - prev;
  if(Math.abs(d)<0.005) return '<span class="delta-zero">0.00</span>';
  var good = m.goodHigh ? d>0 : d<0;
  var cls = good ? 'delta-up' : 'delta-down';
  return '<span class="'+cls+'">'+(d>0?'+':'')+d.toFixed(2)+'</span>';
}

// ── 月份选择器 ──
function initMonthSel(){
  var sel = document.getElementById('monthSel');
  var months = MONTHLY.months || [];
  var html = '';
  months.forEach(function(m){ html += '<option value="'+m+'">'+m+'</option>'; });
  sel.innerHTML = html;
  if(months.length) curMonth = months[months.length-1];
  if(curMonth) sel.value = curMonth;   // 修复：下拉显示需与 curMonth 同步
}
function syncHint(){
  var months = MONTHLY.months || [];
  var hint = document.getElementById('monthHint');
  if(curMonth && prevMonth){
    hint.textContent = '当前列: '+curMonth+'，对比列: '+prevMonth+'（环比 = 当前月 - 对比月）';
  } else if(curMonth){
    hint.textContent = '当前仅归档 '+curMonth+' 一个月份，展示单月值（后续归档新月份后自动出现对比列）';
  } else {
    hint.textContent = '暂无归档数据';
  }
}

// ── 汇总卡片 ──
function totalCards(){
  var row = document.getElementById('summaryRow');
  var totalSite = null;
  MONTHLY.sites.forEach(function(s){ if(s.level==='total') totalSite = s; });
  var cards = [];
  if(totalSite){
    var defs = [
      {label:'戴盔系带率（累计）', key:'helmet', sub:'目标 ≥ 99%', target:99, goodHigh:true, redAt:97},
      {label:'路口超速率（累计）', key:'speed', sub:'目标 ≤ 2.58%', target:2.58, goodHigh:false, redAt:4.21},
      {label:'闯红灯率（累计）', key:'redlight', sub:'目标 ≤ 16.23%', target:16.23, goodHigh:false, redAt:27.89},
      {label:'里程逆行率（累计）', key:'reverse', sub:'目标 ≤ 2.45%', target:2.45, goodHigh:false, redAt:4.6},
      {label:'工装检核率（累计）', key:'clothing', subKey:'cloth', sub:'目标 ≥ 80%', target:80, goodHigh:true},
      {label:'美团工服率（累计）', key:'clothing', subKey:'vis', sub:'目标 ≥ 92%', target:92, goodHigh:true},
      {label:'高速超速占比（月均日占比）', key:'high_speed', sub:'站点维度', target:null, goodHigh:false}
    ];
    var mv = totalSite[curMonth] || {};
    defs.forEach(function(d){
      var o = mv[d.key] || {};
      var oo = d.subKey ? (o[d.subKey]||{}) : o;
      var v = d.key==='high_speed' ? oo.pct : oo.rate;
      var css = '';
      if(v!=null && d.target!=null){
        if(d.goodHigh) css = v>=d.target?' green':(v>=(d.redAt!==undefined?d.redAt:d.target-5)?' yellow':' red');
        else css = v<=d.target?' green':(v<=(d.redAt!==undefined?d.redAt:d.target+5)?' yellow':' red');
      }
      cards.push('<div class="card'+css+'"><div class="c-label">'+d.label+'</div><div class="c-value">'+(v==null?'<span style="color:#90a4ae">-</span>':v.toFixed(2)+'%')+'</div><div class="c-sub">'+curMonth+(d.sub?' · '+d.sub:'')+'</div></div>');
    });
  }
  var siteN = 0, subN=0, cityN=0;
  MONTHLY.sites.forEach(function(s){
    if(s.level==='site')siteN++; else if(s.level==='subregion')subN++; else if(s.level==='merchant')cityN++;
  });
  cards.push('<div class="card"><div class="c-label">层级规模</div><div class="c-value" style="font-size:17px">'+subN+' / '+cityN+' / '+siteN+'</div><div class="c-sub">区域 / 城市 / 站点（含 '+curMonth+' 数据）</div></div>');
  row.innerHTML = cards.join('');
}

// ── 多选筛选（与安全权益看板同款：大区/区域/城市/站点 级联） ──
var msfState={region:[],subregion:[],city:[],site:[]};
function getMsfVals(k){return msfState[k]||[];}
function toggleMs(wrapId){
  var wrap=document.getElementById(wrapId);
  if(!wrap)return;
  var isOpen=wrap.classList.contains('open');
  document.querySelectorAll('.ms-wrap.open').forEach(function(w){w.classList.remove('open');});
  if(!isOpen)wrap.classList.add('open');
}
document.addEventListener('click',function(e){
  if(!e.target.closest('.ms-wrap')){
    document.querySelectorAll('.ms-wrap.open').forEach(function(w){w.classList.remove('open');});
  }
});
function onMsfChange(key,cb){
  var val=cb.value;
  var sel=msfState[key]||[];
  if(cb.checked){ if(sel.indexOf(val)<0)sel.push(val); }
  else { sel=sel.filter(function(v){return v!==val;}); }
  msfState[key]=sel;
  var item=cb.parentElement;
  if(item)item.classList.toggle('checked',cb.checked);
  updateMsfLabel(key);
  initMsfOptions();
  renderAll();
}
function updateMsfLabel(key){
  var wrap=document.getElementById('msf-'+key);
  if(!wrap)return;
  var lbl=wrap.querySelector('.ms-label');
  if(!lbl)return;
  var sel=msfState[key]||[];
  lbl.textContent=sel.length===0?'全部':sel.length===1?sel[0]:sel.length+' 项已选';
}
function fillMsf(key,opts){
  var drop=document.getElementById('msf-'+key+'-drop');
  if(!drop)return;
  var sel=msfState[key]||[];
  drop.innerHTML=opts.map(function(o){
    var chk=sel.indexOf(o)>=0;
    return '<label class="ms-item'+(chk?' checked':'')+'" onclick="event.stopPropagation()"><input type="checkbox" value="'+esc(o)+'" '+(chk?'checked':'')+' onchange="onMsfChange(\''+key+'\',this)"> '+esc(o)+'</label>';
  }).join('');
  updateMsfLabel(key);
}
function initMsfOptions(){
  var sites=MONTHLY.sites;
  var selRegion=getMsfVals('region'), selSubr=getMsfVals('subregion'), selCity=getMsfVals('city');
  var allRegions=[...new Set(sites.filter(function(r){return r.level==='subregion';}).map(function(r){return r.region;}))].filter(Boolean);
  allRegions.sort(function(a,b){var i=REGION_ORDER.indexOf(a),j=REGION_ORDER.indexOf(b);if(i===-1)i=99;if(j===-1)j=99;return i-j;});
  var allSubrRows=sites.filter(function(r){return r.level==='subregion';});
  var filtSubrs=(selRegion.length?allSubrRows.filter(function(r){return selRegion.indexOf(r.region)>=0;}):allSubrRows)
    .map(function(r){return r.name;}).filter(Boolean);
  filtSubrs=[...new Set(filtSubrs)].sort(function(a,b){return a.localeCompare(b,'zh');});
  var cityRows=sites.filter(function(r){return r.level==='merchant';});
  var filtCityRows=cityRows.filter(function(r){
    if(selRegion.length&&selRegion.indexOf(r.region)<0)return false;
    if(selSubr.length&&selSubr.indexOf(r.subregion)<0)return false;
    return true;
  });
  var filtCities=[...new Set(filtCityRows.map(function(r){return r.city||r.name;}))].filter(Boolean).sort(function(a,b){return a.localeCompare(b,'zh');});
  var siteRows=sites.filter(function(r){return r.level==='site';});
  var filtSites=siteRows.filter(function(r){
    if(selRegion.length&&selRegion.indexOf(r.region)<0)return false;
    if(selSubr.length&&selSubr.indexOf(r.subregion)<0)return false;
    if(selCity.length&&selCity.indexOf(r.city)<0)return false;
    return true;
  }).map(function(r){return r.name;}).filter(Boolean);
  filtSites=[...new Set(filtSites)].sort(function(a,b){return a.localeCompare(b,'zh');});
  fillMsf('region',allRegions);
  fillMsf('subregion',filtSubrs);
  fillMsf('city',filtCities);
  fillMsf('site',filtSites);
}
function getFilteredSites(){
  var fs=msfState;
  var rows=MONTHLY.sites;
  return rows.filter(function(r){
    var lv=r.level;
    if(fs.region.length&&r.region&&fs.region.indexOf(r.region)<0)return false;
    if(fs.subregion.length){
      if(lv==='subregion'&&fs.subregion.indexOf(r.name)<0)return false;
      if(lv!=='subregion'&&r.subregion&&fs.subregion.indexOf(r.subregion)<0)return false;
    }
    if(fs.city.length){
      var cityVal=r.city||r.name||'';
      if(lv==='merchant'&&fs.city.indexOf(cityVal)<0)return false;
      if(lv==='site'&&fs.city.indexOf(r.city||'')<0)return false;
      if(lv==='subregion'){
        var matched=false;
        for(var i=0;i<rows.length;i++){
          var _r=rows[i];
          if(_r.level==='merchant'&&fs.city.indexOf(_r.city||_r.name)>=0&&_r.subregion===r.subregion){matched=true;break;}
        }
        if(!matched)return false;
      }
    }
    if(fs.site.length){
      if(lv==='site'&&fs.site.indexOf(r.name)<0)return false;
      if(lv!=='site'&&lv!=='total')return false;
    }
    return true;
  });
}
function clearMsFilter(){
  msfState={region:[],subregion:[],city:[],site:[]};
  ['region','subregion','city','site'].forEach(function(k){
    updateMsfLabel(k);
    var drop=document.getElementById('msf-'+k+'-drop');
    if(drop)drop.querySelectorAll('input[type=checkbox]').forEach(function(cb){cb.checked=false;cb.parentElement.classList.remove('checked');});

function updateMsfCount(){

}

// ── 渲染单面板表格 ──
function renderTable(tab, metrics){
  var table = document.getElementById('tbl-'+tab);
  var thead = table.querySelector('thead');
  var tbody = table.querySelector('tbody');
  var months = MONTHLY.months || [];
  if(!curMonth || months.indexOf(curMonth)<0) curMonth = months.length?months[months.length-1]:null;
  var idx = curMonth ? months.indexOf(curMonth) : -1;
  prevMonth = idx>0 ? months[idx-1] : null;

  // thead
  var head = '<tr>';
  var stickyOffsets = [0,80,150,230];
  head += '<th style="min-width:70px;left:'+stickyOffsets[0]+'px" class="sticky-col">大区</th>';
  head += '<th style="min-width:80px;left:'+stickyOffsets[1]+'px" class="sticky-col">区域</th>';
  head += '<th style="min-width:70px;left:'+stickyOffsets[2]+'px" class="sticky-col">城市</th>';
  head += '<th style="min-width:220px;left:'+stickyOffsets[3]+'px;text-align:left" class="sticky-col sticky-last">名称</th>';
  metrics.forEach(function(m){
    head += '<th>'+esc(m.label)+'<br><small style="color:#B3D0E8">'+curMonth+(m.target!=null?' · 目标'+(m.goodHigh?'≥':'≤')+m.target:'')+'</small></th>';
    if(prevMonth) head += '<th>'+esc(m.label)+'（上月）<br><small style="color:#B3D0E8">'+prevMonth+'</small></th>';
    if(prevMonth) head += '<th>环比<br><small style="color:#B3D0E8">百分点</small></th>';
  });
  head += '</tr>';
  thead.innerHTML = head;

  // tbody
  var fSites = getFilteredSites();
  var trs = [];
  fSites.forEach(function(s){
    if(tab==='clothing'){
      // 服装板块仅渲染当月/上月 cloth 或 vis 任一有数据的层级/站点
      var has = anyClothingHas(s, curMonth) || anyClothingHas(s, prevMonth);
      if(!has) return;
    }
    var lv = s.level || 'site';
    var nameCell;
    if(lv==='total') nameCell = esc(s.name);
    else if(lv==='subregion') nameCell = esc(s.name);
    else if(lv==='merchant') nameCell = esc(s.name);
    else nameCell = esc(s.name);
    var regionTxt = lv==='total' ? '' : esc(s.region||'');
    var subrTxt = lv==='site'||lv==='merchant' ? esc(s.subregion||'') : (lv==='subregion'?'':esc(s.subregion||''));
    var cityTxt = lv==='site' ? esc(s.city||'') : '';
    var tr = '<tr class="lv-'+lv+'">';
    tr += '<td class="sticky-col" style="left:0px">'+regionTxt+'</td>';
    tr += '<td class="sticky-col" style="left:80px">'+subrTxt+'</td>';
    tr += '<td class="sticky-col" style="left:150px">'+cityTxt+'</td>';
    tr += '<td class="sticky-col sticky-last l" style="left:230px">'+nameCell+'</td>';
    metrics.forEach(function(m){
      var c = rateVal(s, curMonth, m);
      var cls = rcClass(c.v, m);
      tr += '<td class="'+(cls?cls:'')+'">'+fmtPct(c.v)+'</td>';
      if(prevMonth){
        var p = rateVal(s, prevMonth, m);
        tr += '<td>'+fmtPct(p.v)+'</td>';
        tr += '<td>'+deltaHtml(c.v, p.v, m)+'</td>';
      }
    });
    tr += '</tr>';
    trs.push(tr);
  });
  tbody.innerHTML = trs.join('');
  document.getElementById('noteLine').textContent =
    '口径说明：戴盔系带率/路口超速率/闯红灯率/里程逆行率 累计率 = 分子合计 ÷ 分母合计；工装检核率 = 可检核人数合计 ÷ 有完成单人数合计、美团工服率 = 订单视觉覆盖合计 ÷ 配送完成运单合计（护航服装已剔除恶劣天气口径，目标：工装检核率 ≥ 80%、美团工服率 ≥ 92%）；高速超速占比源数据无分子分母，按当月每日占比均值 ×100（日占比均值口径）。配色阈值与「骑手交通安全四项」看板一致：戴盔 ≥99% 绿 / 97~99 黄 / <97 红；超速 ≤2.58% 绿 / 2.58~4.21 黄 / >4.21 红；闯红灯 ≤16.23% 绿 / 16.23~27.89 黄 / >27.89 红；逆行 ≤2.45% 绿 / 2.45~4.6 黄 / >4.6 红。' +
    (prevMonth ? ' 当前对比：'+curMonth+' 与 '+prevMonth+'。' : ' 当前仅 '+curMonth+' 单月，展示单月值。');
}

// ── 导出 Excel（ExcelJS：完整支持样式/冻结/合并/筛选；一次导出 4 个 tab） ──
// 每个 sheet 布局复刻看板：标题栏 → 汇总 KPI 卡片区 → 两级表头 → 层级数据行
// 配色/阈值/口径与页面渲染完全同源（rcClass / rateVal / getFilteredSites / anyClothingHas）
// 注：SheetJS(xlsx) 社区版写入不支持 cell.s 样式，故样式/冻结走 ExcelJS
var XL_C = {
  headBg:'FF0B4F8A', headSub:'FF1565C0', headBd:'FF1E88E5',
  cardBg:'FFF0F6FC', cardBd:'FFD6E4F0', cardFg:'FF4F6E87',
  goodBg:'FFE8F5E9', goodFg:'FF2E7D32',
  warnBg:'FFFFF3E0', warnFg:'FFE65100',
  badBg:'FFFFEBEE', badFg:'FFC62828',
  lvTotBg:'FFDBEAFE', lvTotFg:'FF0A3D6B',
  lvSubBg:'FFF0F6FC', lvSubFg:'FF0B4F8A',
  lvMerBg:'FFF8FAFE', lvMerFg:'FF1E88E5',
  zebra:'FFF8FAFC', cellBd:'FFE3EDF7',
  mute:'FF90A4AE', text:'FF1A2E45', white:'FFFFFFFF', headSubFg:'FFB3D0E8'
};
function xlBd(c){ var b={style:'thin', color:{argb:c}}; return {top:b, bottom:b, left:b, right:b}; }
function xlFill(c){ return {type:'pattern', pattern:'solid', fgColor:{argb:c}}; }
function xlFont(o){ return Object.assign({name:'Microsoft YaHei'}, o); }
function xlSet(ws, r, c, val, st){
  var cell = ws.getCell(r, c);
  if(val!==undefined && val!==null) cell.value = val;
  if(st){
    if(st.fill) cell.fill = st.fill;
    if(st.font) cell.font = xlFont(st.font);
    if(st.alignment) cell.alignment = st.alignment;
    if(st.border) cell.border = st.border;
    if(st.numFmt) cell.numFmt = st.numFmt;
  }
  return cell;
}
function xlKpiCss(v, d){
  if(v==null || d.target==null) return null;
  if(d.goodHigh) return v>=d.target?'green':(v>=(d.redAt!==undefined?d.redAt:d.target-5)?'yellow':'red');
  return v<=d.target?'green':(v<=(d.redAt!==undefined?d.redAt:d.target+5)?'yellow':'red');
}
async function buildPanelSheet(wb, tab, metrics, cur, pv, totalSite, lvN){

  });
  var NC = 16;                                    // KPI 卡片区总宽（8 卡 × 2 列）
  var span = pv?3:1;                              // 每指标列数（当月/上月/环比）
  var lastCol = Math.max(NC, 4 + metrics.length*span);

  for(var c3=6;c3<=lastCol;c3++)

  // ── 行3-5：汇总 KPI 卡片区（口径与页面 summary-row 一致） ──
  var kpiDefs = [
    {label:'戴盔系带率（累计）', key:'helmet', sub:'目标 ≥ 99%', target:99, goodHigh:true, redAt:97},
    {label:'路口超速率（累计）', key:'speed', sub:'目标 ≤ 2.58%', target:2.58, goodHigh:false, redAt:4.21},
    {label:'闯红灯率（累计）', key:'redlight', sub:'目标 ≤ 16.23%', target:16.23, goodHigh:false, redAt:27.89},
    {label:'里程逆行率（累计）', key:'reverse', sub:'目标 ≤ 2.45%', target:2.45, goodHigh:false, redAt:4.6},
    {label:'工装检核率（累计）', key:'clothing', subKey:'cloth', sub:'目标 ≥ 80%', target:80, goodHigh:true},
    {label:'美团工服率（累计）', key:'clothing', subKey:'vis', sub:'目标 ≥ 92%', target:92, goodHigh:true},
    {label:'高速超速占比（月均日占比）', key:'high_speed', sub:'站点维度', target:null, goodHigh:false}
  ];
  var mv = totalSite ? (totalSite[cur] || {}) : {};
  for(var k=0;k<8;k++){
    var kc = k*2+1, isScale = (k>=kpiDefs.length);
    var lbl = isScale ? '层级规模' : kpiDefs[k].label;

    else {

      var oo = d.subKey ? (o[d.subKey]||{}) : o;
      var v = d.key==='high_speed' ? oo.pct : oo.rate;
      val = v==null ? '-' : v;
      css = xlKpiCss(v, d);
      sub = cur + (d.sub?' · '+d.sub:'');
    }
    var bg = css==='green'?XL_C.goodBg : css==='yellow'?XL_C.warnBg : css==='red'?XL_C.badBg : XL_C.cardBg;
    var fg = css==='green'?XL_C.goodFg : css==='yellow'?XL_C.warnFg : css==='red'?XL_C.badFg : XL_C.headBg;
    xlSet(ws, 3, kc, lbl, {fill:xlFill(XL_C.cardBg), font:{size:10, color:{argb:XL_C.cardFg}},
      alignment:{horizontal:'center', vertical:'middle', wrapText:true}, border:xlBd(XL_C.cardBd)});
    xlSet(ws, 3, kc+1, null, {fill:xlFill(XL_C.cardBg), border:xlBd(XL_C.cardBd)});
    xlSet(ws, 4, kc, val, {fill:xlFill(bg), font:{bold:true, size:16, color:{argb:fg}},

  });
  for(var hc=0;hc<lastCol;hc++){

      font:{bold:true, size:12, color:{argb:XL_C.white}},
      alignment:{horizontal:'center', vertical:'middle', wrapText:true}, border:xlBd(XL_C.headBd)});
    xlSet(ws, 8, hc+1, h2[hc]||null, {fill:xlFill(XL_C.headSub),
      font:{size:10, color:{argb:XL_C.headSubFg}},
      alignment:{horizontal:'center', vertical:'middle', wrapText:true}, border:xlBd(XL_C.headBd)});
  }
  for(var fc=0;fc<4;fc++){
    ws.mergeCells(7, fc+1, 8, fc+1);

  for(var mi=0;mi<metrics.length;mi++){
    var mc = 4 + mi*span + 1;
    if(pv) ws.mergeCells(7, mc, 7, mc+2);

  // ── 行9+：数据行（层级配色 + 斑马纹 + 阈值三色，与页面 CSS 同源） ──
  var validRows = [];

  for(var ri=0;ri<validRows.length;ri++){
    var s = validRows[ri], row = 9 + ri;
    var lv = s.level || 'site';
    var zebra = (lv==='site') && (s._zi % 2 === 1);
    var base = {alignment:{horizontal:'center', vertical:'middle'}, border:xlBd(XL_C.cellBd),
                font:{size:11, color:{argb:XL_C.text}}};
    if(lv==='total'){ base.fill = xlFill(XL_C.lvTotBg); base.font = {size:12, bold:true, color:{argb:XL_C.lvTotFg}}; }
    else if(lv==='subregion'){ base.fill = xlFill(XL_C.lvSubBg); base.font = {size:11, bold:true, color:{argb:XL_C.lvSubFg}}; }
    else if(lv==='merchant'){ base.fill = xlFill(XL_C.lvMerBg); base.font = {size:11, italic:true, color:{argb:XL_C.lvMerFg}}; }
    else if(zebra){ base.fill = xlFill(XL_C.zebra); }
    // 前置 4 列
    xlSet(ws, row, 1, lv==='total'?'':(s.region||''), base);
    xlSet(ws, row, 2, (lv==='site'||lv==='merchant')?(s.subregion||''):'', base);
    xlSet(ws, row, 3, lv==='site'?(s.city||''):'', base);
    var nameSt = JSON.parse(JSON.stringify(base));
    nameSt.alignment = {horizontal:'left', vertical:'middle', indent:1};
    xlSet(ws, row, 4, s.name||'', nameSt);
    // 指标列
    metrics.forEach(function(m, mIdx){
      var mc0 = 4 + mIdx*span;   // 0-based 列偏移
      var c = rateVal(s, cur, m);
      var st = JSON.parse(JSON.stringify(base));
      st.numFmt = '0.00"%"';
      if(lv==='site'){
        var cls = rcClass(c.v, m);

        else if(cls==='rr'){ st.fill = xlFill(XL_C.badBg); st.font = {size:11, bold:true, color:{argb:XL_C.badFg}}; }
      }
      xlSet(ws, row, mc0+1, c.v==null?null:c.v, st);
      if(pv){
        var p = rateVal(s, pv, m);
        var st2 = JSON.parse(JSON.stringify(base));
        st2.numFmt = '0.00"%"';
        if(lv==='site'){
          var cls2 = rcClass(p.v, m);
          if(cls2==='rg'){ st2.fill = xlFill(XL_C.goodBg); st2.font = {size:11, bold:true, color:{argb:XL_C.goodFg}}; }
          else if(cls2==='ry'){ st2.fill = xlFill(XL_C.warnBg); st2.font = {size:11, bold:true, color:{argb:XL_C.warnFg}}; }
          else if(cls2==='rr'){ st2.fill = xlFill(XL_C.badBg); st2.font = {size:11, bold:true, color:{argb:XL_C.badFg}}; }
        }
        xlSet(ws, row, mc0+2, p.v==null?null:p.v, st2);

        if(dv!=null){
          var good = m.goodHigh ? dv>0 : dv<0;
          if(Math.abs(dv)<0.005) st3.font = {size:11, color:{argb:XL_C.mute}};
          else st3.font = {size:11, bold:true, color:{argb: good?XL_C.goodFg:XL_C.badFg}};
        }
        xlSet(ws, row, mc0+3, dv, st3);
      }
    });
  }
  // 自动筛选挂表头第二行
  if(validRows.length) ws.autoFilter = {from:{row:8, column:1}, to:{row:8+validRows.length, column:lastCol}};
  return ws;
}

  if(!curMonth){ alert('暂无归档数据可导出'); return; }
  var idx = months.indexOf(curMonth);
  var pv = idx>0?months[idx-1]:null;
  var totalSite=null, siteN=0, subN=0, cityN=0;
  MONTHLY.sites.forEach(function(s){
    if(s.level==='total') totalSite=s;
    else if(s.level==='subregion') subN++;
    else if(s.level==='merchant') cityN++;
    else if(s.level==='site') siteN++;
  });
  var tabOrder = [curTab];   // 当前 tab 的 sheet 排最前（打开文件默认停在该 sheet）
  Object.keys(PANELS).forEach(function(k){ if(k!==curTab) tabOrder.push(k); });
  try{
    var wb = new ExcelJS.Workbook();
    wb.creator = '兴达履约工作台';
    wb.created = new Date();
    for(var i=0;i<tabOrder.length;i++){
      await buildPanelSheet(wb, tabOrder[i], PANELS[tabOrder[i]].metrics, curMonth, pv, totalSite,
        {subN:subN, cityN:cityN, siteN:siteN});
    }
    var buf = await wb.xlsx.writeBuffer();
    var blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '月度累计看板_'+curMonth+'.xlsx';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }catch(e){
    alert('导出失败：' + (e && e.message ? e.message : e));
  }
}

// init
(function(){
  if(!MONTHLY.months || !MONTHLY.months.length){
    document.getElementById('monthSel').innerHTML = '<option>暂无数据</option>';
    document.getElementById('summaryRow').innerHTML = '<div class="card"><div class="c-label">提示</div><div class="c-value" style="font-size:15px">monthly_summary.js 暂无归档月份</div><div class="c-sub">请先运行 monthly_archive.py 归档</div></div>';
    return;
  }
  initMonthSel();
  renderAll();
})();
</script>
<script>
(function(){
  var raf=0;
  function pgfix(){
    raf=0;
    var bar=null;
    var els=document.querySelectorAll('.header,.tab-bar');
    for(var i=0;i<els.length;i++){
      var el=els[i];
      if(el.offsetHeight>0&&getComputedStyle(el).position==='sticky'){bar=el;break;}
    }
    var d=0;
    if(bar){
      var b=bar.getBoundingClientRect().bottom;
      var ws=document.querySelectorAll('.table-wrap');
      for(var j=0;j<ws.length;j++){
        var w=ws[j];
        if(w.clientHeight>0){
          var t=w.getBoundingClientRect().top;
          if(b-t>d)d=b-t;
        }
      }
    }
    var rs=document.documentElement.style;
    if(d>0.5)rs.setProperty('--hdfix',d.toFixed(1)+'px');else rs.removeProperty('--hdfix');
  }
  function onS(){if(!raf)raf=requestAnimationFrame(pgfix);}
  window.addEventListener('scroll',onS,{passive:true});
  window.addEventListener('resize',onS);
  pgfix();
})();
</script>
